name: PR labels

# 変更したファイルから「領域」「安全ゲート」を、変更行数から「size」を付ける。
# pull_request_target で base 側の設定だけを使い、PR のコードは checkout も実行もしない。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    # base 変更時は差分を再評価する。本文・タイトル編集だけでは API を呼ばない。
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # 対応判断ラベルは同期削除から分離し、手動付与も保持する。
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          configuration-path: .github/labeler-safety.yml
          sync-labels: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
      - name: Apply size label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.additions }}+${{ github.event.pull_request.deletions }}
        run: |
          set -euo pipefail
          total=$(( CHANGED ))
          if   (( total < 50 ));   then size="size: XS"
          elif (( total < 200 ));  then size="size: S"
          elif (( total < 500 ));  then size="size: M"
          elif (( total < 1000 )); then size="size: L"
          else                          size="size: XL"
          fi
          current=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          while IFS= read -r name; do
            if [[ "$name" == size:* && "$name" != "$size" ]]; then
              gh pr edit "$PR" --remove-label "$name"
            fi
          done <<< "$current"
          if ! grep -qxF "$size" <<< "$current"; then
            gh pr edit "$PR" --add-label "$size"
          fi
