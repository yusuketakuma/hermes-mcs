name: focused-ci-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"
      - name: Prepare isolated test runtime
        run: |
          uv venv --python 3.14 --managed-python .venv
          uv pip install --python .venv/bin/python "pytest==9.2.0"
          .venv/bin/python -c 'import platform, sqlite3; print("python", platform.python_version(), "sqlite", sqlite3.sqlite_version)'
      - name: Check synthetic approval deadline safety
        run: |
          sh scripts/run_tests.sh \
            'tests/llm/test_cloud_local_rebuild.py::test_approval_checks_the_deadline_during_and_after_reproof' \
            'tests/llm/test_cloud_local_rebuild.py::test_sqlite_interrupt_during_reproof_rejects_the_whole_bundle' \
            'tests/llm/test_cloud_local_rebuild.py::test_an_expired_approval_records_its_rejection_and_clears_the_deadline' \
            -r fEsP --durations=10
