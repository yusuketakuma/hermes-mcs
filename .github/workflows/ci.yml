name: focused-notify-diagnostic

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA to test
        required: true
        type: string
      mode:
        description: Regression before fix or relevant notification batch
        required: true
        type: choice
        options:
          - red
          - green

permissions:
  contents: read

jobs:
  notify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"
      - name: Verify test revision
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          python3 -c 'import os,re,subprocess; s=os.environ["EXPECTED_REVISION"]; assert re.fullmatch(r"[0-9a-f]{40}",s); assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==s; print("tested revision:",s)'
      - name: Prepare isolated test runtime
        run: |
          uv venv --python 3.14 --managed-python .venv
          uv pip install --python .venv/bin/python "pytest==9.2.0"
      - name: Reproduce receipt-order regression
        if: inputs.mode == 'red'
        env:
          MCS_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: >-
          sh scripts/run_tests.sh
          tests/notify/test_card_attachment_followups.py::test_a_followup_held_before_the_first_updates_thread_receipt_replans_once_it_lands
          tests/notify/test_card_attachment_followups.py::test_a_non_identity_held_update_waits_for_the_delivered_render_before_it
          -r fEs --durations=10
      - name: Validate notification regression batch
        if: inputs.mode == 'green'
        env:
          MCS_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          sh scripts/run_tests.sh \
            tests/notify/test_card_attachment_followups.py \
            tests/notify/test_card_part_resolve.py \
            tests/notify/test_notify_card_presentation.py \
            tests/notify/test_notify_cards.py \
            tests/notify/test_notify_parts.py \
            tests/notify/test_pending_wait_reasons.py \
            tests/notify/test_signal_thread_hotfix.py \
            tests/notify/test_slack_reply_attachment_migration.py \
            tests/notify/test_attachment_upload_identity.py \
            tests/adapters/slack/test_slack_reply_cards.py \
            -r fEs --durations=10
