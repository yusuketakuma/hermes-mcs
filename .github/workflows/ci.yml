name: focused-notify-diagnostic

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA to test
        required: true
        type: string
      mode:
        description: Diagnostic test selection
        required: true
        type: choice
        options:
          - red
          - recheck
          - green
          - refactor

permissions:
  contents: read

jobs:
  notify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"
      - name: Verify test revision
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          python3 -c 'import os,re,subprocess; s=os.environ["EXPECTED_REVISION"]; assert re.fullmatch(r"[0-9a-f]{40}",s); assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==s; print("tested revision:",s)'
      - name: Prepare isolated test runtime
        run: |
          uv venv --python 3.14 --managed-python .venv
          uv pip install --python .venv/bin/python "pytest==9.2.0"
      - name: Reproduce receipt-order regression
        if: inputs.mode == 'red'
        env:
          MCS_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: >-
          sh scripts/run_tests.sh
          tests/notify/test_card_attachment_followups.py::test_a_followup_held_before_the_first_updates_thread_receipt_replans_once_it_lands
          tests/notify/test_card_attachment_followups.py::test_a_non_identity_held_update_waits_for_the_delivered_render_before_it
          -r fEs --durations=10
      - name: Recheck attachment identity failures
        if: inputs.mode == 'recheck'
        env:
          MCS_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          sh scripts/run_tests.sh \
            'tests/notify/test_attachment_upload_identity.py::test_collected_upload_with_insufficient_or_conflicting_evidence_is_held[unknown]' \
            'tests/notify/test_attachment_upload_identity.py::test_collected_upload_with_insufficient_or_conflicting_evidence_is_held[pending_delivered]' \
            'tests/notify/test_attachment_upload_identity.py::test_missing_prior_receipt_blocks_new_upload_even_if_later_caption_delivered[unknown_same_part]' \
            'tests/notify/test_attachment_upload_identity.py::test_missing_prior_receipt_blocks_new_upload_even_if_later_caption_delivered[unknown_same_attachment]' \
            -r fEs --durations=10
      - name: Validate notification regression batch
        if: inputs.mode == 'green'
        env:
          MCS_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          sh scripts/run_tests.sh \
            tests/notify/test_card_attachment_followups.py \
            tests/notify/test_card_part_resolve.py \
            tests/notify/test_notify_card_presentation.py \
            tests/notify/test_notify_cards.py \
            tests/notify/test_notify_parts.py \
            tests/notify/test_pending_wait_reasons.py \
            tests/notify/test_signal_thread_hotfix.py \
            tests/notify/test_slack_reply_attachment_migration.py \
            tests/notify/test_attachment_upload_identity.py \
            tests/adapters/slack/test_slack_reply_cards.py \
            -r fEs --durations=10
      - name: Lint refactored modules
        if: inputs.mode == 'refactor' && matrix.os == 'ubuntu-latest'
        run: >-
          uv run --no-project --with "ruff==0.17.3" ruff check
          mcs/ingest/job_ops.py mcs/notify/notify_parts.py mcs/semantic/semantic_loops.py
      - name: Validate refactored paths
        if: inputs.mode == 'refactor'
        env:
          MCS_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          sh scripts/run_tests.sh \
            tests/ingest/test_job_drain.py \
            tests/ingest/test_history_command_deepen.py \
            tests/ingest/test_initial_history_capture.py \
            tests/ingest/test_deadline_cut_job_attempts.py \
            tests/ingest/test_reply_jobs_cmd_quarantine_housekeeping.py \
            tests/ingest/test_derive_transaction_ownership.py \
            tests/ingest/test_job_discovery_archive.py \
            tests/ingest/test_history_session_expiry_not_stall.py \
            tests/semantic/test_semantic_loop_generations.py \
            tests/semantic/test_semantic_loop_poison_history.py \
            tests/semantic/test_update_loops_targets.py \
            tests/semantic/test_loop_reinterpretation.py \
            tests/semantic/test_loop_relation_rejected.py \
            tests/semantic/test_loop_fork_skips_reinterpreted_origin.py \
            tests/semantic/test_semantic_loop_view.py \
            tests/semantic/test_loop_only_readiness.py \
            tests/notify/test_provider_visibility_manifest.py \
            tests/notify/test_chat_format_v1.py \
            tests/notify/test_notify_lineworks.py \
            tests/notify/test_notify_parts.py \
            tests/notify/test_card_attachment_followups.py \
            tests/adapters/lineworks/test_lineworks_chat_format.py \
            -r fEs --durations=10
