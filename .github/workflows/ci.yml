name: ci

on:
  # release gate only: the full suite runs for a vX.Y.Z tag, a pull request,
  # the weekly schedule or a manual dispatch — never for a plain push to main
  push:
    tags: ['v*']
  # ready_for_review and the full-ci label start the full run of a draft;
  # the scope job decides what each pull request run needs (ci/ci_scope.py)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # weekly run on main: a runner image, Python patch or SQLite update that
  # breaks the suite surfaces without waiting for the next release
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read   # read-only everywhere: no job pushes to the repository

concurrency:
  group: ci-${{ github.ref }}
  # A label other than full-ci does not change what a run tests, so its run
  # waits for the running one instead of cancelling it. It is not cut short
  # either: a run that skipped everything would report green gates for the
  # same head SHA and could replace a real result in the required checks.
  cancel-in-progress: ${{ !(contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && github.event.label.name != 'full-ci') }}

jobs:
  publication-request:
    # W12: tag push時のみ、後続のrelease-publish workflowへ渡す非信頼hintを出力。
    # 値はrepo ID/tag/tag OID/source SHA/upstream run ID/attemptのみで4KiB未満。
    # 権威ある照合(tag peel・repo/owner ID・acceptance)はpublisher側identifyが行い、
    # このartifactを信用しない。plain main push/PR/schedule/dispatchでは動かない。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Hosted jobs have independent empty workspaces. Read only the triggering
      # tag's source; this untrusted hint never grants publication authority.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: write publication request hint
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          HEAD_COMMIT_ID: ${{ github.event.head_commit.id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/development/publication_request.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: publication-request
          path: publication-request.json
          retention-days: 7
          if-no-files-found: error

  scope:
    # full | docs | draft, read by the job conditions and the gates.
    # Only a pull request is classified (ci/ci_scope.py); a vX.Y.Z tag, the
    # schedule and a manual run are always full by this expression, so the
    # release gate never depends on a script.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ github.event_name == 'pull_request' && steps.pr.outputs.mode || 'full' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the pull_request merge commit and its first parent (the base)
          fetch-depth: 2
          persist-credentials: false
      - name: classify pull request
        id: pr
        if: github.event_name == 'pull_request'
        env:
          MCS_CI_DRAFT: ${{ github.event.pull_request.draft }}
          MCS_CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # HEAD^2 of the merge commit must be this, or the run is full
          MCS_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ci/ci_scope.py

  lint:
    # ruff, the medicine-master bundle and the generated docs in every mode,
    # beside the tests so a lint failure reports within minutes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          cache-dependency-glob: |
            Makefile
            .github/workflows/ci.yml
            deployment/requirements-standalone.txt
      - name: ruff
        # Lint scope and the ruff pin live in the Makefile.
        run: make lint
      - name: Check bundled public medicine master
        run: python3 scripts/development/check_drug_master_bundle.py

  pytest-linux:
    # tests/ and integration/ as slices x shards. The partition is fixed here
    # (never sized by a runner's CPUs) so every slice computes the same plan:
    # full runs 4 slices x 2 shards = 8 shards (2 vCPU private runners), docs
    # mode 1 slice x 2 shards over the document-related tests only. The
    # lint-test gate checks the union of the slices' shard reports.
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    # The 2026-11-01 suite was still progressing at 93% after 45 min.
    # Keep the per-test MCS_TEST_TIMEOUT guard and bound each slice.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.scope.outputs.mode == 'full' && '[1, 2, 3, 4]' || '[1]') }}
    env:
      MCS_CI_SLICE: ${{ matrix.slice }}
      MCS_CI_SLICES: ${{ needs.scope.outputs.mode == 'full' && '4' || '1' }}
      MCS_CI_PER_SLICE: "2"
      MCS_CI_TEST_SCOPE: ${{ needs.scope.outputs.mode }}
      # perf-marked budget tests run on tags, the schedule and manual runs only
      MCS_CI_SKIP_PERF: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          cache-python: true
          cache-dependency-glob: |
            Makefile
            .github/workflows/ci.yml
            deployment/requirements-standalone.txt
      # no -x: every failure of the run is reported, not only the first
      - name: pytest
        run: |
          uv venv --python 3.14 --managed-python .venv
          uv pip install --python .venv/bin/python "pytest==9.2.0"
          python3 ci/run_pytest_groups.py linux --slice "$MCS_CI_SLICE/$MCS_CI_SLICES" --per-slice "$MCS_CI_PER_SLICE"
      # small fixed-name artifact for the gate; a re-run of this slice replaces it
      - name: shard reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pytest-report-linux-${{ matrix.slice }}
          path: ${{ runner.temp }}/mcs-pytest-*/shard-*.report.json
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - name: pytest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pytest-linux-${{ matrix.slice }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcs-pytest-*/
          retention-days: 7
          if-no-files-found: ignore

  lint-test:
    # Required check and release lane: judges lint and every pytest-linux
    # slice (ci/ci_gate.py lists the skips each mode allows), then proves the
    # slices' shard reports cover the collected tests exactly once. A missing
    # report fails closed; an artifact-storage failure is an infrastructure
    # failure (docs/development/RELEASE_NOTES.md: ci_local.sh fallback).
    needs: [scope, lint, pytest-linux]
    # judge after a failure too, but not a run cancelled by a newer push
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: gate
        id: gate
        env:
          MCS_CI_NEEDS: ${{ toJSON(needs) }}
          MCS_CI_GATE_DIR: ${{ runner.temp }}/ci-gate
        run: python3 ci/ci_gate.py lint-test
      - name: download shard reports
        if: steps.gate.outputs.tests == 'ran'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: pytest-report-linux-*
          path: ${{ runner.temp }}/ci-gate/reports
          merge-multiple: true
      - name: verify shard reports
        if: steps.gate.outputs.tests == 'ran'
        env:
          MCS_CI_REPORTS: ${{ runner.temp }}/ci-gate/reports
          MCS_CI_SLICES: ${{ needs.scope.outputs.mode == 'full' && '4' || '1' }}
          MCS_CI_PER_SLICE: "2"
        run: python3 ci/run_pytest_groups.py linux --verify-reports "$MCS_CI_REPORTS" --slices "$MCS_CI_SLICES" --per-slice "$MCS_CI_PER_SLICE"
      # one artifact per lane for the release acceptance: verdict + verified reports
      - name: gate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ci-gate-lint-test
          path: ${{ runner.temp }}/ci-gate/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the generated-docs step compares with the merge base
      - name: offline label migration regression
        run: python3 scripts/development/check_labels_sync.py
      - name: no secrets or data dirs tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(data/|chrome-profile/|\.env$|\.env\.[^/]*$|config\.json$|config\.json\.[^/]*$|token_cache\.json$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::forbidden files tracked:"; echo "$bad"; exit 1
          fi
      - name: no stale adapter/ references
        run: |
          bad=$(grep -rnE '(^|[^[:alnum:]_])adapter/' --include='*.py' --include='*.sh' \
                mcs/ tests/ hermes_plugin/ adapters/ lineworks_adapter/ mcs_standalone/ integration/ install.sh || true)
          if [ -n "$bad" ]; then
            echo "::error::stale adapter/ references:"; echo "$bad"; exit 1
          fi
      - name: secret pattern scan
        run: |
          bad=$(git ls-files -z | xargs -0 grep -lnE \
                '(xox[baprs]-[0-9A-Za-z-]+|xapp-[0-9]-[A-Z0-9]{8,}-[0-9]+-[0-9a-f]{20,}|ghp_[0-9A-Za-z]{36}|sk-[0-9A-Za-z]{20,}|BEGIN [A-Z ]*PRIVATE KEY)' || true)
          # One public signature happens to contain a key-like substring; exempt only these reviewed bytes.
          public_vectors=adapters/sdc/contracts/releases/signature-vectors.json
          public_vectors_sha=$(python3 -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$public_vectors")
          if [ "$public_vectors_sha" = 6c33fb6823f2c784f126b6b6f3be6ab3dd3e9c17882fba100ba22a08f1b31379 ]; then
            bad=$(printf '%s\n' "$bad" | grep -vFx "$public_vectors" || true)
          fi
          if [ -n "$bad" ]; then
            echo "::error::possible secret committed:"; echo "$bad"; exit 1
          fi
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh scripts/development/*.sh scripts/evaluation/*.sh deployment/scripts/*.sh deployment/install/*.sh
      - name: plugin manifest sanity
        run: |
          grep -q "kind: standalone" hermes_plugin/plugin.yaml
          grep -q "register" hermes_plugin/__init__.py
      # Keep the existing Python version and commands, but do not wait for the
      # long Linux suite (or let its failure hide documentation drift).
      # workflow_dispatch is how main-sync re-runs CI after merging main into a PR.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        with:
          python-version: "3.14"
      # README.md must be regenerated in the PR; DEVELOPMENT.md's generated
      # tables must be left as the base has them (main-sync rewrites them on main).
      - name: check generated docs on PR
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          base=$(git merge-base HEAD "origin/$BASE_REF")
          python3 scripts/development/update_readme.py --check --base "$base"

  standalone-sdk:
    # runtime_mode=standalone against the exact SDK pins install.sh puts in
    # ~/.mcs/venv — offline: only each SDK's HTTP session is faked
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          cache-dependency-glob: |
            Makefile
            .github/workflows/ci.yml
            deployment/requirements-standalone.txt
      - name: pinned standalone SDKs
        run: uv pip install --python "$(command -v python)" "pytest==9.2.0" -r deployment/requirements-standalone.txt
      # pinned-version assertion + required-collection check + test guards
      - name: standalone SDK integration
        run: MCS_TEST_PYTHON="$(command -v python)" sh scripts/development/check_pinned_sdks.sh standalone

  incident-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: static failure-pattern gates
        run: python3 ci/gates.py
      - name: incident coverage from dev-records
        run: python3 ci/mine_gates.py --check

  pytest-macos:
    # production runs on macOS: launchd/LaunchAgent plists, plutil, BSD
    # script(1) and /usr/bin/perl timeouts are only exercised here (their
    # tests skip on Linux). meta/ and ops/ hold the installer, updater,
    # setup and service tests; -r fEs lists every skip so a macOS-only test
    # that silently skipped is visible in the log. 2 slices x 3 shards = 6
    # (hosted macOS runners have 3 vCPU), full mode only.
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2]
    env:
      MCS_CI_SLICE: ${{ matrix.slice }}
      MCS_CI_SLICES: "2"
      MCS_CI_PER_SLICE: "3"
      MCS_CI_SKIP_PERF: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          cache-python: true
          cache-dependency-glob: |
            Makefile
            .github/workflows/ci.yml
            deployment/requirements-standalone.txt
      - name: pytest (installer, updater, setup and launchd)
        run: |
          # python.org's macOS build can link an unpatched SQLite release.
          uv venv --python 3.14 --managed-python .venv
          uv pip install --python .venv/bin/python "pytest==9.2.0"
          python3 ci/run_pytest_groups.py macos --slice "$MCS_CI_SLICE/$MCS_CI_SLICES" --per-slice "$MCS_CI_PER_SLICE"
      - name: shard reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pytest-report-macos-${{ matrix.slice }}
          path: ${{ runner.temp }}/mcs-pytest-*/shard-*.report.json
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - name: pytest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pytest-macos-${{ matrix.slice }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcs-pytest-*/
          retention-days: 7
          if-no-files-found: ignore

  macos:
    # Required check and release lane for pytest-macos, same rule as
    # lint-test. It runs on ubuntu because it only judges and verifies
    # reports: macOS runner minutes are billed at ten times the rate.
    needs: [scope, pytest-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: gate
        id: gate
        env:
          MCS_CI_NEEDS: ${{ toJSON(needs) }}
          MCS_CI_GATE_DIR: ${{ runner.temp }}/ci-gate
        run: python3 ci/ci_gate.py macos
      - name: download shard reports
        if: steps.gate.outputs.tests == 'ran'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: pytest-report-macos-*
          path: ${{ runner.temp }}/ci-gate/reports
          merge-multiple: true
      - name: verify shard reports
        if: steps.gate.outputs.tests == 'ran'
        env:
          MCS_CI_REPORTS: ${{ runner.temp }}/ci-gate/reports
          MCS_CI_SLICES: "2"
          MCS_CI_PER_SLICE: "3"
        run: python3 ci/run_pytest_groups.py macos --verify-reports "$MCS_CI_REPORTS" --slices "$MCS_CI_SLICES" --per-slice "$MCS_CI_PER_SLICE"
      - name: gate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ci-gate-macos
          path: ${{ runner.temp }}/ci-gate/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  hermes-integration:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: hermes-mcs
      # the plugin contract is validated against ONE pinned Hermes ref —
      # floating 'latest upstream' would let unrelated upstream drift
      # break (or silently change) the lane (F23)
      # Release prerequisite: advance this pin with install.sh and
      # mcs_update.HERMES_PIN whenever the companion Hermes changes are
      # republished (tests/meta/test_install_runtime_migration.py checks all three).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: yusuketakuma/hermes-agent
          ref: 2c08ca7ade8f867d07e4bff6581be54405b0c9d0
          path: hermes-agent
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          cache-dependency-glob: hermes-agent/uv.lock
      - name: install hermes (pinned ref) + integration test deps
        run: |
          uv venv --python python hermes-agent/.venv
          # Match install.sh: Hermes owns the security overrides for voice/crypto.
          cd hermes-agent
          uv pip install --python .venv/bin/python -e '.[messaging]'
          uv pip install --python .venv/bin/python --group dev
      # Use the same isolated lane as local verification. It checks the
      # installed distributions and imported source against the pin above,
      # and rejects an empty or incomplete SDK test collection.
      - name: discord and slack plugin integration
        working-directory: hermes-mcs
        env:
          MCS_TEST_PYTHON: ${{ github.workspace }}/hermes-agent/.venv/bin/python
          MCS_HERMES_SOURCE: ${{ github.workspace }}/hermes-agent
          MCS_HERMES_REFERENCE: ${{ github.workspace }}/hermes-agent
        run: sh scripts/development/check_pinned_sdks.sh hermes

  merge-gate-request:
    # main-sync starts this run with GITHUB_TOKEN after it merges main into a PR,
    # and GitHub raises no workflow_run for a run started that way: agent-control.yml
    # would never judge the new head. A dispatch is the one event GITHUB_TOKEN may
    # start, so this run asks for the judgement itself once the required jobs are done.
    # A run a person started reaches agent-control.yml through workflow_run; asking
    # here too would count one CI failure twice.
    # The request only names the commit. agent-control.yml runs from the default
    # branch and reads the check runs itself, so nothing this job says is trusted.
    needs: [lint-test, hygiene, standalone-sdk, incident-gates, macos, hermes-integration]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.triggering_actor == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # workflow_dispatch of agent-control.yml, nothing else
    steps:
      - name: ask agent-control.yml for the merge-gate of this head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
        run: gh workflow run agent-control.yml --ref "$DEFAULT_BRANCH" -f sha="$SHA"
