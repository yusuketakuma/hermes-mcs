name: focused-ci-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"
      - name: Prepare isolated test runtime
        run: |
          uv venv --python 3.14 --managed-python .venv
          uv pip install --python .venv/bin/python "pytest==9.2.0"
          .venv/bin/python -c 'import platform, sqlite3; print("python", platform.python_version(), "sqlite", sqlite3.sqlite_version)'
      - name: Diagnose previously failing synthetic tests
        run: |
          sh scripts/run_tests.sh \
            'tests/ops/test_cloud_cli_local_rebuild_budget.py::test_production_scale_builds_a_full_bundle_and_the_approval_re_proves_it' \
            'tests/ops/test_runtime_compatibility.py::test_invalid_render_config_is_reported_not_raised' \
            'tests/core/test_context_receipt_batch.py::test_candidate_checks_multiple_units_with_one_global_receipt_scan' \
            -r fEs --durations=10
