name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # default read-only — write is granted per-job only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: ruff
        run: pip install "ruff==0.16.8" && ruff check mcs/ tests/ hermes_plugin/ integration/ ci/ scripts/ deployment/ conftest.py
      - name: pytest
        run: pip install "pytest==9.1.1" && scripts/run_tests.sh -x -q
      - name: check generated docs on PR
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/update_readme.py
          git diff --exit-code -- README.md docs/DEVELOPMENT.md

  readme-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that pushes (auto-commit on main)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: regenerate module table
        run: python3 scripts/update_readme.py
      # the job only runs on push to main; the PR drift check lives in
      # lint-test ("check generated docs on PR")
      - name: auto-commit on main
        run: |
          if git diff --quiet README.md docs/DEVELOPMENT.md; then
            echo "generated docs are up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/DEVELOPMENT.md
          git commit -m "docs: auto-update generated doc blocks [skip ci]"
          git push

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: no secrets or data dirs tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(data/|chrome-profile/|\.env$|config\.json$|token_cache\.json$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::forbidden files tracked:"; echo "$bad"; exit 1
          fi
      - name: no stale adapter/ references
        run: |
          bad=$(grep -rn "adapter/" --include='*.py' --include='*.sh' \
                mcs/ tests/ hermes_plugin/ integration/ install.sh || true)
          if [ -n "$bad" ]; then
            echo "::error::stale adapter/ references:"; echo "$bad"; exit 1
          fi
      - name: secret pattern scan
        run: |
          bad=$(git ls-files -z | xargs -0 grep -lnE \
                '(xox[baprs]-[0-9A-Za-z-]+|ghp_[0-9A-Za-z]{36}|sk-[0-9A-Za-z]{20,})' || true)
          if [ -n "$bad" ]; then
            echo "::error::possible secret committed:"; echo "$bad"; exit 1
          fi
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh deployment/scripts/*.sh
      - name: plugin manifest sanity
        run: |
          grep -q "kind: standalone" hermes_plugin/plugin.yaml
          grep -q "register" hermes_plugin/__init__.py

  incident-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: static failure-pattern gates
        run: python3 ci/gates.py
      - name: incident coverage from dev-records
        run: python3 ci/mine_gates.py --check

  hermes-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: hermes-mcs
      # the plugin contract is validated against ONE pinned Hermes ref —
      # floating 'latest upstream' would let unrelated upstream drift
      # break (or silently change) the lane (F23)
      # Release prerequisite: advance this pin and install.sh together
      # whenever the companion Hermes changes are republished.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: yusuketakuma/hermes-agent
          ref: fd50a275e2616118c48fe07e7e1c878782b15ccd
          path: hermes-agent
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: install hermes (pinned ref) + integration test deps
        run: |
          python -m venv hermes-agent/.venv
          hermes-agent/.venv/bin/python -m pip install -e './hermes-agent[dev,messaging]'
      - name: discord and slack plugin integration
        working-directory: hermes-agent
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: >-
          scripts/run_tests.sh
          ../hermes-mcs/integration/test_hermes_discord.py
          ../hermes-mcs/integration/test_hermes_slack.py
          ../hermes-mcs/integration/test_hermes_config.py
          ../hermes-mcs/tests/plugin/test_discord_sdk_real.py -x -q
