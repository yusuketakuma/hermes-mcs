name: Agent control

# merge-gate: 必須ジョブが現在の head で実際に実行・成功したかを commit status に出す。
# 担当ロック: 1 Issue に 担当:* は1件だけ。試行回数: AIブランチの CI 失敗をIssueへ通算する。
# 自動マージ: default-branch controller が現在の head を再確認し、直接 merge する。
# どのジョブも main 側の定義と ci/agent_control.py だけを使い、PR のコードは checkout も実行もしない。
# 運用と停止手順: docs/development/AUTOMATION.md
on:
  workflow_run:
    workflows: [ci, "PR review signal"]
    types: [completed]
  # GITHUB_TOKEN-started CI may suppress workflow_run; ci.yml dispatches this controller with its source run id.
  # The controller waits for that exact run to complete before considering retry or merge.
  workflow_dispatch:
    inputs:
      sha:
        description: "判定する PR head の commit（40桁）"
        required: true
        type: string
      source_run_id:
        description: "CI workflow run that requested this reconciliation"
        required: false
        type: number
      pr_number:
        description: "PR number associated with a branch-dispatched CI run"
        required: false
        type: number
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  issues:
    types: [labeled]

permissions: {}

jobs:
  gate:
    # A dispatch on another ref (a branch, or a tag named like the default branch) would run that ref's code.
    if: >-
      github.event_name != 'issues' &&
      (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-control-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      checks: read
      statuses: write
      pull-requests: write
      issues: write
      actions: write   # CI retry and main-sync workflow_dispatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the default branch only: never the PR's code, never a tag or another branch named like it
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Cancel obsolete branch-dispatched CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 ci/pr_branch_sync.py --repo "$GH_REPO" --base "$DEFAULT_BRANCH" --cancel-obsolete-ci-only
      - name: Decide and publish merge-gate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          CONTROL_ATTEMPT: ${{ github.run_attempt }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_INPUT: ${{ inputs.pr_number }}
          AUTOMATION: ${{ vars.AUTOMATION_ENABLED }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          if [[ "$EVENT" == "workflow_run" && "$RUN_WORKFLOW" == "ci" ]]; then
            if [[ -n "$PR_INPUT" ]]; then
              prs="$PR_INPUT"
            else
              prs=$(gh api "repos/$GH_REPO/commits/$RUN_SHA/pulls" --jq '[.[] | select(.state == "open") | .number] | join(" ")')
            fi
            ci_conclusion="$RUN_CONCLUSION"
            # Re-running this workflow must not count the same CI failure again; a re-run of ci itself does.
            if [[ "$CONTROL_ATTEMPT" != "1" ]]; then ci_conclusion=""; fi
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            # A dispatched sha is typed by a caller: accept a full commit id only. The PR head is compared below.
            [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a 40-digit commit id"; exit 1; }
            if [[ -n "$PR_INPUT" ]]; then
              prs="$PR_INPUT"
            else
              prs=$(gh api "repos/$GH_REPO/commits/$RUN_SHA/pulls" --jq '[.[] | select(.state == "open") | .number] | join(" ")')
            fi
            # Not bound to one ci run attempt, so it must not count one: the verdict only.
            ci_conclusion=""
          else
            prs="$PR_FROM_EVENT"
            ci_conclusion=""
          fi
          event_prs="$prs"
          prs=$(gh api "repos/$GH_REPO/pulls?state=open&base=$DEFAULT_BRANCH&per_page=100" --paginate --jq '.[] | select(.draft != true) | .number')
          for pr in $prs; do
            gh api "repos/$GH_REPO/pulls/$pr" > "$work/pr.json"
            if ! jq -e --arg repo "$GH_REPO" --arg base "$DEFAULT_BRANCH" \
              '.state == "open" and (.draft != true) and .base.ref == $base and .head.repo.full_name == $repo and .base.repo.full_name == $repo' \
              "$work/pr.json" > /dev/null; then continue; fi
            sha=$(jq -r .head.sha "$work/pr.json")
            pr_ci_conclusion=""
            if [[ "$sha" == "$RUN_SHA" ]]; then
              for event_pr in $event_prs; do
                if [[ "$event_pr" == "$pr" ]]; then pr_ci_conclusion="$ci_conclusion"; fi
              done
            fi
            base=$(jq -r .base.ref "$work/pr.json")
            gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" --paginate --slurp > "$work/checks.json"
            gh api "repos/$GH_REPO/pulls/$pr/files?per_page=100" --paginate --slurp > "$work/files.json"
            behind=$(gh api "repos/$GH_REPO/compare/$base...$sha" --jq .behind_by)
            python3 ci/agent_control.py gate --pr "$work/pr.json" --checks "$work/checks.json" \
              --files "$work/files.json" --behind-by "$behind" --automation "${AUTOMATION:-}" \
              --ci-conclusion "$pr_ci_conclusion" > "$work/plan.json"
            cat "$work/plan.json"
            state=$(jq -r .state "$work/plan.json")
            gh api -X POST "repos/$GH_REPO/statuses/$sha" -f context=merge-gate -f state="$state" \
              -f description="$(jq -r .description "$work/plan.json")" > /dev/null
            for issue in $(jq -r '.attempts[].issue' "$work/plan.json"); do
              labels=$(gh api "repos/$GH_REPO/issues/$issue" --jq '[.labels[].name]')
              step=$(python3 ci/agent_control.py attempt --labels "$labels")
              for name in $(jq -r '.remove[]' <<< "$step"); do
                gh api -X DELETE "repos/$GH_REPO/issues/$issue/labels/$(jq -rn --arg n "$name" '$n|@uri')" > /dev/null || true
              done
              gh api -X POST "repos/$GH_REPO/issues/$issue/labels" --input <(jq '{labels: .add}' <<< "$step") > /dev/null
              if [[ "$(jq -r .exhausted <<< "$step")" == "true" ]]; then
                gh issue comment "$issue" --body "AIによる試行が上限に達したため、担当を外して要オーナー対応にしました（PR #$pr の CI 失敗）。"
              fi
            done
          done
      - name: Reconcile current PR heads
        if: ${{ !cancelled() && !failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED }}
          ALLOW_INFRA_RETRY: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'ci') || (github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.source_run_id != '') }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          SOURCE_HEAD: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        run: python3 ci/auto_merge.py --withdraw-inherited

  lock:
    if: github.event_name == 'issues' && startsWith(github.event.label.name, '担当:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-lock-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Keep one agent label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ADDED: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$GH_REPO/issues/$ISSUE" --jq '[.labels[].name]')
          conflict=$(python3 ci/agent_control.py lock --labels "$labels" --added "$ADDED" | jq -r .conflict)
          if [[ "$conflict" == "true" || "$SENDER" != "$OWNER" ]]; then
            gh api -X DELETE "repos/$GH_REPO/issues/$ISSUE/labels/$(jq -rn --arg n "$ADDED" '$n|@uri')" > /dev/null
            if [[ "$conflict" == "true" ]]; then
              gh issue comment "$ISSUE" --body "担当ラベルは1件だけです。$ADDED を外しました。交代するときは、旧担当の実行が終わったことを確かめてから旧ラベルを外し、新しいラベルを付けてください。"
            else
              gh issue comment "$ISSUE" --body "担当ラベルは所有者だけが付けられます。$ADDED を外しました。"
            fi
          fi
