name: Agent control

# merge-gate: 必須ジョブが現在の head で実際に実行・成功したかを commit status に出す。
# 担当ロック: 1 Issue に 担当:* は1件だけ。試行回数: AIブランチの CI 失敗をIssueへ通算する。
# 自動マージ: default-branch controller が現在の head を再確認し、直接 merge する。
# どのジョブも main 側の定義と ci/agent_control.py だけを使い、PR のコードは checkout も実行もしない。
# 運用と停止手順: docs/development/AUTOMATION.md
on:
  workflow_run:
    workflows: [ci, "PR review signal"]
    types: [completed]
  # GITHUB_TOKEN-started CI may suppress workflow_run; ci.yml dispatches this controller with its source run id.
  # The controller waits for that exact run to complete before considering retry or merge.
  workflow_dispatch:
    inputs:
      sha:
        description: "判定する PR head の commit（40桁）"
        required: true
        type: string
      source_run_id:
        description: "CI workflow run that requested this reconciliation"
        required: false
        type: number
      pr_number:
        description: "PR number associated with a branch-dispatched CI run"
        required: false
        type: number
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  issues:
    types: [labeled]

permissions: {}

jobs:
  gate:
    # A dispatch on another ref (a branch, or a tag named like the default branch) would run that ref's code.
    if: >-
      github.event_name != 'issues' &&
      (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-control-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      checks: read
      statuses: write
      pull-requests: write
      issues: write
      actions: write   # CI retry and main-sync workflow_dispatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the default branch only: never the PR's code, never a tag or another branch named like it
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Withdraw inherited auto-merge reservations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 ci/auto_merge.py --withdraw-inherited-only
      - name: Cancel obsolete branch-dispatched CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 ci/pr_branch_sync.py --repo "$GH_REPO" --base "$DEFAULT_BRANCH" --cancel-obsolete-ci-only
      - name: Decide and publish merge-gate
        id: plan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          CONTROL_ATTEMPT: ${{ github.run_attempt }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          AUTOMATION: ${{ vars.AUTOMATION_ENABLED }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 ci/merge_gate.py
      - name: Reconcile current PR heads
        if: ${{ !cancelled() && !failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED }}
          ALLOW_INFRA_RETRY: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'ci') || (github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.source_run_id != '') }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          SOURCE_HEAD: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        run: python3 ci/auto_merge.py --withdraw-inherited
      - name: Report gate publication errors
        if: ${{ !cancelled() && steps.plan.outcome == 'failure' }}
        run: exit 1

  lock:
    if: github.event_name == 'issues' && startsWith(github.event.label.name, '担当:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-lock-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Keep one agent label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ADDED: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$GH_REPO/issues/$ISSUE" --jq '[.labels[].name]')
          conflict=$(python3 ci/agent_control.py lock --labels "$labels" --added "$ADDED" | jq -r .conflict)
          if [[ "$conflict" == "true" || "$SENDER" != "$OWNER" ]]; then
            gh api -X DELETE "repos/$GH_REPO/issues/$ISSUE/labels/$(jq -rn --arg n "$ADDED" '$n|@uri')" > /dev/null
            if [[ "$conflict" == "true" ]]; then
              gh issue comment "$ISSUE" --body "担当ラベルは1件だけです。$ADDED を外しました。交代するときは、旧担当の実行が終わったことを確かめてから旧ラベルを外し、新しいラベルを付けてください。"
            else
              gh issue comment "$ISSUE" --body "担当ラベルは所有者だけが付けられます。$ADDED を外しました。"
            fi
          fi
