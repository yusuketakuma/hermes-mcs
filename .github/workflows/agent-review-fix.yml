name: Agent review findings

# agent/claude- の PR に付いたレビューの指摘を、agent-claude-repair.yml（Claude）の修正に回す。
# 対象は所有者の Request changes と、指摘を報告した CodeRabbit・Devin のレビューだけ。レビューツールの Autofix は使わない。
# 試行は CI 失敗と同じ 試行:N で数える（1回の判定で新しい指摘をまとめて1回）。同じレビューは2回数えない。
# レビューは API で読む（起動はすべて既定ブランチの定義で動くイベントだけ。PR 側の定義では動かない）。
# 修正の待ちが取り消されたレビューは、次の判定が数え直さずに起動し直す。
# PR のコードは checkout も実行もしない（main の ci/ だけ）。運用: docs/development/AUTOMATION.md
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    # Every run reads all open agent/claude- PRs and their reviews from the API.
    # A dispatch on another ref would run that ref's definition of this file.
    if: vars.AUTOMATION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # One pass at a time, so a review is never counted twice; a cancelled waiting pass is caught by the next one.
      group: agent-review-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write  # the progress markers on the PR
      issues: write    # attempt labels
      actions: write   # workflow_dispatch of agent-claude-repair.yml
    steps:
      # main by name: never the PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/heads/main
          sparse-checkout: ci
          persist-credentials: false
      - name: Send new review findings to the repair run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          AUTOMATION: ${{ vars.AUTOMATION_ENABLED }}
        run: |
          set -euo pipefail
          export work; work=$(mktemp -d)
          # A Claude writer run waiting or running: a new waiting run would cancel an older one.
          # Asked per status (skipped runs would crowd a plain list); a failed query counts as busy.
          busy=0
          for wf in agent-claude.yml agent-claude-repair.yml; do
            for st in in_progress queued pending waiting requested; do
              n=$(gh run list --workflow "$wf" --status "$st" --limit 1 --json databaseId --jq length) || n=1
              if [[ "$n" != "0" ]]; then busy=1; fi
            done
          done
          # Only this repository's branches: a fork's PR can carry any branch name and body.
          prs=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --paginate | jq -r --arg repo "$GH_REPO" \
            '.[] | select((.head.ref | startswith("agent/claude-")) and .head.repo.full_name == $repo) | .number')
          sweep_pr() {
            local pr=$1 busy=$2
            gh api "repos/$GH_REPO/pulls/$pr" > "$work/pr.json"
            echo '{}' > "$work/labels.json"
            issues=$(python3 ci/agent_control.py linked --pr "$work/pr.json" | jq -r '.issues[]')
            # Over the cap the plan refuses on the count alone: fetch nothing.
            if (( $(wc -w <<< "$issues") <= 5 )); then
              for issue in $issues; do
                labels=$(gh api "repos/$GH_REPO/issues/$issue" --jq '[.labels[].name]')
                jq --arg n "$issue" --argjson l "$labels" '.[$n] = $l' "$work/labels.json" > "$work/next.json"
                mv "$work/next.json" "$work/labels.json"
              done
            fi
            gh api "repos/$GH_REPO/pulls/$pr/reviews?per_page=100" --paginate --slurp > "$work/reviews.json"
            gh api "repos/$GH_REPO/issues/$pr/comments?per_page=100" --paginate --slurp > "$work/comments.json"
            gh api "repos/$GH_REPO/commits?sha=$(jq -r .head.sha "$work/pr.json")&per_page=100" > "$work/commits.json"
            busy_flag=(); if [[ "$busy" != "0" ]]; then busy_flag=(--busy); fi
            plan=$(python3 ci/agent_control.py review --pr "$work/pr.json" --issue-labels "$work/labels.json" \
              --reviews "$work/reviews.json" --comments "$work/comments.json" --commits "$work/commits.json" \
              --owner "$OWNER" --automation "${AUTOMATION:-}" "${busy_flag[@]}")
            echo "PR #$pr: $plan"
            dropped=$(jq -r '.dropped | map(tostring) | join(",")' <<< "$plan")
            if [[ -n "$dropped" ]]; then
              gh pr comment "$pr" --body "所有者のレビュー（$dropped）は、その後の修正の push で古い head へのレビューになったため、自動修正に回していません。まだ必要なら、もう一度 Request changes にするか @claude と書いてください。
          <!-- agent-review:dropped $dropped -->"
            fi
            ids=$(jq -r '.reviews | map(tostring) | join(",")' <<< "$plan")
            if [[ -z "$ids" ]]; then return 0; fi
            if [[ "$(jq -r .count <<< "$plan")" == "true" ]]; then
              # Marker first: a pass that dies after it never counts the same review again.
              gh pr comment "$pr" --body "レビューの指摘（レビュー $ids）を Claude の修正に回します。範囲外の提案は修正せず、この PR に挙げます。
          <!-- agent-review:queued $ids -->"
              for issue in $(jq -r 'keys[]' "$work/labels.json"); do
                labels=$(gh api "repos/$GH_REPO/issues/$issue" --jq '[.labels[].name]')
                step=$(python3 ci/agent_control.py attempt --labels "$labels")
                for name in $(jq -r '.remove[]' <<< "$step"); do
                  gh api -X DELETE "repos/$GH_REPO/issues/$issue/labels/$(jq -rn --arg n "$name" '$n|@uri')" > /dev/null || true
                done
                gh api -X POST "repos/$GH_REPO/issues/$issue/labels" --input <(jq '{labels: .add}' <<< "$step") > /dev/null
                if [[ "$(jq -r .exhausted <<< "$step")" == "true" ]]; then
                  gh issue comment "$issue" --body "AIによる試行が上限に達したため、担当を外して要オーナー対応にしました（PR #$pr のレビュー指摘）。"
                fi
              done
            fi
            # The repair run re-checks every id and re-reads the labels (exhausted, reassigned or held: refused).
            gh workflow run agent-claude-repair.yml --ref main -f pr="$pr" -f reviews="$ids"
            touch "$work/dispatched"
          }
          export -f sweep_pr
          for pr in $prs; do
            # Its own bash, so set -e still stops this PR's steps; one PR's trouble does not stop the others.
            bash -euo pipefail -c 'sweep_pr "$@"' _ "$pr" "$busy" || echo "::warning::PR #$pr: skipped after an error"
            # At most one dispatch per sweep: it is now the waiting writer run.
            if [[ -e "$work/dispatched" ]]; then busy=1; fi
          done
