name: mcs-discord-commands
version: 0.1.0
description: >
  Read the configured MCS snapshot and queue only explicitly confirmed
  human Discord request commands.
author: Hermes Agent
kind: standalone
platforms:
  - discord
config_schema:
  snapshot:
    type: str
    required: true
    description: Published read-only MCS snapshot path.
  inbox:
    type: str
    required: true
    description: Existing MCS command inbox directory.
  allowed_user_ids:
    type: list
    required: true
    description: Discord user IDs allowed to use this command.
  allowed_chat_ids:
    type: list
    required: true
    description: Discord chat or channel IDs allowed to use this command.
  project_ids:
    type: list
    required: true
    description: MCS project IDs visible to this command.
  interactive:
    type: bool
    required: false
    description: Enable the interactive card worker (delivery + actions).
  data_root:
    type: str
    required: false
    description: MCS data dir holding cmd_int/, discord_render/, discord_state/.
  profile:
    type: str
    required: false
    description: MCS delivery-scope profile name (defaults to Hermes profile).
  application_id:
    type: str
    required: false
    description: Discord application ID this worker is bound to
      (defaults to the connected bot's application/user ID).
  channel_id:
    type: str
    required: false
    description: Discord channel this worker delivers cards into.
  guild_id:
    type: str
    required: false
    description: Discord guild (server) ID, when the scope pins one.
