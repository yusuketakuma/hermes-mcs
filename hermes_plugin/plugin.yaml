name: mcs-discord-commands
version: 0.1.0
description: >
  Read the configured MCS snapshot and queue only explicitly confirmed
  human Discord request commands.
author: Hermes Agent
kind: standalone
platforms:
  - discord
  - slack
config_schema:
  snapshot:
    type: str
    required: true
    description: Published read-only MCS snapshot path.
  inbox:
    type: str
    required: true
    description: Existing MCS command inbox directory.
  allowed_user_ids:
    type: list
    required: true
    description: Discord user IDs allowed to use this command.
  allowed_chat_ids:
    type: list
    required: true
    description: Discord chat or channel IDs allowed to use this command.
  project_ids:
    type: list
    required: true
    description: MCS project IDs visible to this command.
  interactive:
    type: bool
    required: false
    description: Enable the interactive card worker (delivery + actions).
  data_root:
    type: str
    required: false
    description: MCS data dir holding cmd_int/, discord_render/, discord_state/.
  profile:
    type: str
    required: false
    description: MCS delivery-scope profile name (defaults to Hermes profile).
  application_id:
    type: str
    required: false
    description: Discord application ID this worker is bound to
      (defaults to the connected bot's application/user ID).
  channel_id:
    type: str
    required: false
    description: Discord channel this worker delivers cards into.
  guild_id:
    type: str
    required: false
    description: Discord guild (server) ID, when the scope pins one.
  slack_adapter_enabled:
    type: bool
    required: false
    description: Enable the Slack card worker only when MCS publishes
      an active Slack transport scope. Disabled by default. Start or
      restart the Hermes Gateway after changing Slack settings or
      reloading this plugin; the connected Slack app is not rewired.
  slack_team_id:
    type: str
    required: false
    description: Workspace ID pinned to the staged Slack adapter.
  slack_application_id:
    type: str
    required: false
    description: Slack app ID pinned to the staged adapter.
  slack_channel_id:
    type: str
    required: false
    description: Slack channel ID pinned to the staged adapter.
  slack_profile:
    type: str
    required: false
    description: MCS delivery profile (defaults to Hermes profile).
  slack_allowed_user_ids:
    type: list
    required: false
    description: Explicit Slack user IDs required to decode native actions.
