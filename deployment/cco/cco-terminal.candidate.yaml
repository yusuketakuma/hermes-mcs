# Candidate only: merge terminal section into the CCO profile after review.
# This restricts terminal/file tools; host-side plugins and other tools are separate.
terminal:
  backend: docker
  # Verified local image ID; must exist on the deployment host.
  docker_image: sha256:8f958bdc1b4a422bfafd97cab4f69836401f616ae985d4b57a53d254f5bcb038
  cwd: /workspace
  docker_mount_cwd_to_workspace: false
  docker_network: false
  docker_forward_env: []
  docker_env: {}
  docker_extra_args: []
  docker_volumes:
    - /Users/yusuke/.mcs/data/snapshots:/mcs/snapshots:ro
    # Proposals only — NEVER mount data/cmd rw here. The command queue
    # applies any file carrying human_confirmed:true verbatim; an LLM
    # that can write it can self-declare human approval. A human
    # promotes a proposal into data/cmd via the plugin confirm path,
    # which produces the receipt boundary.
    - /Users/yusuke/.mcs/data/cmd-proposals:/mcs/cmd-proposals:rw
