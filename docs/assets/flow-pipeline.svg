<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" font-family="Menlo, 'Hiragino Sans', monospace">
  <rect width="860" height="240" fill="#0d1117"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- main chain -->
  <rect x="16" y="86" width="130" height="56" rx="8" fill="#1f6feb"/>
  <text x="81" y="110" font-size="12" fill="#fff" text-anchor="middle">MCS</text>
  <text x="81" y="126" font-size="11" fill="#cde0ff" text-anchor="middle">医療・介護チャット</text>
  <rect x="186" y="86" width="150" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="261" y="110" font-size="11" fill="#e6edf3" text-anchor="middle">原文・時刻・投稿者</text>
  <text x="261" y="126" font-size="11" fill="#8b949e" text-anchor="middle">職種・組織</text>
  <rect x="376" y="86" width="130" height="56" rx="8" fill="#238636"/>
  <text x="441" y="110" font-size="12" fill="#fff" text-anchor="middle">構造化</text>
  <text x="441" y="126" font-size="11" fill="#d3f8df" text-anchor="middle">イベント</text>
  <!-- branches -->
  <rect x="546" y="16" width="140" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="616" y="39" font-size="11" fill="#e6edf3" text-anchor="middle">症状・状態変化</text>
  <rect x="546" y="60" width="140" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="616" y="83" font-size="11" fill="#e6edf3" text-anchor="middle">薬剤変更</text>
  <rect x="546" y="104" width="140" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="616" y="127" font-size="11" fill="#e6edf3" text-anchor="middle">依頼・回答・判断</text>
  <rect x="546" y="148" width="140" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="616" y="171" font-size="11" fill="#e6edf3" text-anchor="middle">入退院・ケア移行</text>
  <!-- converge -->
  <rect x="714" y="60" width="130" height="44" rx="8" fill="#8957e5"/>
  <text x="779" y="78" font-size="11" fill="#fff" text-anchor="middle">患者時系列</text>
  <text x="779" y="94" font-size="11" fill="#e2d7fb" text-anchor="middle">多職種連携</text>
  <rect x="714" y="120" width="130" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="779" y="138" font-size="11" fill="#e6edf3" text-anchor="middle">統計・症例解析</text>
  <text x="779" y="154" font-size="11" fill="#8b949e" text-anchor="middle">確認支援</text>
  <!-- edges -->
  <line x1="146" y1="114" x2="182" y2="114" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="336" y1="114" x2="372" y2="114" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="506" y1="100" x2="540" y2="34" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="506" y1="106" x2="540" y2="78" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="506" y1="122" x2="540" y2="122" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="506" y1="128" x2="540" y2="166" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="686" y1="34" x2="710" y2="74" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="686" y1="78" x2="710" y2="80" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="686" y1="122" x2="710" y2="84" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="686" y1="166" x2="710" y2="88" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="779" y1="104" x2="779" y2="116" stroke="#58a6ff" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="16" y="220" font-size="10" fill="#6e7681">医療チャット → 構造化 → 患者時系列・多職種連携 → 統計 → 現在症例の確認支援</text>
</svg>
