<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-signals-title flow-signals-desc" id="flow-signals-root">
        <title id="flow-signals-title">アラートの組み立て</title>
        <desc id="flow-signals-desc">現在患者の直近7日を、患者自身の過去と比べて変化を捉え、過去症例の統計を参考情報として添えてアラートにし、薬剤変更後の再評価記録・未解決事項・通常より増えた薬剤変更や連携を示す流れ。</desc>
        <defs>
      <style>1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #flow-signals-root { --color-paper: #f6f4ef;
      --color-ink: #202124;
      --color-muted: #66716f;
      --color-accent: #087f5b;
      --font-sans: 'Hiragino Sans', 'Noto Sans CJK JP', 'Yu Gothic', sans-serif;
      --font-mono: Menlo, 'SF Mono', ui-monospace, monospace; }
      #flow-signals-root { font-family: var(--font-sans); color: var(--color-ink); }
      #flow-signals-root .diagram-container { width: 100%; overflow-x: auto; }
      #flow-signals-root .diagram-container { overflow-x: visible; }</style>
          <marker id="flow-signals-fs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#66716f"/></marker>
          <marker id="flow-signals-fs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#087f5b"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f6f4ef"/>

        <!-- column headings -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="500" fill="#66716f">
          <text x="24" y="28">比べるもの</text>
          <text x="736" y="28">アラートの例</text>
        </g>

        <!-- arrows first -->
        <path d="M 224,72 H 304 Q 312,72 312,80 V 136 Q 312,144 320,144 H 418" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#flow-signals-fs-arrow)"/>
        <line x1="224" y1="160" x2="418" y2="160" stroke="#66716f" stroke-width="1.2" marker-end="url(#flow-signals-fs-arrow)"/>
        <path d="M 224,248 H 304 Q 312,248 312,240 V 184 Q 312,176 320,176 H 418" fill="none" stroke="#66716f" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#flow-signals-fs-arrow)"/>
        <path d="M 580,144 H 680 Q 688,144 688,136 V 80 Q 688,72 696,72 H 734" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#flow-signals-fs-arrow)"/>
        <line x1="580" y1="160" x2="734" y2="160" stroke="#66716f" stroke-width="1.2" marker-end="url(#flow-signals-fs-arrow)"/>
        <path d="M 580,176 H 680 Q 688,176 688,184 V 240 Q 688,248 696,248 H 734" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#flow-signals-fs-arrow)"/>

        <!-- nodes -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif">
          <rect x="24" y="44" width="200" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="36" y="66" fill="#202124" font-size="14" font-weight="600">現在患者</text>
          <text x="36" y="86" fill="#66716f" font-size="12">直近7日</text>
          <rect x="24" y="132" width="200" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="36" y="154" fill="#202124" font-size="14" font-weight="600">患者自身の過去</text>
          <text x="36" y="174" fill="#66716f" font-size="12">変化を比較</text>
          <rect x="24" y="220" width="200" height="56" rx="6" fill="#f6f4ef" stroke="#66716f" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="36" y="242" fill="#202124" font-size="14" font-weight="600">過去症例の統計</text>
          <text x="36" y="262" fill="#66716f" font-size="12">参考情報</text>
          <rect x="420" y="120" width="160" height="80" rx="6" fill="#f6f4ef"/>
          <rect x="420" y="120" width="160" height="80" rx="6" fill="#087f5b" fill-opacity="0.08" stroke="#087f5b" stroke-width="1.4"/>
          <text x="432" y="165" fill="#202124" font-size="14" font-weight="600">アラート</text>
          <rect x="736" y="44" width="240" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="748" y="77" fill="#202124" font-size="14" font-weight="600">薬剤変更後の再評価記録</text>
          <rect x="736" y="132" width="240" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="748" y="165" fill="#202124" font-size="14" font-weight="600">未解決事項</text>
          <rect x="736" y="220" width="240" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="748" y="253" fill="#202124" font-size="14" font-weight="600">通常より増えた薬剤変更・連携</text>
        </g>
      </svg>
