<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" font-family="Menlo, 'Hiragino Sans', monospace">
  <rect width="760" height="170" fill="#0d1117"/>
  <text x="24" y="28" font-size="13" fill="#e6edf3" font-weight="bold">患者の記録経過（例）</text>
  <line x1="40" y1="90" x2="720" y2="90" stroke="#30363d" stroke-width="2"/>
  <!-- markers -->
  <g font-size="11" text-anchor="middle">
    <circle cx="80" cy="90" r="5" fill="#58a6ff"/>
    <text x="80" y="70" fill="#8b949e">Day -14</text>
    <text x="80" y="118" fill="#e6edf3">症状変化</text>
    <circle cx="185" cy="90" r="5" fill="#d29922"/>
    <text x="185" y="70" fill="#8b949e">Day -7</text>
    <text x="185" y="118" fill="#e6edf3">薬剤調整</text>
    <circle cx="300" cy="90" r="6" fill="#f85149"/>
    <text x="300" y="70" fill="#8b949e">Day 0</text>
    <text x="300" y="118" fill="#e6edf3">退院</text>
    <circle cx="415" cy="90" r="5" fill="#58a6ff"/>
    <text x="415" y="70" fill="#8b949e">Day +3</text>
    <text x="415" y="118" fill="#e6edf3">残薬確認</text>
    <circle cx="530" cy="90" r="5" fill="#3fb950"/>
    <text x="530" y="70" fill="#8b949e">Day +7</text>
    <text x="530" y="118" fill="#e6edf3">再評価</text>
    <circle cx="645" cy="90" r="5" fill="#d29922"/>
    <text x="645" y="70" fill="#8b949e">Day +14</text>
    <text x="645" y="118" fill="#e6edf3">再調整</text>
  </g>
  <text x="24" y="152" font-size="10" fill="#6e7681">解析軸: 症状→薬剤変更 / 薬剤変更→再評価 / 退院→薬剤照合の時間・同一問題の再発・変化の集中期間・終末期 30/14/7/3 日前の変化</text>
</svg>
