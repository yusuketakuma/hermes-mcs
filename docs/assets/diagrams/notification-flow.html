<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知から確認・タスクまで</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f6f4ef;
      --color-ink: #202124;
      --color-muted: #66716f;
      --color-accent: #087f5b;
      --font-sans: 'Hiragino Sans', 'Noto Sans CJK JP', 'Yu Gothic', sans-serif;
      --font-mono: Menlo, 'SF Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: clamp(1.4rem, 2vw + 0.75rem, 1.9rem); font-weight: 700; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Diagram Design</p>
    <h1>通知から確認・タスクまで</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="notification-flow-title notification-flow-desc">
        <title id="notification-flow-title">通知から確認・タスクまで</title>
        <desc id="notification-flow-desc">MCSの新しい投稿がカードとスレッドで届き、職員の確認・担当・タスク作成が記録されてカード表示に戻る流れ。</desc>
        <defs>
          <marker id="nf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#66716f"/></marker>
          <marker id="nf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#087f5b"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f6f4ef"/>

        <!-- lanes -->
        <g stroke="rgba(32,33,36,0.12)" stroke-width="1">
          <line x1="24" y1="40" x2="976" y2="40"/>
          <line x1="24" y1="136" x2="976" y2="136"/>
          <line x1="24" y1="232" x2="976" y2="232"/>
          <line x1="24" y1="328" x2="976" y2="328"/>
          <line x1="24" y1="424" x2="976" y2="424"/>
        </g>
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="500" fill="#66716f">
          <text x="24" y="92">MCS</text>
          <text x="24" y="188">hermes-mcs</text>
          <text x="24" y="284">チャット</text>
          <text x="24" y="380">職員</text>
        </g>

        <!-- arrows first -->
        <line x1="222" y1="116" x2="222" y2="154" stroke="#66716f" stroke-width="1.2" marker-end="url(#nf-arrow)"/>
        <path d="M 296,184 H 402 Q 410,184 410,192 V 250" fill="none" stroke="#087f5b" stroke-width="1.4" marker-end="url(#nf-arrow-accent)"/>
        <line x1="484" y1="280" x2="522" y2="280" stroke="#66716f" stroke-width="1.2" marker-end="url(#nf-arrow)"/>
        <line x1="410" y1="308" x2="410" y2="346" stroke="#66716f" stroke-width="1.2" marker-end="url(#nf-arrow)"/>
        <line x1="484" y1="376" x2="522" y2="376" stroke="#66716f" stroke-width="1.2" marker-end="url(#nf-arrow)"/>
        <path d="M 410,404 V 408 Q 410,416 418,416 H 762 Q 770,416 770,408 V 214" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#nf-arrow)"/>
        <path d="M 672,376 H 762 a 8,8 0 0,1 16,0 H 794 Q 802,376 802,368 V 214" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#nf-arrow)"/>
        <path d="M 712,196 H 458 Q 450,196 450,204 V 250" fill="none" stroke="#66716f" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#nf-arrow)"/>

        <!-- arrow labels -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" text-anchor="middle">
          <rect x="362" y="212" width="40" height="16" fill="#f6f4ef"/>
          <rect x="560" y="168" width="80" height="16" fill="#f6f4ef"/>
          <text x="600" y="180" fill="#66716f">表示を更新</text>
          <rect x="418" y="330" width="52" height="16" fill="#f6f4ef"/>
          <text x="444" y="342" fill="#66716f">ボタン</text>
          <rect x="810" y="280" width="44" height="16" fill="#f6f4ef"/>
          <text x="832" y="292" fill="#66716f">確定</text>
          <rect x="716" y="288" width="44" height="16" fill="#f6f4ef"/>
          <text x="738" y="300" fill="#66716f">記録</text>
        </g>
        <text x="382" y="224" fill="#087f5b" font-size="12" font-weight="500" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" text-anchor="middle">通知</text>

        <!-- nodes -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif">
          <rect x="148" y="60" width="148" height="56" rx="6" fill="#edf0ee" stroke="#66716f" stroke-width="1"/>
          <text x="160" y="82" fill="#202124" font-size="14" font-weight="600">新しい投稿</text>
          <text x="160" y="102" fill="#66716f" font-size="12">新着・返信・添付</text>

          <rect x="148" y="156" width="148" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="160" y="178" fill="#202124" font-size="14" font-weight="600">保存・抽出</text>
          <text x="160" y="198" fill="#66716f" font-size="12">台帳・ローカルLLM</text>

          <rect x="712" y="156" width="148" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="724" y="178" fill="#202124" font-size="14" font-weight="600">記録</text>
          <text x="724" y="198" fill="#66716f" font-size="12">確認者・担当・タスク</text>

          <rect x="336" y="252" width="148" height="56" rx="6" fill="#f6f4ef"/>
          <rect x="336" y="252" width="148" height="56" rx="6" fill="rgba(8,127,91,0.08)" stroke="#087f5b" stroke-width="1.4"/>
          <text x="348" y="274" fill="#202124" font-size="14" font-weight="600">カード</text>
          <text x="348" y="294" fill="#66716f" font-size="12">患者・要約・ボタン</text>

          <rect x="524" y="252" width="148" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="536" y="274" fill="#202124" font-size="14" font-weight="600">スレッド</text>
          <text x="536" y="294" fill="#66716f" font-size="12">本文・添付・💊薬剤</text>

          <rect x="336" y="348" width="148" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="348" y="370" fill="#202124" font-size="14" font-weight="600">確認・担当</text>
          <text x="348" y="390" fill="#66716f" font-size="12">ボタンで共有</text>

          <rect x="524" y="348" width="148" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="536" y="370" fill="#202124" font-size="14" font-weight="600">タスク作成</text>
          <text x="536" y="390" fill="#66716f" font-size="12">入力→確認→確定</text>
        </g>

        <!-- legend strip -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#66716f">
          <line x1="24" y1="456" x2="56" y2="456" stroke="#66716f" stroke-width="1.2"/>
          <text x="64" y="460">流れ</text>
          <line x1="128" y1="456" x2="160" y2="456" stroke="#66716f" stroke-width="1" stroke-dasharray="5,4"/>
          <text x="168" y="460">表示の更新</text>
          <rect x="264" y="448" width="24" height="16" rx="3" fill="rgba(8,127,91,0.08)" stroke="#087f5b" stroke-width="1.2"/>
          <text x="296" y="460">チャンネルに届くカード</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
