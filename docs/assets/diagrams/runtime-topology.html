<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>稼働中のシステム構成</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f6f4ef;
      --color-ink: #202124;
      --color-muted: #66716f;
      --color-accent: #087f5b;
      --font-sans: 'Hiragino Sans', 'Noto Sans CJK JP', 'Yu Gothic', sans-serif;
      --font-mono: Menlo, 'SF Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: clamp(1.4rem, 2vw + 0.75rem, 1.9rem); font-weight: 700; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1056px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Diagram Design</p>
    <h1>稼働中のシステム構成</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1056 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-topology-title runtime-topology-desc">
        <title id="runtime-topology-title">稼働中のシステム構成</title>
        <desc id="runtime-topology-desc">MCSの記録をこのMacのChrome経由で10分ごとに収集してledger.dbへ保存し、常駐の抽出workerとローカルLLMで整理して、Slack・Discord・LINE WORKSへ通知する構成。外部の意味チェックAPIは任意で既定OFF。</desc>
        <defs>
          <marker id="rt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#66716f"/></marker>
          <marker id="rt-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1264a3"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f6f4ef"/>

        <!-- zones -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="500" fill="#66716f" text-anchor="middle">
          <rect x="24" y="64" width="184" height="144" rx="8" fill="rgba(32,33,36,0.02)" stroke="rgba(32,33,36,0.14)" stroke-width="0.8"/>
          <rect x="40" y="68" width="80" height="16" rx="2" fill="#f6f4ef"/>
          <text x="80" y="80">MCS（外部）</text>
          <rect x="228" y="64" width="576" height="488" rx="8" fill="rgba(32,33,36,0.02)" stroke="rgba(32,33,36,0.14)" stroke-width="0.8"/>
          <rect x="244" y="68" width="76" height="16" rx="2" fill="#f6f4ef"/>
          <text x="282" y="80">このMac</text>
          <rect x="824" y="64" width="208" height="360" rx="8" fill="rgba(32,33,36,0.02)" stroke="rgba(32,33,36,0.14)" stroke-width="0.8"/>
          <rect x="840" y="68" width="88" height="16" rx="2" fill="#f6f4ef"/>
          <text x="884" y="80">外部サービス</text>
        </g>

        <!-- arrows first -->
        <line x1="192" y1="140" x2="250" y2="140" stroke="#1264a3" stroke-width="1.2" marker-end="url(#rt-arrow-link)"/>
        <line x1="396" y1="140" x2="442" y2="140" stroke="#66716f" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <line x1="516" y1="176" x2="516" y2="214" stroke="#66716f" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <line x1="444" y1="252" x2="398" y2="252" stroke="#66716f" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <path d="M 588,240 H 724 Q 732,240 732,232 V 178" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <path d="M 684,328 V 272 Q 684,264 676,264 H 590" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <line x1="636" y1="364" x2="590" y2="364" stroke="#66716f" stroke-width="1.2" marker-end="url(#rt-arrow)"/>
        <line x1="780" y1="364" x2="838" y2="364" stroke="#1264a3" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#rt-arrow-link)"/>
        <line x1="780" y1="128" x2="838" y2="128" stroke="#1264a3" stroke-width="1.2" marker-end="url(#rt-arrow-link)"/>
        <line x1="840" y1="152" x2="782" y2="152" stroke="#66716f" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#rt-arrow)"/>

        <!-- arrow labels (masked, gap from strokes) -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" text-anchor="middle" fill="#66716f">
          <rect x="206" y="116" width="32" height="16" fill="#f6f4ef"/>
          <text x="222" y="128" fill="#1264a3">取得</text>
          <rect x="404" y="116" width="32" height="16" fill="#f1efeb"/>
          <text x="420" y="128" font-size="11" font-family="Menlo,'SF Mono',monospace">CDP</text>
          <rect x="524" y="188" width="32" height="16" fill="#f1efeb"/>
          <text x="540" y="200">保存</text>
          <rect x="404" y="228" width="32" height="16" fill="#f1efeb"/>
          <text x="420" y="240">複製</text>
          <rect x="668" y="196" width="56" height="16" fill="#f1efeb"/>
          <text x="696" y="208">送信待ち</text>
          <rect x="600" y="270" width="56" height="16" fill="#f1efeb"/>
          <text x="628" y="282">抽出結果</text>
          <rect x="596" y="340" width="32" height="16" fill="#f1efeb"/>
          <text x="612" y="352">推論</text>
          <rect x="794" y="340" width="32" height="16" fill="#f6f4ef"/>
          <text x="810" y="352" fill="#1264a3">任意</text>
          <rect x="788" y="104" width="44" height="16" fill="#f6f4ef"/>
          <text x="810" y="116" fill="#1264a3">カード</text>
          <rect x="794" y="160" width="32" height="16" fill="#f6f4ef"/>
          <text x="810" y="172">操作</text>
        </g>

        <!-- nodes -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif">
          <!-- MCS (source of record) -->
          <rect x="40" y="104" width="152" height="72" rx="6" fill="#f6f4ef"/>
          <rect x="40" y="104" width="152" height="72" rx="6" fill="#edf0ee" stroke="#66716f" stroke-width="1"/>
          <text x="52" y="128" fill="#202124" font-size="14" font-weight="600">MCS（原本）</text>
          <text x="52" y="148" fill="#66716f" font-size="12">MedicalCareStation</text>
          <text x="52" y="164" fill="#66716f" font-size="12">医療・介護チャット</text>

          <!-- Chrome CDP -->
          <rect x="252" y="104" width="144" height="72" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="264" y="128" fill="#202124" font-size="14" font-weight="600">Chrome</text>
          <text x="264" y="148" fill="#66716f" font-size="12">MCSログイン済み</text>
          <text x="264" y="164" fill="#66716f" font-size="11" font-family="Menlo,'SF Mono',monospace">CDP :9333</text>

          <!-- run_check -->
          <rect x="444" y="104" width="144" height="72" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="456" y="128" fill="#202124" font-size="14" font-weight="600">run_check.py</text>
          <text x="456" y="148" fill="#66716f" font-size="12">収集・取込</text>
          <text x="456" y="164" fill="#66716f" font-size="12">未読は10分ごと</text>

          <!-- notify -->
          <rect x="636" y="104" width="144" height="72" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="648" y="128" fill="#202124" font-size="14" font-weight="600">notify_flush</text>
          <text x="648" y="148" fill="#66716f" font-size="12">通知の仕分け→配送</text>
          <text x="648" y="164" fill="#66716f" font-size="12">Hermes・独立接続</text>

          <!-- viewer -->
          <rect x="252" y="216" width="144" height="72" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="264" y="240" fill="#202124" font-size="14" font-weight="600">閲覧・検索・統計</text>
          <text x="264" y="260" fill="#66716f" font-size="11" font-family="Menlo,'SF Mono',monospace">mcs_view.py</text>
          <text x="264" y="276" fill="#66716f" font-size="12">snapshots/ 読取専用</text>

          <!-- ledger (focal) -->
          <rect x="444" y="216" width="144" height="72" rx="6" fill="#f6f4ef"/>
          <rect x="444" y="216" width="144" height="72" rx="6" fill="rgba(8,127,91,0.08)" stroke="#087f5b" stroke-width="1.4"/>
          <text x="456" y="240" fill="#202124" font-size="14" font-weight="600">ledger.db</text>
          <text x="456" y="260" fill="#66716f" font-size="11" font-family="Menlo,'SF Mono',monospace">SQLite · WAL</text>
          <text x="456" y="276" fill="#66716f" font-size="12">記録・送信待ち</text>

          <!-- local LLM -->
          <rect x="444" y="328" width="144" height="72" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="456" y="352" fill="#202124" font-size="14" font-weight="600">llama-server</text>
          <text x="456" y="372" fill="#66716f" font-size="11" font-family="Menlo,'SF Mono',monospace">127.0.0.1:8080</text>
          <text x="456" y="388" fill="#66716f" font-size="12">ローカルLLM・常駐</text>

          <!-- extract drainers -->
          <rect x="636" y="328" width="144" height="72" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="648" y="352" fill="#202124" font-size="14" font-weight="600">抽出 drainer</text>
          <rect x="740" y="336" width="32" height="16" rx="2" fill="#ffffff" stroke="rgba(32,33,36,0.40)" stroke-width="0.8"/>
          <text x="756" y="348" fill="#202124" font-size="11" font-family="Menlo,'SF Mono',monospace" text-anchor="middle">×2</text>
          <text x="648" y="372" fill="#66716f" font-size="12">抽出・semantic/QC</text>
          <text x="648" y="388" fill="#66716f" font-size="12">常駐・24時間</text>

          <!-- scheduler (cross-cutting bar) -->
          <rect x="252" y="440" width="528" height="88" rx="6" fill="#edf0ee" stroke="#66716f" stroke-width="1"/>
          <text x="268" y="466" fill="#202124" font-size="14" font-weight="600">定期実行・常駐の管理</text>
          <text x="268" y="490" fill="#66716f" font-size="12">Hermesモード: hermes cron 6件 ＋ launchd（KeepAlive・WatchPaths）</text>
          <text x="268" y="510" fill="#66716f" font-size="12">独立モード: launchd の ai.mcs.standalone が同じジョブ・worker・接続を所有</text>

          <!-- chat -->
          <rect x="840" y="104" width="176" height="72" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="852" y="128" fill="#202124" font-size="14" font-weight="600">チャット</text>
          <text x="852" y="148" fill="#66716f" font-size="12">Slack（推奨）</text>
          <text x="852" y="164" fill="#66716f" font-size="12">Discord・LINE WORKS</text>

          <!-- external semantic API (optional) -->
          <rect x="840" y="328" width="176" height="72" rx="6" fill="#f6f4ef" stroke="#1264a3" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="852" y="352" fill="#202124" font-size="14" font-weight="600">TypeSafe Jev API</text>
          <text x="852" y="372" fill="#66716f" font-size="12">意味チェック・抽出監査</text>
          <text x="852" y="388" fill="#66716f" font-size="12">任意・既定OFF</text>
        </g>

        <!-- legend strip -->
        <line x1="24" y1="576" x2="1032" y2="576" stroke="rgba(32,33,36,0.12)" stroke-width="0.8"/>
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" fill="#66716f">
          <line x1="24" y1="604" x2="56" y2="604" stroke="#66716f" stroke-width="1.2"/>
          <text x="64" y="608">このMac内の流れ</text>
          <line x1="192" y1="604" x2="224" y2="604" stroke="#1264a3" stroke-width="1.2"/>
          <text x="232" y="608">外部との通信</text>
          <line x1="336" y1="604" x2="368" y2="604" stroke="#1264a3" stroke-width="1" stroke-dasharray="5,4"/>
          <text x="376" y="608">外部送信（任意・既定OFF）</text>
          <line x1="560" y1="604" x2="592" y2="604" stroke="#66716f" stroke-width="1" stroke-dasharray="5,4"/>
          <text x="600" y="608">カード操作の戻り</text>
          <rect x="728" y="596" width="24" height="16" rx="3" fill="rgba(8,127,91,0.08)" stroke="#087f5b" stroke-width="1.2"/>
          <text x="760" y="608">記録の保存先（台帳）</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
