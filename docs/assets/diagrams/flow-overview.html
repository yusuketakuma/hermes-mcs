<text x="32" y="223" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16" fill="#202124" font-weight="600">2  利用できる背景を入力へ</text>

<text x="32" y="671" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16" fill="#202124" font-weight="600">5  照合して保存・再開</text>
<text x="32" y="697" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">推論エンジン v1.0・原文根拠と照合</text>
<text x="32" y="720" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">品質・保存対象の現在性を確認</text>
<text x="32" y="743" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">部分結果と送信の証拠を保持して保存再開</text>
<text x="32" y="766" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">結果不明をローカルへ無条件に再送しない</text>

<text x="32" y="944" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">現行世代・必要品質を</text>

<text x="32" y="990" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">次の解析への利用も</text>
<text x="32" y="1013" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">設定・鮮度条件に従う</text>
<rect x="204" y="868" width="166" height="172" rx="8" fill="#ffffff" stroke="#d5dcd7"/>
<text x="216" y="895" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="16" fill="#202124" font-weight="600">7  通知・活用</text>
<text x="216" y="921" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">通知 / 検索</text>

<text x="216" y="967" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">患者背景の完成を</text>
<text x="216" y="990" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14" fill="#202124">全通知の前提に</text>

<text x="20" y="1101" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="12" fill="#66716f">処理完了と、必要な品質を満たすことは別に確認。</text>
<text x="20" y="1126" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="12" fill="#66716f">クラウドの利用先・範囲は設定と送信条件に従う。</text>
