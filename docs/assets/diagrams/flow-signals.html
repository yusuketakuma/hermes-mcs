<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アラートの組み立て</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f6f4ef;
      --color-ink: #202124;
      --color-muted: #66716f;
      --color-accent: #087f5b;
      --font-sans: 'Hiragino Sans', 'Noto Sans CJK JP', 'Yu Gothic', sans-serif;
      --font-mono: Menlo, 'SF Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: clamp(1.4rem, 2vw + 0.75rem, 1.9rem); font-weight: 700; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Diagram Design</p>
    <h1>アラートの組み立て</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-signals-title flow-signals-desc">
        <title id="flow-signals-title">アラートの組み立て</title>
        <desc id="flow-signals-desc">現在患者の直近7日を、患者自身の過去と比べて変化を捉え、過去症例の統計を参考情報として添えてアラートにし、薬剤変更後の再評価記録・未解決事項・通常より増えた薬剤変更や連携を示す流れ。</desc>
        <defs>
          <marker id="fs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#66716f"/></marker>
          <marker id="fs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#087f5b"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f6f4ef"/>

        <!-- column headings -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="500" fill="#66716f">
          <text x="24" y="28">比べるもの</text>
          <text x="736" y="28">アラートの例</text>
        </g>

        <!-- arrows first -->
        <path d="M 224,72 H 304 Q 312,72 312,80 V 136 Q 312,144 320,144 H 418" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#fs-arrow)"/>
        <line x1="224" y1="160" x2="418" y2="160" stroke="#66716f" stroke-width="1.2" marker-end="url(#fs-arrow)"/>
        <path d="M 224,248 H 304 Q 312,248 312,240 V 184 Q 312,176 320,176 H 418" fill="none" stroke="#66716f" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#fs-arrow)"/>
        <path d="M 580,144 H 680 Q 688,144 688,136 V 80 Q 688,72 696,72 H 734" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#fs-arrow)"/>
        <line x1="580" y1="160" x2="734" y2="160" stroke="#66716f" stroke-width="1.2" marker-end="url(#fs-arrow)"/>
        <path d="M 580,176 H 680 Q 688,176 688,184 V 240 Q 688,248 696,248 H 734" fill="none" stroke="#66716f" stroke-width="1.2" marker-end="url(#fs-arrow)"/>

        <!-- nodes -->
        <g font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif">
          <rect x="24" y="44" width="200" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="36" y="66" fill="#202124" font-size="14" font-weight="600">現在患者</text>
          <text x="36" y="86" fill="#66716f" font-size="12">直近7日</text>
          <rect x="24" y="132" width="200" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="36" y="154" fill="#202124" font-size="14" font-weight="600">患者自身の過去</text>
          <text x="36" y="174" fill="#66716f" font-size="12">変化を比較</text>
          <rect x="24" y="220" width="200" height="56" rx="6" fill="#f6f4ef" stroke="#66716f" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="36" y="242" fill="#202124" font-size="14" font-weight="600">過去症例の統計</text>
          <text x="36" y="262" fill="#66716f" font-size="12">参考情報</text>
          <rect x="420" y="120" width="160" height="80" rx="6" fill="#f6f4ef"/>
          <rect x="420" y="120" width="160" height="80" rx="6" fill="rgba(8,127,91,0.08)" stroke="#087f5b" stroke-width="1.4"/>
          <text x="432" y="165" fill="#202124" font-size="14" font-weight="600">アラート</text>
          <rect x="736" y="44" width="240" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="748" y="77" fill="#202124" font-size="14" font-weight="600">薬剤変更後の再評価記録</text>
          <rect x="736" y="132" width="240" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="748" y="165" fill="#202124" font-size="14" font-weight="600">未解決事項</text>
          <rect x="736" y="220" width="240" height="56" rx="6" fill="#ffffff" stroke="#202124" stroke-width="1"/>
          <text x="748" y="253" fill="#202124" font-size="14" font-weight="600">通常より増えた薬剤変更・連携</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
