<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Menlo, 'Hiragino Sans', monospace">
  <rect width="760" height="300" fill="#0d1117"/>
  <defs>
    <marker id="net_ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/>
    </marker>
    <marker id="net_ar_r" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- center: the shared per-patient record -->
  <rect x="300" y="122" width="160" height="56" rx="10" fill="#1f6feb"/>
  <text x="380" y="145" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">患者ごとの記録</text>
  <text x="380" y="162" font-size="10" fill="#dbe8ff" text-anchor="middle">（MCSのチャットルーム）</text>
  <!-- profession nodes -->
  <rect x="320" y="16" width="120" height="42" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="380" y="42" font-size="12" fill="#e6edf3" text-anchor="middle">医師</text>
  <rect x="40" y="50" width="120" height="42" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="100" y="76" font-size="12" fill="#e6edf3" text-anchor="middle">訪問看護</text>
  <rect x="40" y="206" width="120" height="42" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="100" y="232" font-size="12" fill="#e6edf3" text-anchor="middle">ケアマネ</text>
  <rect x="600" y="50" width="120" height="42" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="660" y="76" font-size="12" fill="#e6edf3" text-anchor="middle">薬剤師</text>
  <rect x="600" y="206" width="120" height="42" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="660" y="232" font-size="12" fill="#e6edf3" text-anchor="middle">病院</text>
  <!-- spokes: bidirectional, one consistent style -->
  <line x1="380" y1="58" x2="380" y2="116" stroke="#58a6ff" stroke-width="1.5" marker-start="url(#net_ar_r)" marker-end="url(#net_ar)"/>
  <text x="392" y="92" font-size="10" fill="#8b949e">指示・方針</text>
  <line x1="160" y1="84" x2="296" y2="130" stroke="#58a6ff" stroke-width="1.5" marker-start="url(#net_ar_r)" marker-end="url(#net_ar)"/>
  <text x="170" y="112" font-size="10" fill="#8b949e">症状・バイタル報告</text>
  <line x1="160" y1="216" x2="296" y2="170" stroke="#58a6ff" stroke-width="1.5" marker-start="url(#net_ar_r)" marker-end="url(#net_ar)"/>
  <text x="166" y="198" font-size="10" fill="#8b949e">生活情報・日程調整</text>
  <line x1="600" y1="84" x2="464" y2="130" stroke="#58a6ff" stroke-width="1.5" marker-start="url(#net_ar_r)" marker-end="url(#net_ar)"/>
  <text x="512" y="112" font-size="10" fill="#8b949e">服薬提案・残薬確認</text>
  <line x1="600" y1="216" x2="464" y2="170" stroke="#58a6ff" stroke-width="1.5" marker-start="url(#net_ar_r)" marker-end="url(#net_ar)"/>
  <text x="500" y="200" font-size="10" fill="#8b949e">退院情報・処方照合</text>
  <text x="24" y="288" font-size="10" fill="#6e7681">読み取れる軸: 誰が誰に相談したか / 回答までの時間 / 依頼→回答→実施の完結 / 調整が特定の人に集中していないか / 連携の密度と双方向性</text>
</svg>
