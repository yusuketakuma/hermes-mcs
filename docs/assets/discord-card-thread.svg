<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Menlo, 'Hiragino Sans', monospace">
  <title>完全合成の Discord カード＋スレッド表示例</title>
  <desc>実患者・実投稿を参照せずに新規作成した、カードとコンパニオンスレッドの図。</desc>
  <rect width="860" height="420" fill="#0d1117"/>
  <defs>
    <marker id="ct_ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <text x="30" y="28" font-size="11" fill="#8b949e">完全合成の表示例（実患者・実投稿の匿名化データは不使用）</text>

  <!-- card -->
  <rect x="30" y="46" width="330" height="300" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="48" y="72" font-size="12" fill="#e6edf3" font-weight="bold">📋 カード（患者ごとに1枚）</text>
  <text x="48" y="96" font-size="10" fill="#e6edf3">山田 太郎（合成例）· 09-26 17:30</text>
  <text x="48" y="112" font-size="9" fill="#8b949e">訪問看護 佐藤（合成）</text>
  <rect x="44" y="124" width="302" height="104" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="56" y="144" font-size="10" fill="#58a6ff">📋 構造化</text>
  <text x="56" y="164" font-size="9" fill="#b5bac1">要約: 夕方バイタル測定の報告</text>
  <text x="56" y="182" font-size="9" fill="#b5bac1">バイタル: BP 142/88・脈 76・SpO2 96%</text>
  <text x="56" y="200" font-size="9" fill="#b5bac1">症状: 起立時めまい（転倒なし）</text>
  <text x="56" y="218" font-size="9" fill="#b5bac1">依頼候補: 次回訪問で残薬を確認</text>
  <text x="48" y="256" font-size="10" fill="#e6edf3">✅確認  👤担当  ⏸保留</text>
  <text x="48" y="278" font-size="10" fill="#e6edf3">📝依頼作成  📄本文表示</text>
  <text x="48" y="306" font-size="9" fill="#6e7681">カード本体は要約と操作だけ</text>
  <text x="48" y="324" font-size="9" fill="#6e7681">📄はスレッド無効時の予備</text>

  <!-- arrow -->
  <line x1="362" y1="196" x2="434" y2="196" stroke="#58a6ff" stroke-width="2" marker-end="url(#ct_ar)"/>
  <text x="398" y="178" font-size="9" fill="#8b949e" text-anchor="middle">本文・添付は</text>
  <text x="398" y="216" font-size="9" fill="#8b949e" text-anchor="middle">こちらへ</text>

  <!-- companion thread -->
  <rect x="438" y="46" width="392" height="300" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="456" y="72" font-size="12" fill="#e6edf3" font-weight="bold">💬 山田 太郎 — 09-26</text>
  <text x="456" y="90" font-size="9" fill="#6e7681">コンパニオンスレッド（合成例）</text>

  <rect x="452" y="102" width="364" height="66" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="462" y="122" font-size="9" fill="#b5bac1">夕方バイタル: BP142/88 脈76 SpO2 96%。</text>
  <text x="462" y="138" font-size="9" fill="#b5bac1">起立時にめまいの訴え。転倒・外傷なし。</text>
  <text x="462" y="154" font-size="9" fill="#b5bac1">血圧手帳の写真と診療情報提供書を添付。</text>

  <!-- image attachment -->
  <rect x="452" y="178" width="178" height="118" rx="6" fill="#0d1117" stroke="#30363d"/>
  <rect x="462" y="188" width="158" height="76" rx="4" fill="#e8e4d8"/>
  <text x="541" y="212" font-size="9" fill="#5a5240" text-anchor="middle">血圧手帳（写真）</text>
  <text x="541" y="232" font-size="11" fill="#a33" text-anchor="middle" font-weight="bold">142 / 88</text>
  <line x1="474" y1="248" x2="608" y2="248" stroke="#b8b0a0" stroke-width="1"/>
  <line x1="474" y1="254" x2="586" y2="254" stroke="#b8b0a0" stroke-width="1"/>
  <text x="462" y="284" font-size="9" fill="#8b949e">🖼 血圧手帳.jpg  2.4MB</text>

  <!-- pdf attachment -->
  <rect x="640" y="178" width="176" height="118" rx="6" fill="#0d1117" stroke="#30363d"/>
  <rect x="652" y="192" width="46" height="56" rx="4" fill="#b5352c"/>
  <text x="675" y="226" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">PDF</text>
  <text x="708" y="214" font-size="9" fill="#b5bac1">診療情報提供書.pdf</text>
  <text x="708" y="232" font-size="9" fill="#6e7681">128KB・1ページ</text>
  <text x="652" y="284" font-size="9" fill="#8b949e">📄 クリックで開く</text>

  <text x="456" y="326" font-size="9" fill="#6e7681">関連する新しい投稿もこのスレッドに続く</text>

  <!-- captions -->
  <text x="195" y="382" font-size="10" fill="#8b949e" text-anchor="middle">カードは読みやすく</text>
  <text x="634" y="382" font-size="10" fill="#8b949e" text-anchor="middle">本文・画像・PDFをスレッドへ配送</text>
</svg>
