<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Menlo, 'Hiragino Sans', monospace">
  <title>MCS の収集・解析・通知の構成</title>
  <desc>この Mac 内の保存・ローカル推論・閲覧経路と、明示設定で使用する外部の意味評価・通知サービス。</desc>
  <rect width="940" height="560" fill="#0d1117"/>
  <defs>
    <marker id="rt_ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/>
    </marker>
    <marker id="rt_ar_up" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/>
    </marker>
    <marker id="rt_ar_dim" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- ============ external services (top row) ============ -->
  <rect x="40" y="24" width="190" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="135" y="48" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="bold">MedicalCareStation</text>
  <text x="135" y="68" font-size="10" fill="#8b949e" text-anchor="middle">医療・介護チャット（原本）</text>

  <rect x="560" y="24" width="160" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="640" y="48" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="bold">TypeSafe Jev API</text>
  <text x="640" y="68" font-size="10" fill="#8b949e" text-anchor="middle">任意・意味評価</text>

  <rect x="725" y="24" width="160" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="805" y="48" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="bold">Discord #mcs</text>
  <text x="805" y="68" font-size="10" fill="#8b949e" text-anchor="middle">カード＋スレッド通知</text>

  <!-- ============ this Mac ============ -->
  <rect x="30" y="112" width="880" height="430" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="470" y="136" font-size="12" fill="#8b949e" text-anchor="middle">この Mac — 常時稼働プロセス</text>

  <!-- row 1: ingest pipeline -->
  <rect x="60" y="164" width="140" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="188" font-size="11" fill="#e6edf3" text-anchor="middle">Chrome :9333</text>
  <text x="130" y="206" font-size="9" fill="#8b949e" text-anchor="middle">CDP セッション</text>

  <line x1="202" y1="191" x2="226" y2="191" stroke="#58a6ff" stroke-width="2" marker-end="url(#rt_ar)"/>
  <rect x="230" y="164" width="130" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="295" y="188" font-size="11" fill="#e6edf3" text-anchor="middle">run_check.py</text>
  <text x="295" y="206" font-size="9" fill="#8b949e" text-anchor="middle">収集・取込</text>

  <line x1="362" y1="191" x2="386" y2="191" stroke="#58a6ff" stroke-width="2" marker-end="url(#rt_ar)"/>
  <rect x="390" y="164" width="140" height="54" rx="8" fill="#1f6feb"/>
  <text x="460" y="188" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">ledger.db</text>
  <text x="460" y="206" font-size="9" fill="#bdd4f7" text-anchor="middle">SQLite・WAL</text>

  <line x1="532" y1="191" x2="556" y2="191" stroke="#58a6ff" stroke-width="2" marker-end="url(#rt_ar)"/>
  <rect x="560" y="164" width="140" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="630" y="188" font-size="11" fill="#e6edf3" text-anchor="middle">notify_flush</text>
  <text x="630" y="206" font-size="9" fill="#8b949e" text-anchor="middle">通知を仕分け</text>

  <line x1="702" y1="191" x2="726" y2="191" stroke="#58a6ff" stroke-width="2" marker-end="url(#rt_ar)"/>
  <rect x="730" y="164" width="150" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="805" y="188" font-size="11" fill="#e6edf3" text-anchor="middle">Hermes gateway</text>
  <text x="805" y="206" font-size="9" fill="#8b949e" text-anchor="middle">配送 worker（parts）</text>

  <!-- row 2: extraction -->
  <rect x="220" y="262" width="150" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="295" y="286" font-size="11" fill="#e6edf3" text-anchor="middle">extract_llm ×2</text>
  <text x="295" y="304" font-size="9" fill="#8b949e" text-anchor="middle">構造化抽出（常駐）</text>

  <line x1="372" y1="289" x2="416" y2="289" stroke="#58a6ff" stroke-width="2" marker-end="url(#rt_ar)"/>
  <rect x="420" y="262" width="170" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="505" y="286" font-size="11" fill="#e6edf3" text-anchor="middle">llama-server :8080</text>
  <text x="505" y="304" font-size="9" fill="#8b949e" text-anchor="middle">Qwen3.5-9B・GPU</text>

  <rect x="640" y="262" width="140" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="710" y="286" font-size="11" fill="#e6edf3" text-anchor="middle">semantic drain</text>
  <text x="710" y="304" font-size="9" fill="#8b949e" text-anchor="middle">意味チェック（任意）</text>

  <!-- ledger -> extract / semantic -->
  <line x1="430" y1="218" x2="310" y2="258" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rt_ar_dim)"/>
  <line x1="500" y1="218" x2="700" y2="258" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rt_ar_dim)"/>

  <!-- row 3: read surface -->
  <rect x="220" y="352" width="180" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="372" font-size="11" fill="#e6edf3" text-anchor="middle">snapshots/</text>
  <text x="310" y="390" font-size="9" fill="#8b949e" text-anchor="middle">ローカル・読み取り専用</text>

  <line x1="402" y1="376" x2="446" y2="376" stroke="#58a6ff" stroke-width="2" marker-end="url(#rt_ar)"/>
  <rect x="450" y="352" width="170" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="535" y="372" font-size="11" fill="#e6edf3" text-anchor="middle">mcs_view.py</text>
  <text x="535" y="390" font-size="9" fill="#8b949e" text-anchor="middle">検索・統計・閲覧</text>

  <line x1="420" y1="218" x2="330" y2="348" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rt_ar_dim)"/>

  <!-- external arrows -->
  <line x1="133" y1="80" x2="131" y2="160" stroke="#58a6ff" stroke-width="2" marker-end="url(#rt_ar)"/>
  <text x="148" y="122" font-size="9" fill="#8b949e">取得</text>
  <text x="148" y="134" font-size="9" fill="#8b949e">(API/CDP)</text>

  <line x1="805" y1="160" x2="805" y2="84" stroke="#3fb950" stroke-width="2" marker-end="url(#rt_ar_up)"/>
  <text x="818" y="122" font-size="9" fill="#8b949e">カード</text>
  <text x="818" y="134" font-size="9" fill="#8b949e">+スレッド投稿</text>

  <line x1="710" y1="258" x2="710" y2="84" stroke="#3fb950" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#rt_ar_up)"/>
  <text x="722" y="236" font-size="9" fill="#8b949e">監査クエリ(任意)</text>

  <!-- supervisor band -->
  <line x1="150" y1="430" x2="150" y2="406" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rt_ar_dim)"/>
  <line x1="330" y1="430" x2="330" y2="406" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rt_ar_dim)"/>
  <line x1="535" y1="430" x2="535" y2="406" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rt_ar_dim)"/>
  <line x1="790" y1="430" x2="790" y2="406" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rt_ar_dim)"/>
  <text x="470" y="420" font-size="9" fill="#8b949e" text-anchor="middle">起動・監督</text>

  <rect x="60" y="432" width="400" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="76" y="454" font-size="11" fill="#e6edf3" font-weight="bold">hermes cron（gateway 内）</text>
  <text x="76" y="476" font-size="10" fill="#8b949e">MCS 未読 */10分 · 深掘り 10,40分</text>
  <text x="76" y="496" font-size="10" fill="#8b949e">失敗再試行 6時間毎 · 更新 5:10</text>

  <rect x="490" y="432" width="390" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="506" y="454" font-size="11" fill="#e6edf3" font-weight="bold">launchd（KeepAlive / WatchPaths）</text>
  <text x="506" y="476" font-size="10" fill="#8b949e">cmd/cmd_int 即時取込 · recovery 900秒</text>
  <text x="506" y="496" font-size="10" fill="#8b949e">extract-drainer ×2 · gateway · llamacpp</text>
</svg>
