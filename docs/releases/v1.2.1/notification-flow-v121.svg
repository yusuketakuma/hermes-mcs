<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">通知を止めない修正</title><desc id="flow-desc">公開に失敗したスタンプ結果は再試行時刻を持って順番待ちの後ろへ回り、過去投稿の編集は新着の通知を抑制しない。</desc><rect width="980" height="420" fill="#f5f5f5"/><text x="40" y="44" font-size="22" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">通知を止めない修正：失敗した結果は後ろへ回り、過去の編集は新着を止めない</text><text x="40" y="92" font-size="17" font-weight="700" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">以前（1.2.0）</text><rect x="40" y="108" width="420" height="260" rx="6" fill="#fff" stroke="#6b7080" stroke-width="1.5"/><text x="60" y="142" font-size="15" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">通知キューの先頭</text><rect x="56" y="156" width="180" height="36" rx="6" fill="#fde9df" stroke="#d64541" stroke-width="1.5"/><text x="146" y="180" font-size="14" font-weight="400" fill="#d64541" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">スタンプ結果：失敗</text><rect x="244" y="156" width="100" height="36" rx="6" fill="#eee" stroke="#c9ccd4" stroke-width="1.5"/><text x="294" y="180" font-size="14" font-weight="400" fill="#6b7080" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">新着通知</text><rect x="352" y="156" width="92" height="36" rx="6" fill="#eee" stroke="#c9ccd4" stroke-width="1.5"/><text x="398" y="180" font-size="14" font-weight="400" fill="#6b7080" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">通知</text><path d="M236 174 H244" stroke="#6b7080" stroke-width="2" fill="none"/><path d="M344 174 H352" stroke="#6b7080" stroke-width="2" fill="none"/><text x="60" y="216" font-size="14" font-weight="400" fill="#d64541" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">失敗するたび先頭に残り、後続が届かない</text><text x="60" y="252" font-size="15" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">過去投稿の編集</text><rect x="56" y="266" width="388" height="36" rx="6" fill="#eee" stroke="#c9ccd4" stroke-width="1.5"/><text x="70" y="290" font-size="14" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">無関係な過去編集でスレッドの新着まで通知なし</text><text x="60" y="336" font-size="14" font-weight="400" fill="#d64541" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">正当な新着返信の通知まで抑制される</text><text x="520" y="92" font-size="17" font-weight="700" fill="#eb6c36" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">今回（1.2.1）</text><rect x="520" y="108" width="420" height="260" rx="6" fill="#fff" stroke="#eb6c36" stroke-width="2"/><text x="540" y="142" font-size="15" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">失敗した行は再試行時刻を持って後ろへ</text><rect x="536" y="156" width="100" height="36" rx="6" fill="#fde9df" stroke="#eb6c36" stroke-width="1.5"/><text x="586" y="180" font-size="14" font-weight="400" fill="#2d3142" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">新着通知</text><rect x="644" y="156" width="92" height="36" rx="6" fill="#fde9df" stroke="#eb6c36" stroke-width="1.5"/><text x="690" y="180" font-size="14" font-weight="400" fill="#2d3142" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">通知</text><rect x="744" y="156" width="180" height="36" rx="6" fill="#fff" stroke="#eb6c36" stroke-width="1.5" stroke-dasharray="5,4"/><text x="834" y="180" font-size="13" font-weight="400" fill="#6b7080" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">失敗→60秒〜倍々で再試行</text><path d="M636 174 H644" stroke="#eb6c36" stroke-width="2" fill="none"/><path d="M736 174 H744" stroke="#eb6c36" stroke-width="2" fill="none"/><text x="540" y="216" font-size="14" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">あとに確定した正常な操作の通知は止まらない</text><text x="540" y="252" font-size="15" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">過去投稿の編集と新着を分けて判定</text><rect x="536" y="266" width="388" height="36" rx="6" fill="#fde9df" stroke="#eb6c36" stroke-width="1.5"/><text x="550" y="290" font-size="14" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">過去編集は新着の到着記録・通知対象を残す</text><text x="540" y="336" font-size="14" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">新着返信の通知は従来どおり届く</text><path d="M468 238 H512" stroke="#eb6c36" stroke-width="2.5" fill="none"/><path d="M506 231 L514 238 L506 245" stroke="#eb6c36" stroke-width="2.5" fill="none"/><text x="40" y="396" font-size="13" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">スタンプ結果の公開と、スレッド解析の通知判定を示す説明図です。実画面や測定結果ではありません。</text></svg>
