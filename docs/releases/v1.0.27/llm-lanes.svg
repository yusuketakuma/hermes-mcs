<svg xmlns="http://www.w3.org/2000/svg" width="390" height="790" viewBox="0 0 390 790" role="img" aria-labelledby="title desc">
  <title id="title">MCS 1.0.27 のLLMレーンの役割と処理順の説明図</title>
  <desc id="desc">レーン1は新着と対話の専用枠。レーン2と3はGPUでの推論を順番に実行する。レーン3は保存待ちの抽出結果の保存を試し、対象条件を満たす患者のコンテキストを24時間作成する。作成が進まない周回は過去分の抽出と意味チェックへ進む。速度や処理量の改善幅は未測定。</desc>
  <rect width="390" height="790" fill="#f7f5f0"/>
  <g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" fill="#202124">
    <text x="16" y="31" font-size="16" font-weight="700" fill="#087f5b">HERMES-MCS / 1.0.27</text>
    <text x="16" y="65" font-size="24" font-weight="700">LLMの仕事を3つに分担</text>
    <text x="16" y="90" font-size="15" fill="#596560">新版の役割と処理順（説明図）</text>

    <rect x="16" y="110" width="358" height="100" rx="12" fill="#edf4ff" stroke="#afc3dc"/>
    <circle cx="43" cy="141" r="17" fill="#305b91"/>
    <text x="43" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text>
    <text x="72" y="149" font-size="21" font-weight="700">新着・対話</text>
    <text x="31" y="183" font-size="16">専用の枠で受け付ける</text>

    <rect x="16" y="229" width="358" height="434" rx="12" fill="#e7f0eb"/>
    <text x="30" y="258" font-size="18" font-weight="700">2・3の推論はGPUを順番に使う</text>
    <text x="30" y="282" font-size="14" fill="#465a4f">この2枠での推論を同時に実行しない</text>

    <rect x="30" y="300" width="330" height="86" rx="10" fill="#fff" stroke="#b9c9c0"/>
    <circle cx="56" cy="327" r="16" fill="#087f5b"/>
    <text x="56" y="334" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2</text>
    <text x="83" y="334" font-size="19" font-weight="700">過去の投稿を解析</text>
    <text x="45" y="365" font-size="15">抽出・意味チェックを進める</text>

    <rect x="30" y="402" width="330" height="243" rx="10" fill="#fff" stroke="#b9c9c0"/>
    <circle cx="56" cy="429" r="16" fill="#087f5b"/>
    <text x="56" y="436" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3</text>
    <text x="83" y="436" font-size="18" font-weight="700">患者コンテキストを優先</text>
    <text x="45" y="473" font-size="16">保存待ちの抽出結果の保存を試す</text>
    <path d="M195 482v12m-5-4 5 5 5-5" fill="none" stroke="#087f5b" stroke-width="2"/>
    <text x="45" y="520" font-size="18" font-weight="700">患者コンテキストを作成</text>
    <text x="45" y="544" font-size="13">24時間・対象条件を満たす患者から</text>
    <path d="M195 554v12m-5-4 5 5 5-5" fill="none" stroke="#087f5b" stroke-width="2"/>
    <text x="45" y="591" font-size="16">作成が進まない周回は過去分へ</text>
    <text x="45" y="618" font-size="15" fill="#596560">抽出・意味チェックを進める</text>

    <text x="16" y="697" font-size="18" font-weight="700">完成した抽出結果を持ち越す</text>
    <text x="16" y="722" font-size="14" fill="#596560">保存の競合によるやり直しを減らします。</text>
    <text x="16" y="758" font-size="12" fill="#596560">仕組みの説明図です。実画面ではありません。</text>
    <text x="16" y="779" font-size="12" fill="#596560">速度・処理量の改善幅は未測定です。</text>
  </g>
</svg>
