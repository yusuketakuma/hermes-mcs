<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">在宅ケア台帳と医薬品検索・照会の追加</title><desc id="flow-desc">在宅ケアの患者台帳・職員・ケアチーム・訪問歴・処方歴・訪問ルートを画面にまとめ、医薬品の検索・照会の共通入口と患者横断検索、照会返答待ちのアラートを追加。</desc><rect width="980" height="420" fill="#f5f5f5"/><text x="40" y="44" font-size="22" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">在宅ケア台帳と医薬品検索・照会：記録を台帳へまとめ、検索とアラートで届ける</text><text x="40" y="92" font-size="17" font-weight="700" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">以前（1.2.1）</text><rect x="40" y="108" width="420" height="260" rx="6" fill="#fff" stroke="#6b7080" stroke-width="1.5"/><text x="60" y="142" font-size="15" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">在宅ケアの記録</text><rect x="56" y="156" width="388" height="36" rx="6" fill="#eee" stroke="#c9ccd4" stroke-width="1.5"/><text x="70" y="180" font-size="14" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">投稿の履歴を読んで訪問・処方の情報を拾う</text><text x="60" y="216" font-size="14" font-weight="400" fill="#d64541" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">職員・ケアチーム・訪問歴・処方歴・訪問ルートの一覧がない</text><text x="60" y="252" font-size="15" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">医薬品の確認と照会</text><rect x="56" y="266" width="388" height="36" rx="6" fill="#eee" stroke="#c9ccd4" stroke-width="1.5"/><text x="70" y="290" font-size="14" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">マスター差分・添付文書の改訂を個別に確認</text><text x="60" y="336" font-size="14" font-weight="400" fill="#d64541" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">照会の返答待ち・処方期限の近い患者の一覧がない</text><text x="520" y="92" font-size="17" font-weight="700" fill="#eb6c36" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">今回（1.3.0）</text><rect x="520" y="108" width="420" height="260" rx="6" fill="#fff" stroke="#eb6c36" stroke-width="2"/><text x="540" y="142" font-size="15" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">在宅ケアの患者台帳</text><rect x="536" y="156" width="388" height="36" rx="6" fill="#fde9df" stroke="#eb6c36" stroke-width="1.5"/><text x="550" y="180" font-size="14" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">職員・ケアチーム・訪問歴・処方歴・訪問ルートを1画面に</text><text x="540" y="216" font-size="14" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">事業所のスマホから使える常駐モードとローカルバックアップ対象</text><text x="540" y="252" font-size="15" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">医薬品の検索・照会</text><rect x="536" y="266" width="388" height="36" rx="6" fill="#fde9df" stroke="#eb6c36" stroke-width="1.5"/><text x="550" y="290" font-size="14" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">共通入口で検索・照会。改訂・差分から患者を横断検索</text><text x="540" y="336" font-size="14" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">照会の返答待ちをアラート。日次サマリーに処方期限の一覧</text><path d="M468 238 H512" stroke="#eb6c36" stroke-width="2.5" fill="none"/><path d="M506 231 L514 238 L506 245" stroke="#eb6c36" stroke-width="2.5" fill="none"/><text x="40" y="396" font-size="13" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">在宅ケア台帳と医薬品の検索・照会の追加を示す説明図です。実画面や測定結果ではありません。</text></svg>
