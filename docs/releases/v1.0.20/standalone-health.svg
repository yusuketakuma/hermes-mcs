<svg xmlns="http://www.w3.org/2000/svg" width="510" height="510" viewBox="0 0 510 510" font-family="Hiragino Sans, sans-serif">
<title>独立実行のhostを外から監視する説明図</title><desc>独立hostの外部監視が状態を読み、停止や未回復を判定して設定済み通知先へ警報する。実画面ではない。</desc>
<rect width="510" height="510" fill="#f5f7fa"/><g transform="translate(55 0)">
<text x="24" y="38" font-size="21" font-weight="bold" fill="#172a3a">1.0.20：独立実行の監視</text>
<text x="24" y="66" font-size="16" fill="#405563">hostが止まっても、別の監視が確認</text>
<rect x="24" y="90" width="352" height="76" rx="12" fill="#e4eefb" stroke="#426a9c"/>
<text x="42" y="121" font-size="18" font-weight="bold">hostとは別のヘルス監視</text>
<text x="42" y="148" font-size="15">macOS LaunchAgent / Linux timer</text>
<path d="M200 166 v25" stroke="#405563" stroke-width="2"/><path d="M194 183 l6 8 6-8" fill="none" stroke="#405563" stroke-width="2"/>
<rect x="24" y="194" width="352" height="70" rx="12" fill="white" stroke="#a6b3bd"/>
<text x="42" y="224" font-size="18" font-weight="bold">保存された状態を読み取る</text>
<text x="42" y="248" font-size="15">host・子処理・接続・収集の記録</text>
<path d="M200 264 v25" stroke="#405563" stroke-width="2"/><path d="M194 281 l6 8 6-8" fill="none" stroke="#405563" stroke-width="2"/>
<rect x="24" y="292" width="352" height="70" rx="12" fill="#fff0db" stroke="#a67832"/>
<text x="42" y="322" font-size="18" font-weight="bold">停止・未回復・停滞を判定</text>
<text x="42" y="347" font-size="15">連続異常終了や長い更新待ちも確認</text>
<path d="M200 362 v25" stroke="#405563" stroke-width="2"/><path d="M194 379 l6 8 6-8" fill="none" stroke="#405563" stroke-width="2"/>
<rect x="24" y="390" width="352" height="64" rx="12" fill="#e2f3eb" stroke="#338065"/>
<text x="42" y="427" font-size="18" font-weight="bold">設定した通知先へ警報</text>
<text x="24" y="481" font-size="13" fill="#405563">説明図。実画面・本番稼働の証明ではありません。</text>
</g></svg>