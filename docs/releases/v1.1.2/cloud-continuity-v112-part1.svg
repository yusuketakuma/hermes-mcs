<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1360" width="780" height="1360" role="img" aria-labelledby="cloud-continuity-v112-part1-title cloud-continuity-v112-part1-desc" font-family="Hiragino Kaku Gothic ProN, sans-serif">
<title id="cloud-continuity-v112-part1-title">v1.1.2 原文から患者情報までの流れ 1/3：保存と個別解析</title>
<desc id="cloud-continuity-v112-part1-desc">MCSの投稿・返信・添付を出典と原文版つきで保存します。画像・PDFは任意でローカルOCRし、本文と添付なし・OCR無効の資料はOCRを通らずに個別ローカル抽出と品質確認へ進み、採用できる資料集合を固定します。左の線は3/3の検索・通知へ独立して渡り、右の線はOCRを通らない資料の経路です。合成の説明図で、実画面・測定値・患者データではありません。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66716f"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087f5b"/></marker></defs>
<rect width="780" height="1360" fill="#f6f4ef"/>
<text x="36" y="56" font-size="30" font-weight="700" fill="#202124">v1.1.2 原文から患者情報までの流れ（1/3）</text>
<text x="36" y="98" font-size="26" fill="#66716f">合成の説明図。実画面・測定値・患者データではありません。</text>
<text x="36" y="134" font-size="26" fill="#66716f">番号はデータ依存の順です。確認済み結果は再利用します。</text>
<text x="110" y="184" font-size="30" font-weight="700" fill="#087f5b">保存と個別解析（ローカル）</text>
<rect x="110" y="218" width="560" height="168" rx="14" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="132" y="272" font-size="30" font-weight="700" fill="#202124">1 MCSの投稿・返信・添付を保存</text>
<text x="132" y="318" font-size="28" fill="#202124">出典・原文版・取得状態を記録</text>
<text x="132" y="356" font-size="28" fill="#66716f">左の線：検索・通知へ独立して渡る</text>
<path d="M390 386 L390 432" stroke="#66716f" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="110" y="436" width="560" height="244" rx="14" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="132" y="490" font-size="30" font-weight="700" fill="#202124">2 画像・PDFを任意でローカルOCR</text>
<text x="132" y="536" font-size="28" fill="#202124">本文とは別の資料・ページ付きで保存</text>
<text x="132" y="574" font-size="28" fill="#66716f">本文はOCRを通らない（右の線）</text>
<text x="132" y="612" font-size="28" fill="#66716f">添付なし・OCR無効もOCRを通らない</text>
<text x="132" y="650" font-size="28" fill="#66716f">有効OCRが未完の添付は完了扱いしない</text>
<path d="M670 268 H718 V780 H674" stroke="#66716f" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<path d="M390 680 L390 726" stroke="#66716f" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="110" y="730" width="560" height="206" rx="14" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="132" y="784" font-size="30" font-weight="700" fill="#202124">3 個別ローカル抽出＋品質確認</text>
<text x="132" y="830" font-size="28" fill="#202124">投稿・OCRを原文・対象・否定・</text>
<text x="132" y="868" font-size="28" fill="#202124">時制で照合</text>
<text x="132" y="906" font-size="28" fill="#66716f">処理枠は 3/3 の表を参照</text>
<path d="M110 268 H62 V1296" stroke="#087f5b" stroke-width="3" fill="none" marker-end="url(#arrg)"/>
<path d="M390 936 L390 982" stroke="#66716f" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="110" y="986" width="560" height="206" rx="14" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="132" y="1040" font-size="30" font-weight="700" fill="#202124">4 採用できる資料集合を固定</text>
<text x="132" y="1086" font-size="28" fill="#202124">含む・未反映・取得不能を区別</text>
<text x="132" y="1124" font-size="28" fill="#66716f">別患者・削除・旧版・</text>
<text x="132" y="1162" font-size="28" fill="#66716f">権限不明は採用しない</text>
<text x="110" y="1240" font-size="26" fill="#66716f">→ 2/3：患者contextの育成へ続く</text>
<text x="80" y="1290" font-size="24" fill="#087f5b">3/3 の検索・通知へ</text>
</svg>
