<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" role="img" aria-labelledby="t d" font-family="Hiragino Kaku Gothic ProN, sans-serif" id="data-processing-v112-root">
<title id="t">v1.1.2 データ処理の流れ</title>
<desc id="d">投稿と添付をMacへ保存しOCRで文字起こし、個別解析はローカルで進め、品質を確認した資料から患者コンテキストを作成して通知と検索へ渡します。外部監査は別経路です。実画面や測定結果ではありません。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style><marker id="data-processing-v112-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66716f"/></marker></defs>
<rect width="390" height="720" fill="#f6f4ef"/>
<g fill="#202124">
<text x="20" y="34" font-size="17" font-weight="700">データ処理の流れ（v1.1.2）</text>
<text x="20" y="56" font-size="12" fill="#66716f">投稿から通知・検索まで・合成説明図</text>
<rect x="16" y="72" width="358" height="86" rx="12" fill="#ffffff" stroke="#d5dcd7"/>
<text x="32" y="102" font-size="15" font-weight="700">1　投稿・添付の受信</text>
<text x="32" y="126" font-size="12" fill="#66716f">Slack / Discord / LINE WORKS</text>
<text x="32" y="146" font-size="12" fill="#66716f">本文と添付を分けて保持</text>
<path d="M195 160V178" stroke="#66716f" stroke-width="2" marker-end="url(#data-processing-v112-ar)"/>
<rect x="16" y="182" width="358" height="86" rx="12" fill="#ffffff" stroke="#d5dcd7"/>
<text x="32" y="212" font-size="15" font-weight="700">2　Macへ保存＋OCR</text>
<text x="32" y="236" font-size="12" fill="#66716f">画像・PDFをページと出典付きで保存</text>
<text x="32" y="256" font-size="12" fill="#66716f">ローカルで文字起こし</text>
<path d="M195 270V288" stroke="#66716f" stroke-width="2" marker-end="url(#data-processing-v112-ar)"/>
<rect x="16" y="292" width="358" height="86" rx="12" fill="#ffffff" stroke="#d5dcd7"/>
<text x="32" y="322" font-size="15" font-weight="700">3　個別解析（ローカル）</text>
<text x="32" y="346" font-size="12" fill="#66716f">昼夜で最大3枠・新着優先</text>
<text x="32" y="366" font-size="12" fill="#66716f">クラウドを待たずに進む</text>
<path d="M195 380V398" stroke="#66716f" stroke-width="2" marker-end="url(#data-processing-v112-ar)"/>
<rect x="16" y="402" width="358" height="104" rx="12" fill="#e9f5ef" stroke="#087f5b"/>
<text x="32" y="432" font-size="15" font-weight="700" fill="#087f5b">4　患者コンテキスト</text>
<text x="32" y="456" font-size="12" fill="#202124">品質確認済みの資料から部分作成</text>
<text x="32" y="476" font-size="12" fill="#202124">1日4回・原則3時間間隔（JST）</text>
<text x="32" y="496" font-size="12" fill="#202124">生成クラウドは設定時のみ</text>
<path d="M195 508V526" stroke="#66716f" stroke-width="2" marker-end="url(#data-processing-v112-ar)"/>
<rect x="16" y="530" width="358" height="86" rx="12" fill="#ffffff" stroke="#d5dcd7"/>
<text x="32" y="560" font-size="15" font-weight="700">5　通知・検索</text>
<text x="32" y="584" font-size="12" fill="#66716f">カード表示・患者内の原資料検索</text>
<text x="32" y="604" font-size="12" fill="#66716f">解析完了を待たず検索できる</text>
<rect x="16" y="632" width="358" height="70" rx="12" fill="#edf0ee" stroke="#d5dcd7"/>
<text x="32" y="658" font-size="12" font-weight="700" fill="#66716f">別経路：外部監査（Jev）</text>
<text x="32" y="680" font-size="12" fill="#66716f">設定時のみ・この保存/解析経路とは別</text>
</g></svg>
