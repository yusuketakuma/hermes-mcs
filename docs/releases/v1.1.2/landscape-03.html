<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>landscape-03</title></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="landscape-03-title landscape-03-desc" font-family="Noto Sans CJK JP,Hiragino Sans,Yu Gothic,Droid Sans Fallback,sans-serif">
<title id="landscape-03-title">v1.1.2 患者コンテキスト：概況と採用（3/5）</title>
<desc id="landscape-03-desc">Aの項目・順序選択、品質確認・有限修復・再監査を経て、採用直前と閲覧時の再照合から本人向けの患者情報へ渡す。合成の説明図。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66716f"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087f5b"/></marker></defs>
<rect width="1600" height="900" fill="#f6f4ef"/>
<text x="48" y="86" font-size="52" font-weight="700" fill="#202124">v1.1.2 患者コンテキスト：概況と採用（3/5）</text>
<text x="48" y="132" font-size="28" font-weight="400" fill="#66716f">説明図（実画面・測定値・患者データではありません）</text>
<text x="48" y="168" font-size="26" font-weight="400" fill="#66716f">図2の根拠照合から続きます。5〜8の範囲を破線枠で示します。</text>
<path d="M285 292 H1453" stroke="#66716f" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="48" y="254" width="474" height="76" rx="12" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="72" y="306" font-size="44" font-weight="700" fill="#202124">7 A：項目と順序</text>
<rect x="562" y="254" width="474" height="76" rx="12" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="586" y="306" font-size="44" font-weight="700" fill="#202124">8 品質確認・修復</text>
<rect x="1076" y="254" width="474" height="76" rx="12" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="1100" y="306" font-size="44" font-weight="700" fill="#202124">9 採用・閲覧</text>
<rect x="48" y="372" width="474" height="398" rx="14" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="72" y="424" font-size="30" font-weight="400" fill="#202124">概況の項目と順序を選ぶ</text>
<text x="72" y="476" font-size="30" font-weight="400" fill="#202124">検証済みの事実だけを使う</text>
<text x="72" y="512" font-size="30" font-weight="400" fill="#202124">表示文は原文の引用から</text>
<text x="72" y="548" font-size="30" font-weight="400" fill="#202124">復元</text>
<text x="72" y="600" font-size="30" font-weight="400" fill="#202124">前回のcontextを新しい</text>
<text x="72" y="636" font-size="30" font-weight="400" fill="#202124">事実として入れない</text>
<rect x="562" y="372" width="474" height="398" rx="14" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="586" y="424" font-size="30" font-weight="400" fill="#202124">必要な品質確認・</text>
<text x="586" y="460" font-size="30" font-weight="400" fill="#202124">有限修復・再監査</text>
<text x="586" y="512" font-size="30" font-weight="400" fill="#202124">合格し適用条件を満たした</text>
<text x="586" y="548" font-size="30" font-weight="400" fill="#202124">ときだけ9へ</text>
<text x="586" y="600" font-size="30" font-weight="400" fill="#202124">入力・出典・判断が</text>
<text x="586" y="636" font-size="30" font-weight="400" fill="#202124">不明なら保留</text>
<rect x="1076" y="372" width="474" height="398" rx="14" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="1100" y="424" font-size="30" font-weight="400" fill="#202124">採用直前と閲覧時に再照合</text>
<text x="1100" y="476" font-size="30" font-weight="400" fill="#202124">原資料・契約・権限・</text>
<text x="1100" y="512" font-size="30" font-weight="400" fill="#202124">処理権を確認</text>
<text x="1100" y="548" font-size="30" font-weight="400" fill="#202124">保存済みの原資料で</text>
<text x="1100" y="584" font-size="30" font-weight="400" fill="#202124">訂正・削除・失効を検知</text>
<text x="1100" y="620" font-size="30" font-weight="400" fill="#202124">したら古い内容を返さない</text>
<text x="1100" y="672" font-size="30" font-weight="400" fill="#202124">新着だけで既採用を捨てず</text>
<text x="1100" y="708" font-size="30" font-weight="400" fill="#202124">未反映件数を表示</text>
<rect x="36" y="240" width="1028" height="518" rx="18" fill="none" stroke="#087f5b" stroke-width="3" stroke-dasharray="12 8"/>
<text x="60" y="232" font-size="26" font-weight="700" fill="#087f5b">図2から続く同じ範囲（5〜8）</text>
<rect x="1076" y="800" width="474" height="44" rx="8" fill="#e9f5ef"/>
<text x="1092" y="831" font-size="26" font-weight="700" fill="#087f5b">本人向けの患者情報へ</text>
</svg></body></html>
