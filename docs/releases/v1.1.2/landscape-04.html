<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>landscape-04</title></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="landscape-04-title landscape-04-desc" font-family="Noto Sans CJK JP,Hiragino Sans,Yu Gothic,Droid Sans Fallback,sans-serif">
<title id="landscape-04-title">v1.1.2 検索・通知とJev（4/5）</title>
<desc id="landscape-04-desc">検索・通知は保存から独立した経路でcontextの完成を待たない。Jevは設定次第の別経路で主線の通過先ではない。合成の説明図。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66716f"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087f5b"/></marker></defs>
<rect width="1600" height="900" fill="#f6f4ef"/>
<text x="48" y="86" font-size="52" font-weight="700" fill="#202124">v1.1.2 検索・通知とJev（4/5）</text>
<text x="48" y="132" font-size="28" font-weight="400" fill="#66716f">説明図（実画面・測定値・患者データではありません）</text>
<text x="48" y="168" font-size="26" font-weight="400" fill="#66716f">検索・通知は1の保存から独立した経路で、contextの完成を待ちません。</text>
<rect x="48" y="380" width="280" height="140" rx="14" fill="#e9f5ef" stroke="#087f5b" stroke-width="2"/>
<text x="72" y="432" font-size="32" font-weight="700" fill="#087f5b">1 保存した原資料</text>
<text x="72" y="476" font-size="26" font-weight="400" fill="#66716f">図1で固定</text>
<path d="M328 450 H368 V310 H404" stroke="#087f5b" stroke-width="3" fill="none" marker-end="url(#arrg)"/>
<path d="M328 450 H368 V590 H404" stroke="#087f5b" stroke-width="3" fill="none" marker-end="url(#arrg)"/>
<rect x="408" y="240" width="552" height="140" rx="14" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="432" y="292" font-size="36" font-weight="700" fill="#202124">検索</text>
<text x="432" y="336" font-size="28" font-weight="400" fill="#202124">入力500字まで・1ページ5件</text>
<text x="432" y="372" font-size="28" font-weight="400" fill="#202124">検索はLLM・概況の回数を使わない</text>
<rect x="408" y="520" width="552" height="140" rx="14" fill="#ffffff" stroke="#d5dcd7" stroke-width="2"/>
<text x="432" y="572" font-size="36" font-weight="700" fill="#202124">通知</text>
<text x="432" y="616" font-size="28" font-weight="400" fill="#202124">原文・個別解析の状態を先に表示</text>
<text x="432" y="652" font-size="28" font-weight="400" fill="#202124">contextの完成を待たない</text>
<text x="432" y="704" font-size="26" font-weight="400" fill="#66716f">原資料・MCSへのリンクを持つ</text>
<rect x="1040" y="240" width="512" height="420" rx="14" fill="#edf0ee" stroke="#d5dcd7" stroke-width="2"/>
<text x="1064" y="300" font-size="34" font-weight="700" fill="#202124">Jev（設定次第の別経路）</text>
<text x="1064" y="360" font-size="30" font-weight="400" fill="#202124">外部監査として別に送る経路</text>
<text x="1064" y="408" font-size="30" font-weight="400" fill="#202124">匿名・非送信が既定とは限らない</text>
<text x="1064" y="456" font-size="30" font-weight="400" fill="#202124">1〜9の主線の通過先ではない</text>
<text x="1064" y="540" font-size="26" font-weight="400" fill="#66716f">主線・検索・通知からの</text>
<text x="1064" y="576" font-size="26" font-weight="400" fill="#66716f">必須の矢印はありません</text>
</svg></body></html>
