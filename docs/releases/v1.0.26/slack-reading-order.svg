<svg xmlns="http://www.w3.org/2000/svg" width="390" height="610" viewBox="0 0 390 610" role="img" aria-labelledby="title desc">
  <title id="title">Slackの新形式カードを、要約・スタンプ・原文の順に読む説明図</title>
  <desc id="desc">同じ投稿の要点を読み、表示があればスタンプの状態を確認し、折りたたんだ原文を開く。添付・返信の新着案内・収まらない投稿から先の本文はスレッドへ表示する。</desc>
  <rect width="390" height="610" fill="#f7f5f0"/>
  <g font-family="Hiragino Sans,Noto Sans CJK JP,sans-serif" fill="#202124">
    <text x="16" y="31" font-size="16" font-weight="700" fill="#087f5b">HERMES-MCS / 1.0.26</text>
    <text x="16" y="65" font-size="25" font-weight="700">Slackで連絡を読む</text>
    <text x="16" y="90" font-size="15" fill="#596560">新形式カードの読み順（説明図）</text>
    <rect x="16" y="108" width="358" height="92" rx="12" fill="#ffffff" stroke="#b9c9c0"/>
    <text x="30" y="137" font-size="20" font-weight="700">1 要約を読む</text>
    <text x="30" y="165" font-size="16">同じ投稿の要点を先に確認</text>
    <text x="30" y="187" font-size="14" fill="#596560">返信も同じ順で続きます</text>
    <path d="M195 204v10m-5-4 5 5 5-5" fill="none" stroke="#087f5b" stroke-width="2"/>
    <rect x="16" y="222" width="358" height="92" rx="12" fill="#ffffff" stroke="#b9c9c0"/>
    <text x="30" y="251" font-size="20" font-weight="700">2 スタンプの状態を見る</text>
    <text x="30" y="279" font-size="16">表示がある場合に反応を確認</text>
    <text x="30" y="301" font-size="14" fill="#596560">未取得と0件は区別されます</text>
    <path d="M195 318v10m-5-4 5 5 5-5" fill="none" stroke="#087f5b" stroke-width="2"/>
    <rect x="16" y="336" width="358" height="100" rx="12" fill="#ffffff" stroke="#b9c9c0"/>
    <text x="30" y="365" font-size="20" font-weight="700">3 原文を開いて確認する</text>
    <text x="30" y="393" font-size="16">折りたたみから本文へ</text>
    <text x="30" y="416" font-size="14" fill="#596560">確認・担当・タスク作成に進む</text>
    <rect x="16" y="455" width="358" height="97" rx="12" fill="#e7f0eb"/>
    <text x="30" y="481" font-size="16" font-weight="700">スレッドに表示するもの</text>
    <text x="30" y="507" font-size="15">画像・PDF、返信の新着案内、</text>
    <text x="30" y="531" font-size="15">収まらない投稿から先の本文</text>
    <text x="16" y="577" font-size="13" fill="#596560">実画面のキャプチャではありません。</text>
    <text x="16" y="598" font-size="12" fill="#596560">実際の操作・表示は利用中のSlackで確認。</text>
  </g>
</svg>
