<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="cloud-title cloud-desc"><title id="cloud-title">クラウドAIの送信条件とモデル</title><desc id="cloud-desc">施設の確認記録に含めたサービスにだけ、用途別のモデルで送信し、失敗の種類ごとに再送を分ける。</desc><rect width="980" height="420" fill="#f5f5f5"/><text x="40" y="44" font-size="22" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">クラウドAI：施設の確認記録を条件に、用途ごとのモデルで送信</text><rect x="40" y="80" width="230" height="92" rx="6" fill="#fde9df" stroke="#eb6c36" stroke-width="2"/><text x="155" y="114" font-size="15" font-weight="400" fill="#2d3142" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">施設の責任者が</text><text x="155" y="138" font-size="15" font-weight="700" fill="#2d3142" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">確認を記録（新規導入）</text><text x="155" y="160" font-size="11" font-weight="400" fill="#6b7080" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">mcs_compliance.py acknowledge</text><rect x="330" y="80" width="230" height="92" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.5"/><text x="445" y="114" font-size="15" font-weight="400" fill="#2d3142" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">記録に含めた</text><text x="445" y="138" font-size="15" font-weight="700" fill="#2d3142" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">サービスにだけ送信</text><path d="M270 126 H330" stroke="#eb6c36" stroke-width="2.5" fill="none"/><path d="M324 119 L332 126 L324 133" stroke="#eb6c36" stroke-width="2.5" fill="none"/><path d="M560 126 H620" stroke="#6b7080" stroke-width="2" fill="none"/><path d="M614 119 L622 126 L614 133" stroke="#6b7080" stroke-width="2" fill="none"/><rect x="620" y="60" width="300" height="60" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.5"/><text x="635" y="86" font-size="14" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">患者コンテキスト・品質修復</text><text x="635" y="108" font-size="14" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">Sonnet 5.5 high</text><rect x="620" y="132" width="300" height="60" rx="6" fill="#fff" stroke="#6b7080" stroke-width="1.5" stroke-dasharray="5,4"/><text x="635" y="158" font-size="14" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">過去分の再抽出・意味解析</text><text x="635" y="180" font-size="12" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">Haiku 5.5 medium（再開期間を開けた場合のみ）</text><text x="40" y="236" font-size="17" font-weight="700" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">送信後の扱い</text><rect x="40" y="254" width="280" height="100" rx="6" fill="#fff" stroke="#6b7080" stroke-width="1.5"/><text x="56" y="284" font-size="14" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">5xx（サーバー側の失敗）</text><text x="56" y="312" font-size="13" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">すぐローカルへ回す</text><rect x="340" y="254" width="280" height="100" rx="6" fill="#fff" stroke="#6b7080" stroke-width="1.5"/><text x="356" y="284" font-size="14" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">課金済みで回答のない失敗</text><text x="356" y="312" font-size="13" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">同じ内容は初回を含め最大3回まで再送</text><rect x="640" y="254" width="280" height="100" rx="6" fill="#fff" stroke="#6b7080" stroke-width="1.5"/><text x="656" y="284" font-size="14" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">拒否された応答（HTTP 200）</text><text x="656" y="312" font-size="13" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">再送しない（この版以降の記録）</text><text x="40" y="396" font-size="13" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">説明図です。実画面や測定結果ではありません。外部送信の条件は外部送信と費用の案内に従います。</text></svg>