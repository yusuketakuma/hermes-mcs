<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="card-title card-desc"><title id="card-title">通知カードの構成の変更</title><desc id="card-desc">確認と担当をメニューからボタンへ移し、依頼と薬剤を先頭に置き、処理状況を問題があるときだけ表示する。</desc><rect width="980" height="420" fill="#f5f5f5"/><text x="40" y="44" font-size="22" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">通知カード：確認と担当をボタンにし、処理状況は問題があるときだけ表示</text><text x="40" y="92" font-size="17" font-weight="700" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">以前（1.1.2）</text><rect x="40" y="108" width="420" height="260" rx="6" fill="#fff" stroke="#6b7080" stroke-width="1.5"/><text x="60" y="142" font-size="15" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">依頼内容・薬剤</text><rect x="56" y="156" width="388" height="36" rx="6" fill="#eee" stroke="#c9ccd4" stroke-width="1.5"/><text x="60" y="222" font-size="15" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">処理状況：常に表示</text><rect x="56" y="236" width="388" height="36" rx="6" fill="#eee" stroke="#c9ccd4" stroke-width="1.5"/><text x="70" y="260" font-size="14" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">抽出済み・解析中など</text><rect x="56" y="290" width="120" height="34" rx="6" fill="#fff" stroke="#6b7080" stroke-width="1.5"/><text x="116" y="313" font-size="14" font-weight="400" fill="#2d3142" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">メニュー ▾</text><text x="60" y="350" font-size="14" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">確認・担当はメニューの中</text><text x="520" y="92" font-size="17" font-weight="700" fill="#eb6c36" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">今回（1.2.0）</text><rect x="520" y="108" width="420" height="260" rx="6" fill="#fff" stroke="#eb6c36" stroke-width="2"/><text x="540" y="142" font-size="15" font-weight="700" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">依頼内容・薬剤を先頭に表示</text><rect x="536" y="156" width="388" height="36" rx="6" fill="#fde9df" stroke="#eb6c36" stroke-width="1.5"/><text x="540" y="222" font-size="15" font-weight="400" fill="#2d3142" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">処理状況：問題があるときだけ</text><rect x="536" y="236" width="388" height="36" rx="6" fill="#fff" stroke="#eb6c36" stroke-width="1.5" stroke-dasharray="5,4"/><text x="550" y="260" font-size="14" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">（通常は表示しない）</text><rect x="536" y="290" width="92" height="34" rx="6" fill="#eb6c36" stroke="#eb6c36" stroke-width="1.5"/><text x="582" y="313" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">確認</text><rect x="640" y="290" width="92" height="34" rx="6" fill="#eb6c36" stroke="#eb6c36" stroke-width="1.5"/><text x="686" y="313" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Hiragino Sans,Noto Sans JP,sans-serif">担当</text><text x="540" y="350" font-size="14" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">確認・担当はボタンで直接操作</text><path d="M468 238 H512" stroke="#eb6c36" stroke-width="2.5" fill="none"/><path d="M506 231 L514 238 L506 245" stroke="#eb6c36" stroke-width="2.5" fill="none"/><text x="40" y="396" font-size="13" font-weight="400" fill="#6b7080" text-anchor="start" font-family="Hiragino Sans,Noto Sans JP,sans-serif">Slack・Discord・LINE WORKSのカードの構成を示す説明図です。実画面や測定結果ではありません。</text></svg>