<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'Hiragino Sans', sans-serif">
  <title>完全合成の Slack カード＋スレッド表示例</title>
  <desc>実患者・実投稿を参照せずに新規作成した、Slack カードとスレッドパネルの図。</desc>
  <rect width="960" height="560" fill="#1a1d21"/>
  <defs>
    <marker id="st_ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d9bd1"/>
    </marker>
  </defs>
  <text x="16" y="24" font-size="10" fill="#6e7681">完全合成の表示例（実患者・実投稿の匿名化データは不使用）</text>

  <!-- left: channel -->
  <rect x="0" y="34" width="438" height="46" fill="#19171d"/>
  <line x1="0" y1="80" x2="438" y2="80" stroke="#3a3d42" stroke-width="1"/>
  <text x="16" y="62" font-size="14" fill="#d1d2d3" font-weight="bold">#  mcs-synthetic</text>

  <!-- message -->
  <rect x="16" y="96" width="34" height="34" rx="7" fill="#611f69"/>
  <text x="33" y="119" font-size="14" fill="#fff" text-anchor="middle">M</text>
  <text x="60" y="112" font-size="13" fill="#d1d2d3" font-weight="bold">MCSボット</text>
  <rect x="136" y="100" width="36" height="14" rx="3" fill="none" stroke="#565a5e"/>
  <text x="154" y="110" font-size="8" fill="#ababad" text-anchor="middle">APP</text>
  <text x="186" y="112" font-size="10" fill="#ababad">10:02</text>

  <!-- card attachment -->
  <rect x="60" y="122" width="4" height="288" fill="#1d9bd1"/>
  <rect x="64" y="122" width="356" height="288" rx="4" fill="#222529" stroke="#35373c"/>
  <text x="80" y="146" font-size="12" fill="#d1d2d3" font-weight="bold">💬 山田 太郎 — 09-28</text>

  <text x="80" y="168" font-size="9" fill="#d1d2d3" font-weight="bold">09-28 09:40 訪問看護 佐藤（合成）</text>
  <text x="80" y="186" font-size="9" fill="#ababad" font-weight="bold">📋 構造化</text>
  <text x="80" y="202" font-size="9" fill="#d1d2d3">・バイタル: BP 142/88  HR 76  SpO2 96%</text>
  <text x="80" y="218" font-size="9" fill="#d1d2d3">・症状: めまい(中等度・起立時)</text>

  <text x="80" y="244" font-size="9" fill="#d1d2d3" font-weight="bold">09-28 09:50 ケアマネ 鈴木（合成）</text>
  <text x="80" y="262" font-size="9" fill="#ababad" font-weight="bold">📋 構造化</text>
  <text x="80" y="278" font-size="9" fill="#d1d2d3">・薬剤: フェロキシピン[中止]、カルベジロール 2.5mg[開始]</text>
  <text x="80" y="294" font-size="9" fill="#d1d2d3">・依頼: 確認依頼:次回訪問時に残薬を確認(期限:次回訪問時)</text>

  <line x1="80" y1="310" x2="404" y2="310" stroke="#3a3d42" stroke-width="1"/>

  <!-- actions: 2 quick buttons + select -->
  <rect x="80" y="322" width="74" height="26" rx="5" fill="#007a5a"/>
  <text x="117" y="339" font-size="10" fill="#fff" text-anchor="middle">✅ 確認済み</text>
  <rect x="162" y="322" width="74" height="26" rx="5" fill="#222529" stroke="#565a5e"/>
  <text x="199" y="339" font-size="10" fill="#d1d2d3" text-anchor="middle">👤 担当中</text>
  <rect x="244" y="322" width="120" height="26" rx="5" fill="#222529" stroke="#565a5e"/>
  <text x="258" y="339" font-size="10" fill="#ababad">操作を選ぶ…</text>
  <text x="352" y="339" font-size="9" fill="#ababad" text-anchor="middle">▾</text>

  <!-- link as context text -->
  <text x="80" y="372" font-size="10" fill="#1d9bd1">🔗 MCSで開く</text>
  <text x="80" y="394" font-size="9" fill="#6e7681">カード本体は送信者行と構造化だけ — 本文はスレッドへ</text>

  <!-- Slack reply bar -->
  <rect x="60" y="420" width="356" height="44" rx="6" fill="#1a1d21" stroke="#35373c"/>
  <circle cx="78" cy="442" r="10" fill="#248046"/>
  <text x="78" y="446" font-size="8" fill="#fff" text-anchor="middle">佐</text>
  <circle cx="96" cy="442" r="10" fill="#6e40c9"/>
  <text x="96" y="446" font-size="8" fill="#fff" text-anchor="middle">鈴</text>
  <text x="116" y="438" font-size="10" fill="#1d9bd1">2件の返信</text>
  <text x="116" y="454" font-size="9" fill="#6e7681">最新 09:50 — クリックでスレッドを表示</text>

  <!-- arrow to thread panel -->
  <path d="M 420 442 C 440 442, 442 300, 456 290" fill="none" stroke="#1d9bd1" stroke-width="2" marker-end="url(#st_ar)"/>

  <!-- right: thread panel (Slack sidebar) -->
  <rect x="452" y="0" width="508" height="560" fill="#1a1d21" stroke="#3a3d42"/>
  <rect x="452" y="0" width="508" height="52" fill="#19171d"/>
  <line x1="452" y1="52" x2="960" y2="52" stroke="#3a3d42" stroke-width="1"/>
  <text x="472" y="32" font-size="15" fill="#d1d2d3" font-weight="bold">スレッド</text>
  <text x="540" y="32" font-size="10" fill="#ababad">#mcs-synthetic</text>
  <text x="944" y="32" font-size="14" fill="#ababad" text-anchor="end">✕</text>

  <!-- parent preview -->
  <rect x="470" y="66" width="24" height="24" rx="5" fill="#611f69"/>
  <text x="482" y="83" font-size="10" fill="#fff" text-anchor="middle">M</text>
  <text x="502" y="78" font-size="11" fill="#d1d2d3" font-weight="bold">MCSボット</text>
  <text x="566" y="78" font-size="9" fill="#ababad">10:02</text>
  <text x="502" y="96" font-size="9" fill="#ababad">💬 山田 太郎 — 09-28（構造化カード）</text>

  <!-- replies divider -->
  <line x1="472" y1="122" x2="830" y2="122" stroke="#3a3d42" stroke-width="1"/>
  <text x="846" y="126" font-size="9" fill="#ababad">2件の返信</text>

  <!-- reply 1: body (one post per reply) -->
  <rect x="470" y="140" width="24" height="24" rx="5" fill="#248046"/>
  <text x="482" y="157" font-size="10" fill="#fff" text-anchor="middle">佐</text>
  <text x="502" y="152" font-size="11" fill="#d1d2d3" font-weight="bold">訪問看護 佐藤（合成）</text>
  <text x="676" y="152" font-size="9" fill="#ababad">09:40</text>
  <text x="502" y="176" font-size="9" fill="#d1d2d3">夕方バイタルを測定しました。BP142/88、脈76、SpO2 96%。</text>
  <text x="502" y="192" font-size="9" fill="#d1d2d3">起立時にめまいの訴え。転倒・外傷なし。</text>
  <text x="502" y="208" font-size="9" fill="#d1d2d3">血圧手帳の写真と診療情報提供書を添付します。</text>

  <!-- reply 1: attachments -->
  <rect x="502" y="222" width="180" height="112" rx="6" fill="#222529" stroke="#35373c"/>
  <rect x="510" y="230" width="164" height="76" rx="4" fill="#e8e4d8"/>
  <text x="592" y="252" font-size="9" fill="#5a5240" text-anchor="middle">血圧手帳（写真）</text>
  <text x="592" y="274" font-size="12" fill="#a33" text-anchor="middle" font-weight="bold">142 / 88</text>
  <line x1="522" y1="288" x2="664" y2="288" stroke="#b8b0a0" stroke-width="1"/>
  <line x1="522" y1="294" x2="646" y2="294" stroke="#b8b0a0" stroke-width="1"/>
  <text x="510" y="324" font-size="9" fill="#ababad">🖼 血圧手帳.jpg  2.4MB</text>
  <rect x="692" y="222" width="176" height="112" rx="6" fill="#222529" stroke="#35373c"/>
  <rect x="704" y="236" width="44" height="54" rx="4" fill="#b5352c"/>
  <text x="726" y="268" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">PDF</text>
  <text x="758" y="256" font-size="9" fill="#d1d2d3">診療情報提供書.pdf</text>
  <text x="758" y="272" font-size="9" fill="#6e7681">128KB・1ページ</text>
  <text x="704" y="324" font-size="9" fill="#ababad">📄 クリックで開く</text>

  <!-- reply 2 -->
  <rect x="470" y="350" width="24" height="24" rx="5" fill="#6e40c9"/>
  <text x="482" y="367" font-size="10" fill="#fff" text-anchor="middle">鈴</text>
  <text x="502" y="362" font-size="11" fill="#d1d2d3" font-weight="bold">ケアマネ 鈴木（合成）</text>
  <text x="676" y="362" font-size="9" fill="#ababad">09:50</text>
  <text x="502" y="386" font-size="9" fill="#d1d2d3">かかりつけ医より服薬変更の連絡。</text>
  <text x="502" y="402" font-size="9" fill="#d1d2d3">フェロキシピンは中止、カルベジロール2.5mgを開始します。</text>

  <!-- thread notes -->
  <line x1="472" y1="428" x2="944" y2="428" stroke="#3a3d42" stroke-width="1"/>
  <text x="472" y="450" font-size="9" fill="#6e7681">返信ごとに1投稿 — 関連する新着も同じスレッドに続きます</text>
  <text x="472" y="468" font-size="9" fill="#6e7681">後から届いた返信・抽出結果は投稿を増やさず書き換え（parts ジャーナルで中断点から再開・重複なし）</text>

  <!-- reply input -->
  <rect x="472" y="486" width="472" height="40" rx="8" fill="#222529" stroke="#565a5e"/>
  <text x="488" y="510" font-size="10" fill="#6e7681">スレッド 山田 太郎 — 09-28 への返信…</text>

  <!-- left captions -->
  <text x="219" y="500" font-size="10" fill="#8b949e" text-anchor="middle">カードは読みやすく — 要約と操作だけ</text>
  <text x="219" y="518" font-size="10" fill="#8b949e" text-anchor="middle">本文・添付はスレッドへ</text>
  <text x="219" y="546" font-size="9" fill="#6e7681" text-anchor="middle">Discord と同じ内容が Slack に届きます（合成例）</text>
</svg>
