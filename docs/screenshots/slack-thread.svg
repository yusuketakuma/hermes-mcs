<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Hiragino Sans', sans-serif">
  <title>架空データを使った Slack カード＋スレッド表示例</title>
  <desc>実患者・実投稿を参照せずに新規作成した、Slack カードとスレッドパネルの図。</desc>
  <rect width="960" height="600" fill="#1a1d21"/>
  <text x="16" y="24" font-size="10" fill="#6e7681">名前・投稿・数値は架空です（実データ・実投稿の匿名化例は不使用）</text>
  <rect x="0" y="34" width="438" height="46" rx="0" fill="#19171d"/>
  <line x1="0" y1="80" x2="438" y2="80" stroke="#3a3d42" stroke-width="1"/>
  <text x="16" y="62" font-size="14" fill="#d1d2d3" font-weight="bold">#  mcs-demo</text>
  <rect x="16" y="96" width="34" height="34" rx="7" fill="#611f69"/>
  <text x="33" y="119" font-size="14" fill="#fff" text-anchor="middle">M</text>
  <text x="60" y="112" font-size="13" fill="#d1d2d3" font-weight="bold">MCSボット</text>
  <text x="140" y="112" font-size="10" fill="#ababad">10:02</text>
  <text x="60" y="138" font-size="12" fill="#d1d2d3" font-weight="bold">💬 山田 花子 様（あおぞら）· 起点 10-01</text>
  <text x="60" y="155" font-size="9" fill="#ababad">1投稿 · 📎 1 · @自分宛て</text>
  <line x1="60" y1="167" x2="420" y2="167" stroke="#3a3d42" stroke-width="1"/>
  <text x="60" y="184" font-size="10" fill="#d1d2d3" font-weight="bold">10-01 09:40 佐藤さん（訪問看護・あおぞら）</text>
  <text x="60" y="199" font-size="9" fill="#7fc8a9" font-weight="bold">📋 要約</text>
  <text x="60" y="213" font-size="9" fill="#d1d2d3">・次回訪問時に残薬を確認してほしいとの連絡</text>
  <text x="60" y="227" font-size="9" fill="#d1d2d3">・要点: 残薬の確認 / 服薬カレンダーを共有</text>
  <text x="60" y="241" font-size="9" fill="#d1d2d3">・区分: 依頼・添付</text>
  <text x="60" y="255" font-size="9" fill="#d1d2d3">・依頼: 確認依頼:次回訪問時に残薬を確認(期限:次回訪問時)</text>
  <line x1="60" y1="267" x2="420" y2="267" stroke="#3a3d42" stroke-width="1"/>
  <text x="60" y="284" font-size="9" fill="#ababad">📝 タスク 1件 · スタンプ 👀2 🙆1</text>
  <line x1="60" y1="296" x2="420" y2="296" stroke="#3a3d42" stroke-width="1"/>
  <rect x="60" y="308" width="62" height="24" rx="5" fill="#222529" stroke="#565a5e"/>
  <text x="91.0" y="324" font-size="10" fill="#d1d2d3" text-anchor="middle">確認する</text>
  <rect x="128" y="308" width="62" height="24" rx="5" fill="#222529" stroke="#565a5e"/>
  <text x="159.0" y="324" font-size="10" fill="#d1d2d3" text-anchor="middle">担当する</text>
  <rect x="196" y="308" width="70" height="24" rx="5" fill="#222529" stroke="#565a5e"/>
  <text x="231.0" y="324" font-size="10" fill="#d1d2d3" text-anchor="middle">タスク作成</text>
  <rect x="272" y="308" width="112" height="24" rx="5" fill="#222529" stroke="#565a5e"/>
  <text x="282" y="324" font-size="10" fill="#ababad">操作を選ぶ… ▾</text>
  <text x="60" y="352" font-size="10" fill="#1d9bd1">MCSで開く</text>
  <rect x="60" y="368" width="356" height="40" rx="6" fill="#1a1d21" stroke="#35373c"/>
  <text x="78" y="385" font-size="10" fill="#1d9bd1">2件の返信</text>
  <text x="78" y="399" font-size="9" fill="#6e7681">最新 10:02 — クリックでスレッドを表示</text>
  <defs><marker id="st_ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1d9bd1"/></marker></defs>
  <path d="M 420 388 C 440 388, 442 200, 456 190" fill="none" stroke="#1d9bd1" stroke-width="2" marker-end="url(#st_ar)"/>
  <rect x="452" y="0" width="508" height="600" rx="0" fill="#1a1d21" stroke="#3a3d42"/>
  <rect x="452" y="0" width="508" height="52" rx="0" fill="#19171d"/>
  <line x1="452" y1="52" x2="960" y2="52" stroke="#3a3d42" stroke-width="1"/>
  <text x="472" y="32" font-size="15" fill="#d1d2d3" font-weight="bold">スレッド</text>
  <text x="540" y="32" font-size="10" fill="#ababad">#mcs-demo</text>
  <text x="944" y="32" font-size="14" fill="#ababad" text-anchor="end">✕</text>
  <rect x="470" y="66" width="24" height="24" rx="5" fill="#611f69"/>
  <text x="482" y="83" font-size="10" fill="#fff" text-anchor="middle">M</text>
  <text x="502" y="78" font-size="11" fill="#d1d2d3" font-weight="bold">MCSボット</text>
  <text x="566" y="78" font-size="9" fill="#ababad">10:02</text>
  <text x="502" y="96" font-size="9" fill="#ababad">💬 山田 花子 様（あおぞら）· 起点 10-01</text>
  <line x1="472" y1="116" x2="830" y2="116" stroke="#3a3d42" stroke-width="1"/>
  <text x="846" y="120" font-size="9" fill="#ababad">2件の返信</text>
  <rect x="470" y="134" width="24" height="24" rx="5" fill="#611f69"/>
  <text x="482" y="151" font-size="10" fill="#fff" text-anchor="middle">M</text>
  <text x="502" y="146" font-size="11" fill="#d1d2d3" font-weight="bold">MCSボット</text>
  <text x="566" y="146" font-size="9" fill="#ababad">10:02</text>
  <text x="502" y="166" font-size="10" fill="#d1d2d3" font-weight="bold">↳ 山田 花子 様 · 10-01 09:40 佐藤さん（訪問看護・あおぞら）</text>
  <text x="502" y="181" font-size="10" fill="#7fc8a9" font-weight="bold">📋 要約</text>
  <text x="502" y="196" font-size="10" fill="#d1d2d3">・次回訪問時に残薬を確認してほしいとの連絡</text>
  <text x="502" y="211" font-size="10" fill="#d1d2d3">・要点: 残薬の確認 / 服薬カレンダーを共有</text>
  <text x="502" y="226" font-size="10" fill="#d1d2d3">・区分: 依頼・添付</text>
  <text x="502" y="241" font-size="10" fill="#d1d2d3">・依頼: 確認依頼:次回訪問時に残薬を確認(期限:次回訪問時)</text>
  <text x="502" y="256" font-size="10" fill="#ababad">────────────</text>
  <text x="502" y="271" font-size="10" fill="#7fc8a9">スタンプ 👀2 田中・佐藤 / 🙆1 鈴木 · 10-01 10:00時点</text>
  <text x="502" y="286" font-size="10" fill="#ababad">────────────</text>
  <text x="502" y="301" font-size="10" fill="#d1d2d3">次回訪問時に残薬を確認してください。</text>
  <text x="502" y="316" font-size="10" fill="#d1d2d3">服薬カレンダーの写真を共有します。</text>
  <rect x="470" y="334" width="24" height="24" rx="5" fill="#611f69"/>
  <text x="482" y="351" font-size="10" fill="#fff" text-anchor="middle">M</text>
  <text x="502" y="346" font-size="11" fill="#d1d2d3" font-weight="bold">MCSボット</text>
  <text x="566" y="346" font-size="9" fill="#ababad">10:02</text>
  <text x="502" y="366" font-size="10" fill="#d1d2d3">📎 服薬カレンダー.jpg — 山田 花子 様 10-01 09:40 佐藤さん</text>
  <rect x="502" y="378" width="180" height="96" rx="6" fill="#222529" stroke="#35373c"/>
  <rect x="510" y="386" width="164" height="62" rx="4" fill="#e8e4d8"/>
  <text x="592" y="422" font-size="9" fill="#5a5240" text-anchor="middle">服薬カレンダー（写真）</text>
  <text x="510" y="466" font-size="9" fill="#ababad">🖼 服薬カレンダー.jpg</text>
  <rect x="472" y="548" width="472" height="36" rx="8" fill="#222529" stroke="#565a5e"/>
