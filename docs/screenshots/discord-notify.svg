<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" font-family="'Hiragino Sans', sans-serif">
  <title>完全合成の Discord 通知表示例</title>
  <desc>実患者・実投稿を参照せずに新規作成した、通知と本人向け本文表示の図。</desc>
  <rect width="680" height="690" fill="#313338"/>
  <rect width="680" height="44" fill="#1e1f22"/>
  <text x="20" y="28" font-size="14" fill="#dbdee1"># mcs-synthetic</text>
  <text x="215" y="28" font-size="11" fill="#b5bac1">完全合成の通知表示例</text>
  <circle cx="36" cy="78" r="20" fill="#5865f2"/>
  <text x="36" y="84" font-size="15" fill="#fff" text-anchor="middle">M</text>
  <text x="66" y="69" font-size="14" fill="#fff">検証用ボット</text>
  <text x="210" y="69" font-size="11" fill="#b5bac1">表示例 10:00</text>
  <rect x="66" y="92" width="560" height="376" rx="8" fill="#2b2d31" stroke="#1e1f22"/>
  <text x="78" y="118" font-size="15" fill="#fff">合成ケース A — 通知レイアウト検証</text>
  <text x="78" y="144" font-size="12" fill="#dbdee1">09:40 検証担当 A</text>
  <text x="78" y="164" font-size="12" fill="#dbdee1">構造化</text>
  <text x="78" y="182" font-size="12" fill="#b5bac1">・要約: 模擬訪問予定の確認</text>
  <text x="78" y="200" font-size="12" fill="#b5bac1">・区分: 予定確認（合成）</text>
  <text x="78" y="228" font-size="12" fill="#dbdee1">09:50 検証担当 B</text>
  <text x="78" y="248" font-size="12" fill="#dbdee1">構造化</text>
  <text x="78" y="266" font-size="12" fill="#b5bac1">・要約: 模擬チェック項目の共有</text>
  <text x="78" y="284" font-size="12" fill="#b5bac1">・要点: 連絡先欄を確認 / 模擬予定は金曜 / 検証コメントを記録</text>
  <text x="78" y="302" font-size="12" fill="#b5bac1">・区分: 確認依頼（合成）</text>
  <text x="78" y="320" font-size="12" fill="#b5bac1">・バイタル: この表示例には測定値を含めません</text>
  <text x="78" y="338" font-size="12" fill="#b5bac1">・症状: この表示例には臨床情報を含めません</text>
  <text x="78" y="356" font-size="12" fill="#b5bac1">・依頼: 模擬チェック項目の表示を確認してください</text>
  <rect x="78" y="378" width="64" height="28" rx="5" fill="#248046"/>
  <text x="110" y="396" font-size="12" fill="#fff" text-anchor="middle">確認</text>
  <rect x="150" y="378" width="64" height="28" rx="5" fill="#5865f2"/>
  <text x="182" y="396" font-size="12" fill="#fff" text-anchor="middle">担当</text>
  <rect x="222" y="378" width="64" height="28" rx="5" fill="#4e5058"/>
  <text x="254" y="396" font-size="12" fill="#dbdee1" text-anchor="middle">保留</text>
  <rect x="294" y="378" width="96" height="28" rx="5" fill="#4e5058"/>
  <text x="342" y="396" font-size="12" fill="#dbdee1" text-anchor="middle">本文表示</text>
  <rect x="78" y="414" width="96" height="28" rx="5" fill="#4e5058"/>
  <text x="126" y="432" font-size="12" fill="#dbdee1" text-anchor="middle">依頼作成</text>
  <rect x="66" y="486" width="560" height="154" rx="8" fill="#26272b" stroke="#6d6f78" stroke-dasharray="6 4"/>
  <text x="78" y="506" font-size="11" fill="#b5bac1">本文表示 → ephemeral（押した本人のみに表示）</text>
  <text x="78" y="528" font-size="13" fill="#fff">合成ケース A — 模擬本文</text>
  <text x="78" y="548" font-size="12" fill="#dbdee1">09:40 検証担当 A: 模擬訪問予定を金曜として表示します。</text>
  <text x="78" y="566" font-size="12" fill="#dbdee1">この記録は通知レイアウトを確認するために作成しました。</text>
  <text x="78" y="584" font-size="12" fill="#dbdee1">09:50 検証担当 B: 連絡先欄とチェック項目の表示を確認します。</text>
  <text x="78" y="602" font-size="12" fill="#dbdee1">実在する患者・職員・診療・投稿を表すものではありません。</text>
  <text x="78" y="620" font-size="12" fill="#dbdee1">確認結果はこの合成例の範囲だけで扱ってください。</text>
  <text x="66" y="668" font-size="10" fill="#b5bac1">完全合成の表示例。実患者・実投稿の匿名化データは使用していません。</text>
</svg>
