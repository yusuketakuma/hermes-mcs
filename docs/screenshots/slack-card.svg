<svg xmlns="http://www.w3.org/2000/svg" width="880" height="690" viewBox="0 0 880 690" font-family="'Hiragino Sans', sans-serif">
  <title>架空データを使った Slack 通知カード表示例</title>
  <desc>実患者・実投稿を参照せずに新規作成した、Slack 通知カード（概要・投稿ごとの要約・状態・操作）の図。</desc>
  <rect width="880" height="690" fill="#1a1d21"/>
  <rect x="0" y="0" width="880" height="44" rx="0" fill="#19171d"/>
  <line x1="0" y1="44" x2="880" y2="44" stroke="#3a3d42" stroke-width="1"/>
  <text x="20" y="28" font-size="14" fill="#d1d2d3" font-weight="bold">#  mcs-demo</text>
  <text x="856" y="28" font-size="11" fill="#ababad" text-anchor="end">架空の表示例</text>
  <rect x="16" y="60" width="36" height="36" rx="8" fill="#611f69"/>
  <text x="34" y="84" font-size="15" fill="#fff" text-anchor="middle">M</text>
  <text x="62" y="76" font-size="13" fill="#d1d2d3" font-weight="bold">MCSボット</text>
  <rect x="140" y="63" width="38" height="15" rx="3" fill="none" stroke="#565a5e"/>
  <text x="159" y="74" font-size="9" fill="#ababad" text-anchor="middle">APP</text>
  <text x="192" y="76" font-size="10" fill="#ababad">10:02</text>
  <text x="62" y="112" font-size="14" fill="#d1d2d3" font-weight="bold">💬 山田 花子 様（あおぞら）· 起点 10-01 ［緊急度高・AI判定］</text>
  <text x="62" y="133" font-size="11" fill="#ababad">2投稿 · 📎 1 · @自分宛て</text>
  <text x="62" y="150" font-size="11" fill="#ababad">🆕 返信+1</text>
  <line x1="62" y1="162" x2="750" y2="162" stroke="#3a3d42" stroke-width="1"/>
  <text x="62" y="183" font-size="12" fill="#d1d2d3" font-weight="bold">10-01 09:40 佐藤さん（訪問看護・あおぞら）</text>
  <text x="62" y="202" font-size="11" fill="#7fc8a9" font-weight="bold">📋 要約</text>
  <text x="62" y="220" font-size="11" fill="#d1d2d3">・次回訪問時に残薬を確認してほしいとの連絡</text>
  <text x="62" y="238" font-size="11" fill="#d1d2d3">・要点: 残薬の確認 / 服薬カレンダーを共有</text>
  <text x="62" y="256" font-size="11" fill="#d1d2d3">・区分: 依頼・添付</text>
  <text x="62" y="274" font-size="11" fill="#d1d2d3">・依頼: 確認依頼:次回訪問時に残薬を確認(期限:次回訪問時)</text>
  <line x1="62" y1="286" x2="750" y2="286" stroke="#3a3d42" stroke-width="1"/>
  <text x="62" y="307" font-size="12" fill="#d1d2d3" font-weight="bold">10-01 10:05 鈴木さん（ケアマネ・ひなた）</text>
  <text x="62" y="326" font-size="11" fill="#7fc8a9" font-weight="bold">📋 要約</text>
  <text x="62" y="344" font-size="11" fill="#d1d2d3">・確認結果を担当者会議で共有してほしいとの連絡</text>
  <text x="62" y="362" font-size="11" fill="#d1d2d3">・区分: 連絡</text>
  <line x1="62" y1="374" x2="750" y2="374" stroke="#3a3d42" stroke-width="1"/>
  <text x="62" y="395" font-size="11" fill="#ababad">👤 担当: 田中 · ✅ 確認: 田中</text>
  <text x="62" y="413" font-size="11" fill="#ababad">📝 タスク 1件 · スタンプ 👀5 🙆2 · 自分 2投稿</text>
  <line x1="62" y1="425" x2="750" y2="425" stroke="#3a3d42" stroke-width="1"/>
  <rect x="62" y="437" width="84" height="30" rx="6" fill="#007a5a"/>
  <text x="104.0" y="456.0" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">確認する</text>
  <rect x="154" y="437" width="84" height="30" rx="6" fill="#222529" stroke="#565a5e"/>
  <text x="196.0" y="456.0" font-size="12" fill="#d1d2d3" text-anchor="middle">担当する</text>
  <rect x="246" y="437" width="96" height="30" rx="6" fill="#222529" stroke="#565a5e"/>
  <text x="294.0" y="456.0" font-size="12" fill="#d1d2d3" text-anchor="middle">タスク作成</text>
  <rect x="350" y="437" width="150" height="30" rx="6" fill="#222529" stroke="#565a5e"/>
  <text x="364" y="456.0" font-size="12" fill="#ababad">操作を選ぶ…</text>
  <text x="484" y="456.0" font-size="11" fill="#ababad" text-anchor="middle">▾</text>
  <text x="62" y="493" font-size="12" fill="#1d9bd1">MCSで開く</text>
  <circle cx="800" cy="108" r="9" fill="#1d9bd1"/>
  <text x="800" y="112" font-size="10" fill="#fff" text-anchor="middle">1</text>
  <circle cx="800" cy="179" r="9" fill="#1d9bd1"/>
  <text x="800" y="183" font-size="10" fill="#fff" text-anchor="middle">2</text>
  <circle cx="800" cy="391" r="9" fill="#1d9bd1"/>
  <text x="800" y="395" font-size="10" fill="#fff" text-anchor="middle">3</text>
  <circle cx="800" cy="452" r="9" fill="#1d9bd1"/>
  <text x="800" y="456" font-size="10" fill="#fff" text-anchor="middle">4</text>
  <rect x="62" y="513" width="700" height="42" rx="6" fill="#1a1d21" stroke="#35373c"/>
  <circle cx="80" cy="534" r="10" fill="#248046"/>
  <text x="80" y="538" font-size="8" fill="#fff" text-anchor="middle">佐</text>
  <circle cx="98" cy="534" r="10" fill="#6e40c9"/>
  <text x="98" y="538" font-size="8" fill="#fff" text-anchor="middle">鈴</text>
  <text x="116" y="530" font-size="10" fill="#1d9bd1">3件の返信</text>
  <text x="116" y="545" font-size="9" fill="#6e7681">最新 10:05 — クリックでスレッドを表示</text>
  <line x1="0" y1="573" x2="880" y2="573" stroke="#3a3d42" stroke-width="1"/>
  <circle cx="24" cy="599" r="8" fill="#1d9bd1"/>
  <text x="24" y="603" font-size="9" fill="#fff" text-anchor="middle">1</text>
  <text x="40" y="603" font-size="11" fill="#ababad">概要 — 患者名・施設・起点日・緊急度、投稿数・添付・自分宛て・新しい返信</text>
  <circle cx="24" cy="619" r="8" fill="#1d9bd1"/>
  <text x="24" y="623" font-size="9" fill="#fff" text-anchor="middle">2</text>
  <text x="40" y="623" font-size="11" fill="#ababad">投稿ごとの要約 — 送信者行と 📋 要約（区切り線で投稿ごとに分かれる）</text>
  <circle cx="24" cy="639" r="8" fill="#1d9bd1"/>
  <text x="24" y="643" font-size="9" fill="#fff" text-anchor="middle">3</text>
  <text x="40" y="643" font-size="11" fill="#ababad">状態 — 担当・確認・タスク件数・スタンプ</text>
  <circle cx="24" cy="659" r="8" fill="#1d9bd1"/>
  <text x="24" y="663" font-size="9" fill="#fff" text-anchor="middle">4</text>
  <text x="40" y="663" font-size="11" fill="#ababad">操作 — 確認する・担当する・タスク作成と「操作を選ぶ…」、MCSで開く</text>
</svg>
