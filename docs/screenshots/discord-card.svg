<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" font-family="'Hiragino Sans', sans-serif">
  <title>架空データを使った Discord 通知カード表示例</title>
  <desc>実患者・実投稿を参照せずに新規作成した、Discord 通知カード（区切り線で分かれた概要・要約・状態・操作）の図。</desc>
  <rect width="880" height="720" fill="#313338"/>
  <rect x="0" y="0" width="880" height="44" rx="0" fill="#1e1f22"/>
  <text x="20" y="28" font-size="14" fill="#dbdee1"># mcs-demo</text>
  <text x="856" y="28" font-size="11" fill="#b5bac1" text-anchor="end">架空の表示例</text>
  <circle cx="46" cy="76" r="20" fill="#5865f2"/>
  <text x="46" y="82" font-size="15" fill="#fff" text-anchor="middle">M</text>
  <text x="76" y="67" font-size="14" fill="#fff" font-weight="bold">MCSボット</text>
  <rect x="170" y="55" width="38" height="16" rx="3" fill="#3f4248"/>
  <text x="189" y="67" font-size="9" fill="#dbdee1" text-anchor="middle">APP</text>
  <text x="222" y="67" font-size="11" fill="#b5bac1">今日 10:02</text>
  <rect x="76" y="90" width="690" height="439" rx="8" fill="#2b2d31" stroke="#1e1f22"/>
  <text x="92" y="118" font-size="14" fill="#ffffff" font-weight="bold">💬 山田 花子 様（あおぞら）· 起点 10-01 ［緊急度高・AI判定］</text>
  <text x="92" y="139" font-size="11" fill="#b5bac1">2投稿 · 📎 1 · @自分宛て</text>
  <text x="92" y="156" font-size="11" fill="#b5bac1">🆕 返信+1</text>
  <line x1="92" y1="168" x2="750" y2="168" stroke="#4e5058" stroke-width="1"/>
  <text x="92" y="189" font-size="12" fill="#dbdee1" font-weight="bold">10-01 09:40 佐藤さん（訪問看護・あおぞら）</text>
  <text x="92" y="208" font-size="11" fill="#7fc8a9" font-weight="bold">📋 要約</text>
  <text x="92" y="226" font-size="11" fill="#dbdee1">・次回訪問時に残薬を確認してほしいとの連絡</text>
  <text x="92" y="244" font-size="11" fill="#dbdee1">・要点: 残薬の確認 / 服薬カレンダーを共有</text>
  <text x="92" y="262" font-size="11" fill="#dbdee1">・区分: 依頼・添付</text>
  <text x="92" y="280" font-size="11" fill="#dbdee1">・依頼: 確認依頼:次回訪問時に残薬を確認(期限:次回訪問時)</text>
  <line x1="92" y1="292" x2="750" y2="292" stroke="#4e5058" stroke-width="1"/>
  <text x="92" y="313" font-size="12" fill="#dbdee1" font-weight="bold">10-01 10:05 鈴木さん（ケアマネ・ひなた）</text>
  <text x="92" y="332" font-size="11" fill="#7fc8a9" font-weight="bold">📋 要約</text>
  <text x="92" y="350" font-size="11" fill="#dbdee1">・確認結果を担当者会議で共有してほしいとの連絡</text>
  <text x="92" y="368" font-size="11" fill="#dbdee1">・区分: 連絡</text>
  <line x1="92" y1="380" x2="750" y2="380" stroke="#4e5058" stroke-width="1"/>
  <text x="92" y="401" font-size="11" fill="#b5bac1">👤 担当: 田中 · ✅ 確認: 田中</text>
  <text x="92" y="419" font-size="11" fill="#b5bac1">📝 タスク 1件 · スタンプ 👀5 🙆2 · 自分 2投稿</text>
  <line x1="92" y1="431" x2="750" y2="431" stroke="#4e5058" stroke-width="1"/>
  <rect x="92" y="443" width="84" height="30" rx="5" fill="#248046"/>
  <text x="134.0" y="462.0" font-size="12" fill="#fff" text-anchor="middle">確認する</text>
  <rect x="184" y="443" width="84" height="30" rx="5" fill="#4e5058"/>
  <text x="226.0" y="462.0" font-size="12" fill="#fff" text-anchor="middle">担当する</text>
  <rect x="276" y="443" width="96" height="30" rx="5" fill="#4e5058"/>
  <text x="324.0" y="462.0" font-size="12" fill="#fff" text-anchor="middle">タスク作成</text>
  <rect x="380" y="443" width="104" height="30" rx="5" fill="#4e5058"/>
  <text x="432.0" y="462.0" font-size="12" fill="#fff" text-anchor="middle">MCSで開く ↗</text>
  <rect x="92" y="481" width="360" height="32" rx="5" fill="#1e1f22" stroke="#4e5058"/>
  <text x="106" y="502" font-size="12" fill="#b5bac1">他の操作…</text>
  <text x="436" y="502" font-size="11" fill="#b5bac1" text-anchor="middle">▾</text>
  <circle cx="745" cy="114" r="9" fill="#5865f2"/>
  <text x="745" y="118" font-size="10" fill="#fff" text-anchor="middle">1</text>
  <circle cx="745" cy="185" r="9" fill="#5865f2"/>
  <text x="745" y="189" font-size="10" fill="#fff" text-anchor="middle">2</text>
  <circle cx="745" cy="397" r="9" fill="#5865f2"/>
  <text x="745" y="401" font-size="10" fill="#fff" text-anchor="middle">3</text>
  <circle cx="745" cy="458" r="9" fill="#5865f2"/>
  <text x="745" y="462" font-size="10" fill="#fff" text-anchor="middle">4</text>
  <line x1="0" y1="549" x2="880" y2="549" stroke="#1e1f22" stroke-width="1"/>
  <circle cx="24" cy="571" r="8" fill="#5865f2"/>
  <text x="24" y="575" font-size="9" fill="#fff" text-anchor="middle">1</text>
  <text x="40" y="575" font-size="11" fill="#b5bac1">概要 — 患者名・施設・起点日・緊急度、投稿数・添付・自分宛て・新しい返信</text>
  <circle cx="24" cy="591" r="8" fill="#5865f2"/>
  <text x="24" y="595" font-size="9" fill="#fff" text-anchor="middle">2</text>
  <text x="40" y="595" font-size="11" fill="#b5bac1">投稿ごとの要約 — 送信者行と 📋 要約（Separator で投稿ごとに分かれる）</text>
  <circle cx="24" cy="611" r="8" fill="#5865f2"/>
  <text x="24" y="615" font-size="9" fill="#fff" text-anchor="middle">3</text>
  <text x="40" y="615" font-size="11" fill="#b5bac1">状態 — 担当・確認・タスク件数・スタンプ</text>
  <circle cx="24" cy="631" r="8" fill="#5865f2"/>
  <text x="24" y="635" font-size="9" fill="#fff" text-anchor="middle">4</text>
  <text x="40" y="635" font-size="11" fill="#b5bac1">操作 — 確認する・担当する・タスク作成・MCSで開く と「他の操作…」</text>
  <text x="20" y="657" font-size="9" fill="#8b949e">名前・投稿・数値は架空です。実データ・実投稿の匿名化例は使用していません。</text>
</svg>
