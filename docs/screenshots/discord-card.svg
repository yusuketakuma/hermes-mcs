<svg xmlns="http://www.w3.org/2000/svg" width="880" height="664" viewBox="0 0 880 664" font-family="'Hiragino Sans', sans-serif">
  <title>完全合成の Discord 通知カード表示例</title>
  <desc>実患者・実投稿を参照せずに新規作成した、通知カードと操作後状態の図。</desc>
  <rect width="880" height="664" fill="#313338"/>

  <!-- channel header -->
  <rect width="880" height="44" fill="#1e1f22"/>
  <text x="20" y="28" font-size="14" fill="#dbdee1"># mcs-synthetic</text>
  <text x="856" y="28" font-size="11" fill="#b5bac1" text-anchor="end">完全合成の通知表示例</text>

  <!-- bot 1 -->
  <circle cx="46" cy="76" r="20" fill="#5865f2"/>
  <text x="46" y="82" font-size="15" fill="#fff" text-anchor="middle">M</text>
  <text x="76" y="67" font-size="14" fill="#fff" font-weight="bold">MCSボット</text>
  <rect x="150" y="55" width="38" height="16" rx="3" fill="#3f4248"/>
  <text x="169" y="67" font-size="9" fill="#dbdee1" text-anchor="middle">APP</text>
  <text x="204" y="67" font-size="11" fill="#b5bac1">今日 10:02</text>

  <!-- card 1 -->
  <rect x="76" y="90" width="690" height="370" rx="8" fill="#2b2d31" stroke="#1e1f22"/>
  <text x="92" y="118" font-size="15" fill="#fff" font-weight="bold">山田 太郎（合成例）— 09-28 の記録</text>
  <text x="92" y="146" font-size="12" fill="#dbdee1">09:40 訪問看護 佐藤（訪問看護ステーション・合成）</text>
  <circle cx="745" cy="141" r="9" fill="#5865f2"/>
  <text x="745" y="145" font-size="10" fill="#fff" text-anchor="middle">1</text>
  <text x="92" y="168" font-size="11" fill="#a6a9ad">📋 構造化</text>
  <text x="102" y="188" font-size="12" fill="#b5bac1">・要約: 夕方バイタル測定の報告</text>
  <text x="102" y="206" font-size="12" fill="#b5bac1">・区分: バイタル報告</text>
  <line x1="92" y1="220" x2="750" y2="220" stroke="#3a3c42" stroke-width="1"/>
  <text x="92" y="240" font-size="12" fill="#dbdee1">09:50 ケアマネ 鈴木（居宅介護支援事業所・合成）</text>
  <text x="92" y="262" font-size="11" fill="#a6a9ad">📋 構造化</text>
  <circle cx="745" cy="258" r="9" fill="#5865f2"/>
  <text x="745" y="262" font-size="10" fill="#fff" text-anchor="middle">2</text>
  <text x="102" y="282" font-size="12" fill="#b5bac1">・要約: かかりつけ医より服薬変更の連絡を共有</text>
  <text x="102" y="300" font-size="12" fill="#b5bac1">・要点: フェロキシピン中止 → カルベジロール 2.5mg 開始</text>
  <text x="102" y="318" font-size="12" fill="#b5bac1">・区分: 服薬変更</text>
  <text x="102" y="336" font-size="12" fill="#b5bac1">・バイタル: BP 142/88・脈 76・SpO2 96%（合成値）</text>
  <text x="102" y="354" font-size="12" fill="#b5bac1">・症状: 起立時のめまい（転倒・外傷なし）</text>
  <text x="102" y="372" font-size="12" fill="#b5bac1">・依頼: 次回訪問時に残薬を確認してください</text>

  <!-- buttons row 1 -->
  <rect x="92" y="386" width="92" height="30" rx="5" fill="#248046"/>
  <text x="138" y="406" font-size="12" fill="#fff" text-anchor="middle">✅ 確認</text>
  <rect x="192" y="386" width="92" height="30" rx="5" fill="#5865f2"/>
  <text x="238" y="406" font-size="12" fill="#fff" text-anchor="middle">👤 担当</text>
  <rect x="292" y="386" width="92" height="30" rx="5" fill="#4e5058"/>
  <text x="338" y="406" font-size="12" fill="#dbdee1" text-anchor="middle">⏸ 保留</text>
  <circle cx="745" cy="401" r="9" fill="#5865f2"/>
  <text x="745" y="405" font-size="10" fill="#fff" text-anchor="middle">3</text>

  <!-- buttons row 2 -->
  <rect x="92" y="422" width="120" height="30" rx="5" fill="#4e5058"/>
  <text x="152" y="442" font-size="12" fill="#dbdee1" text-anchor="middle">📝 依頼作成</text>
  <rect x="220" y="422" width="120" height="30" rx="5" fill="#4e5058"/>
  <text x="280" y="442" font-size="12" fill="#dbdee1" text-anchor="middle">📄 本文表示</text>
  <text x="356" y="441" font-size="10" fill="#6e7681">💬 本文・添付 2件 → コンパニオンスレッドへ配送済み</text>
  <circle cx="745" cy="436" r="9" fill="#5865f2"/>
  <text x="745" y="440" font-size="10" fill="#fff" text-anchor="middle">4</text>

  <!-- bot 2: confirmed state -->
  <circle cx="46" cy="492" r="16" fill="#5865f2"/>
  <text x="46" y="498" font-size="12" fill="#fff" text-anchor="middle">M</text>
  <text x="70" y="485" font-size="13" fill="#fff" font-weight="bold">MCSボット</text>
  <rect x="134" y="474" width="34" height="14" rx="3" fill="#3f4248"/>
  <text x="151" y="484" font-size="8" fill="#dbdee1" text-anchor="middle">APP</text>
  <text x="182" y="485" font-size="10" fill="#b5bac1">今日 10:05</text>
  <rect x="76" y="498" width="690" height="76" rx="8" fill="#2b2d31" stroke="#1e1f22"/>
  <text x="92" y="522" font-size="13" fill="#fff" font-weight="bold">山田 太郎（合成例）— 09-27 の記録</text>
  <text x="92" y="546" font-size="12" fill="#a3d2a5">✅ 確認済み 10:05 · 担当: 訪問看護 田中（合成）</text>
  <text x="92" y="566" font-size="10" fill="#8b949e">ボタン操作の結果がカードへ反映されます（receipt として台帳に記録）</text>

  <!-- legend -->
  <line x1="0" y1="592" x2="880" y2="592" stroke="#1e1f22" stroke-width="1"/>
  <circle cx="24" cy="610" r="8" fill="#5865f2"/>
  <text x="24" y="614" font-size="9" fill="#fff" text-anchor="middle">1</text>
  <text x="40" y="614" font-size="11" fill="#b5bac1">送信者行 — 記入時刻・職種・氏名・組織</text>
  <circle cx="24" cy="632" r="8" fill="#5865f2"/>
  <text x="24" y="636" font-size="9" fill="#fff" text-anchor="middle">2</text>
  <text x="40" y="636" font-size="11" fill="#b5bac1">📋構造化 — ローカルLLMの抽出結果（要約・区分・バイタル・症状・依頼。候補扱い）</text>
  <circle cx="500" cy="610" r="8" fill="#5865f2"/>
  <text x="500" y="614" font-size="9" fill="#fff" text-anchor="middle">3</text>
  <text x="516" y="614" font-size="11" fill="#b5bac1">操作ボタン — 確認・担当・保留・依頼作成・本文表示</text>
  <circle cx="500" cy="632" r="8" fill="#5865f2"/>
  <text x="500" y="636" font-size="9" fill="#fff" text-anchor="middle">4</text>
  <text x="516" y="636" font-size="11" fill="#b5bac1">配送状態 — 本文・添付はコンパニオンスレッドへ</text>
  <text x="20" y="658" font-size="9" fill="#8b949e">完全合成の表示例。実患者・実投稿の匿名化データも使用していません。</text>
</svg>
