<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Menlo, monospace" role="img" aria-labelledby="signals-title signals-desc">
  <title id="signals-title">架空のシグナルCLI出力の抜粋</title>
  <desc id="signals-desc">現行のcandidates内のitems、件数、最終処理時刻を使った完全に架空の出力抜粋。実データや実端末の画面ではない。</desc>
  <rect width="720" height="340" rx="8" fill="#1e1e1e"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="24" y="56" font-size="12" fill="#6a9955">$ mcs/views/mcs_view.py signals --project 123 # 架空・抜粋</text>
  <text x="24" y="80" font-size="12" fill="#d4d4d4">{</text>
  <text x="24" y="100" font-size="12" fill="#d4d4d4">  &quot;candidates&quot;: {</text>
  <text x="24" y="120" font-size="12" fill="#d4d4d4">    &quot;total&quot;: 1, &quot;returned&quot;: 1, &quot;truncated&quot;: false,</text>
  <text x="24" y="140" font-size="12" fill="#d4d4d4">    &quot;items&quot;: [</text>
  <text x="24" y="160" font-size="12" fill="#ce9178">      {&quot;type&quot;: &quot;med_change_no_followup&quot;,</text>
  <text x="24" y="180" font-size="12" fill="#ce9178">       &quot;project_id&quot;: 123,</text>
  <text x="24" y="200" font-size="12" fill="#ce9178">       &quot;evidence&quot;: {&quot;med&quot;: &quot;架空薬錠&quot;}}</text>
  <text x="24" y="220" font-size="12" fill="#d4d4d4">    ],</text>
  <text x="24" y="240" font-size="12" fill="#d4d4d4">    &quot;pipeline_last_run_at&quot;: 1790900102,</text>
  <text x="24" y="260" font-size="12" fill="#d4d4d4">    &quot;policy&quot;: null</text>
  <text x="24" y="280" font-size="12" fill="#d4d4d4">  }</text>
  <text x="24" y="300" font-size="12" fill="#d4d4d4">}</text>
</svg>
