<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1250" viewBox="0 0 1100 1250" font-family="Noto Sans CJK JP,Hiragino Sans,Yu Gothic,Droid Sans Fallback,sans-serif">
<title>スタンプの確認も送信も、同じエリアで。 — 架空のSlack表示例</title>
<desc>架空の名前・投稿・数値を使った説明図。実データ・実投稿の匿名化例は使用していません。実画面のキャプチャではありません。</desc>
<rect x="0" y="0" width="1100" height="1250" rx="0" fill="#f6f4ef"/>
<text x="28" y="34" font-size="14" fill="#087f5b" font-weight="bold">HERMES-MCS  /  SLACK  /  03</text>
<text x="28" y="76" font-size="32" fill="#202124" font-weight="bold">スタンプの確認も送信も、同じエリアで。</text>
<text x="28" y="107" font-size="18" fill="#66716f">① メニューを開く → ② スタンプを選ぶ。✓（取消）を選ぶと自分の分を取り消します。</text>
<rect x="24" y="134" width="1052" height="1035" rx="12" fill="#fff" stroke="#dce2dd"/>
<rect x="24" y="134" width="142" height="1035" rx="12" fill="#351638"/>
<rect x="148" y="134" width="18" height="1035" rx="0" fill="#351638"/>
<text x="44" y="176" font-size="22" fill="#fff" font-weight="bold">MCSデモ</text>
<text x="44" y="218" font-size="14" fill="#cbbfcf">チャンネル</text>
<rect x="34" y="232" width="122" height="36" rx="6" fill="#64406a"/>
<text x="44" y="256" font-size="15" fill="#fff"># mcs-demo</text>
<text x="44" y="300" font-size="14" fill="#cbbfcf">説明用データ</text>
<path d="M166 194 L1076 194" stroke="#e1e5e2" fill="none"/>
<text x="192" y="172" font-size="22" fill="#202124" font-weight="bold"># mcs-demo</text>
<text x="1050" y="172" font-size="15" fill="#66716f" text-anchor="end">架空の表示例</text>
<text x="28" y="1205" font-size="16" fill="#66716f">説明用の画面イメージ。実際の配置はSlackのバージョン・設定で異なります。</text>
<text x="28" y="1230" font-size="15" fill="#087f5b">実データ不使用 / 画像内の操作はできません</text>
<rect x="192" y="228" width="36" height="36" rx="8" fill="#087f5b"/>
<text x="201" y="254" font-size="22" fill="#fff" font-weight="bold">M</text>
<text x="240" y="244" font-size="19" fill="#202124" font-weight="bold">MCS</text>
<rect x="292" y="228" width="38" height="20" rx="4" fill="#edf0ee"/>
<text x="298" y="243" font-size="11" fill="#66716f">APP</text>
<text x="343" y="244" font-size="14" fill="#66716f">10:02</text>
<text x="240" y="283" font-size="21" fill="#202124" font-weight="bold">💬 山田 花子（あおぞら）</text>
<text x="240" y="312.6" font-size="17" fill="#66716f">10-01〜 · 1投稿 · 📎 1 · @自分宛て</text>
<path d="M240 327.8 L1010 327.8" stroke="#d5dcd7" fill="none"/>
<text x="240" y="355.8" font-size="15" fill="#66716f">10-01 09:40 佐藤さん（訪問看護・あおぞら）</text>
<text x="240" y="377.8" font-size="18" fill="#202124">・次回訪問時に残薬を確認してほしいとの連絡</text>
<text x="240" y="404.6" font-size="18" fill="#202124">・要点: 残薬の確認 / 服薬カレンダーを共有</text>
<text x="240" y="431.40000000000003" font-size="18" fill="#202124">・依頼: 確認依頼:次回訪問時に残薬を確認(期限:次回訪問時)</text>
<text x="240" y="458.20000000000005" font-size="18" fill="#202124">・区分: 依頼・添付</text>
<rect x="232" y="469.00000000000006" width="786" height="38" rx="8" fill="#f3f6f4" stroke="#dce2dd"/>
<text x="240" y="491.00000000000006" font-size="16" fill="#66716f">▸ 原文（35字）</text>
<path d="M240 512.6 L1010 512.6" stroke="#d5dcd7" fill="none"/>
<text x="240" y="538.6" font-size="17" fill="#66716f">📝 タスク 1件</text>
<text x="240" y="563.8000000000001" font-size="15" fill="#087f5b">スタンプ 👀2 田中・佐藤 / 🙆1 鈴木 · 10-01 10:00時点</text>
<rect x="240" y="587.8000000000001" width="250" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="254" y="614.8000000000001" font-size="18" fill="#202124">スタンプを押す… ▾</text>
<path d="M240 645.8000000000001 L1010 645.8000000000001" stroke="#d5dcd7" fill="none"/>
<rect x="240" y="673.8000000000001" width="173" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="254" y="700.8000000000001" font-size="18" fill="#202124">操作を選ぶ… ▾</text>
<text x="240" y="749.8000000000001" font-size="18" fill="#1264a3">MCSで開く</text>
<text x="645" y="593.8000000000001" font-size="15" fill="#66716f">開いたスタンプメニュー（説明図）</text>
<rect x="645" y="608.8000000000001" width="330" height="270" rx="8" fill="#fff" stroke="#aebbb2"/>
<text x="663" y="644.8000000000001" font-size="19" fill="#202124">👀 見ました</text>
<text x="663" y="686.8000000000001" font-size="19" fill="#087f5b">🙆 承知 ✓（取消）</text>
<text x="663" y="728.8000000000001" font-size="19" fill="#202124">🙏 感謝</text>
<text x="663" y="770.8000000000001" font-size="19" fill="#202124">👍 いいね</text>
<text x="663" y="812.8000000000001" font-size="19" fill="#202124">✅ 完了</text>
<text x="663" y="854.8000000000001" font-size="19" fill="#202124">🗂 別の投稿</text>
<text x="240" y="1130" font-size="17" fill="#66716f">「別の投稿」は既存の対象選択・確認画面へ進みます。スタンプは5種類。</text>
</svg>
