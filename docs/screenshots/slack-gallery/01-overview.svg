<text x="28" y="1235" font-size="16" fill="#66716f">説明用の画面イメージ。実際の配置はSlackのバージョン・設定で異なります。</text>
<text x="28" y="1260" font-size="15" fill="#087f5b">実データ不使用 / 画像内の操作はできません</text>
