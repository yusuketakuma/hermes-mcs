<text x="44" y="218" font-size="14" fill="#cbbfcf">チャンネル</text>
<rect x="34" y="232" width="122" height="36" rx="6" fill="#64406a"/>
<text x="44" y="256" font-size="15" fill="#fff"># mcs-demo</text>
<text x="44" y="300" font-size="14" fill="#cbbfcf">説明用データ</text>
<path d="M166 194 L1076 194" stroke="#e1e5e2" fill="none"/>
<text x="192" y="172" font-size="22" fill="#202124" font-weight="bold"># mcs-demo</text>
<text x="1050" y="172" font-size="15" fill="#66716f" text-anchor="end">架空の表示例</text>
<text x="28" y="1025" font-size="16" fill="#66716f">説明用の画面イメージ。実際の配置はSlackのバージョン・設定で異なります。</text>
<text x="28" y="1050" font-size="15" fill="#087f5b">実データ不使用 / 画像内の操作はできません</text>
<rect x="192" y="228" width="36" height="36" rx="8" fill="#087f5b"/>
<text x="201" y="254" font-size="22" fill="#fff" font-weight="bold">M</text>
<text x="240" y="244" font-size="19" fill="#202124" font-weight="bold">MCS</text>
<rect x="292" y="228" width="38" height="20" rx="4" fill="#edf0ee"/>
<text x="298" y="243" font-size="11" fill="#66716f">APP</text>
<text x="343" y="244" font-size="14" fill="#66716f">10:02</text>
<text x="240" y="283" font-size="23" fill="#202124" font-weight="bold">山田さん — 10-01</text>
<text x="240" y="318" font-size="17" fill="#66716f">10-01 09:40 訪問看護 佐藤さん</text>
<text x="240" y="350" font-size="17" fill="#087f5b" font-weight="bold">構造化（抽出候補）</text>
<text x="240" y="380" font-size="19" fill="#202124">要約: 次回訪問時に残薬を確認してほしいとの連絡</text>
<text x="240" y="415.4" font-size="19" fill="#202124">区分: 依頼</text>
<text x="240" y="448.4" font-size="19" fill="#202124">依頼: 残薬確認 / 期限表現: 次回訪問時</text>
<path d="M240 498.79999999999995 L1028 498.79999999999995" stroke="#e3e7e4" fill="none"/>
<text x="240" y="535.8" font-size="18" fill="#66716f">確認: 田中さん / 担当: 田中さん</text>
<text x="240" y="567.8" font-size="18" fill="#087f5b">スタンプ 👀5 🙆2 · 自分 2投稿</text>
<rect x="240" y="595.8" width="116" height="40" rx="6" fill="#087f5b"/>
<text x="254" y="622.8" font-size="18" fill="#fff" font-weight="bold">確認済み</text>
<rect x="366" y="595.8" width="116" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="380" y="622.8" font-size="18" fill="#202124">担当中</text>
<rect x="492" y="595.8" width="173" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="506" y="622.8" font-size="18" fill="#202124">操作を選ぶ… ▾</text>
<text x="240" y="661.8" font-size="19" fill="#1264a3">MCSで開く</text>
<text x="240" y="694.8" font-size="17" fill="#66716f">本文・添付はスレッドに投稿済み</text>
<text x="240" y="726.8" font-size="16" fill="#66716f">スタンプの観測は、担当引受・タスク完了の記録ではありません。</text>
<text x="240" y="764.8" font-size="16" fill="#087f5b" font-weight="bold">スレッドの投稿ごとの表示（押下者取得を有効にした場合）</text>
<rect x="240" y="780.8" width="788" height="178" rx="8" fill="#f3f6f4" stroke="#dce2dd"/>
<text x="258" y="811.8" font-size="17" fill="#66716f">10-01 09:40 佐藤さん（訪問看護）</text>
<text x="258" y="843.8" font-size="18" fill="#087f5b">スタンプ 👀2 🙆1 · 観測 10-01 10:00</text>
<text x="258" y="875.8" font-size="17" fill="#202124">押した人: 👀 田中 花子、佐藤 一郎 · 🙆 鈴木 太郎（自分）</text>
<text x="258" y="907.8" font-size="18" fill="#202124">次回訪問時に残薬を確認してください。</text>
<text x="258" y="938.8" font-size="15" fill="#66716f">観測は取得した時点。スタンプを押した時刻ではありません。</text>
</svg>
