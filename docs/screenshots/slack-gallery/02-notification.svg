<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1070" viewBox="0 0 1100 1070" font-family="Noto Sans CJK JP,Hiragino Sans,Yu Gothic,Droid Sans Fallback,sans-serif">
<title>通知カードから、確認と担当を共有。 — 架空のSlack表示例</title>
<desc>架空の名前・投稿・数値を使った説明図。実データ・実投稿の匿名化例は使用していません。実画面のキャプチャではありません。</desc>
<rect x="0" y="0" width="1100" height="1070" rx="0" fill="#f6f4ef"/>
<text x="28" y="34" font-size="14" fill="#087f5b" font-weight="bold">HERMES-MCS  /  SLACK  /  02</text>
<text x="28" y="76" font-size="32" fill="#202124" font-weight="bold">通知カードから、確認と担当を共有。</text>
<text x="28" y="107" font-size="18" fill="#66716f">カードは件数、スレッドは投稿ごとのスタンプと押した人。</text>
<rect x="24" y="134" width="1052" height="855" rx="12" fill="#fff" stroke="#dce2dd"/>
<rect x="24" y="134" width="142" height="855" rx="12" fill="#351638"/>
<rect x="148" y="134" width="18" height="855" rx="0" fill="#351638"/>
