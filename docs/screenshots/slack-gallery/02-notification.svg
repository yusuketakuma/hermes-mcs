<text x="28" y="76" font-size="32" fill="#202124" font-weight="bold">通知カードから、確認と担当を共有。</text>
<text x="28" y="107" font-size="18" fill="#66716f">操作した結果はカードに反映。確認済みとタスク完了は別です。</text>
<rect x="24" y="134" width="1052" height="555" rx="12" fill="#fff" stroke="#dce2dd"/>
