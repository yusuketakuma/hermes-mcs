<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" viewBox="0 0 1100 770" font-family="Noto Sans CJK JP,Hiragino Sans,Yu Gothic,Droid Sans Fallback,sans-serif">
<title>通知カードから、確認と担当を共有。 — 完全合成のSlack表示例</title>
<desc>現行のカード・フォーム・本人向け回答の実装に基づく説明図。実患者・実投稿・匿名化データは使用していません。実画面のキャプチャではありません。</desc>
<rect x="0" y="0" width="1100" height="770" rx="0" fill="#f6f4ef"/>
