<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1600" viewBox="0 0 1100 1600" font-family="Noto Sans CJK JP,Hiragino Sans,Yu Gothic,Droid Sans Fallback,sans-serif">
<title>訪問前に、患者の記録をたどる。 — 架空のSlack表示例</title>
<desc>架空の名前・投稿・数値を使った説明図。実データ・実投稿の匿名化例は使用していません。実画面のキャプチャではありません。</desc>
<rect x="0" y="0" width="1100" height="1600" rx="0" fill="#f6f4ef"/>
<text x="28" y="34" font-size="14" fill="#087f5b" font-weight="bold">HERMES-MCS  /  SLACK  /  07</text>
<text x="28" y="76" font-size="32" fill="#202124" font-weight="bold">訪問前に、患者の記録をたどる。</text>
<text x="28" y="107" font-size="18" fill="#66716f">取得済み投稿の暫定集約。未取得の記録を「無い」と扱いません。</text>
<rect x="24" y="134" width="1052" height="1385" rx="12" fill="#fff" stroke="#dce2dd"/>
<rect x="24" y="134" width="142" height="1385" rx="12" fill="#351638"/>
<rect x="148" y="134" width="18" height="1385" rx="0" fill="#351638"/>
<text x="44" y="176" font-size="22" fill="#fff" font-weight="bold">MCSデモ</text>
<text x="44" y="218" font-size="14" fill="#cbbfcf">チャンネル</text>
<rect x="34" y="232" width="122" height="36" rx="6" fill="#64406a"/>
<text x="44" y="256" font-size="15" fill="#fff"># mcs-demo</text>
<text x="44" y="300" font-size="14" fill="#cbbfcf">説明用データ</text>
<path d="M166 194 L1076 194" stroke="#e1e5e2" fill="none"/>
<text x="192" y="172" font-size="22" fill="#202124" font-weight="bold"># mcs-demo</text>
<text x="1050" y="172" font-size="15" fill="#66716f" text-anchor="end">架空の表示例</text>
<text x="28" y="1555" font-size="16" fill="#66716f">説明用の画面イメージ。実際の配置はSlackのバージョン・設定で異なります。</text>
<text x="28" y="1580" font-size="15" fill="#087f5b">実データ不使用 / 画像内の操作はできません</text>
<rect x="192" y="228" width="36" height="36" rx="8" fill="#087f5b"/>
<text x="201" y="254" font-size="22" fill="#fff" font-weight="bold">M</text>
<text x="240" y="244" font-size="19" fill="#202124" font-weight="bold">MCS</text>
<rect x="292" y="228" width="38" height="20" rx="4" fill="#edf0ee"/>
<text x="298" y="243" font-size="11" fill="#66716f">APP</text>
<text x="343" y="244" font-size="14" fill="#66716f">10:02</text>
<text x="240" y="270" font-size="15" fill="#66716f">操作した本人にだけ表示</text>
<text x="240" y="304" font-size="23" fill="#202124" font-weight="bold">山田 花子 — 患者の記録まとめ（暫定集約）</text>
<text x="240" y="342" font-size="18" fill="#66716f">※ 取得済み投稿から自動作成した暫定集約です。未取得・未抽出・訂正前の記録があり得る</text>
<text x="240" y="370.8" font-size="18" fill="#66716f">ため、確定した処方一覧や依頼台帳の代わりにはなりません。原本で確認してください。</text>
<text x="240" y="411.6" font-size="18" fill="#66716f">履歴取得: 未完了（指定日より前は未取得）（取れていない記録は「無い」ではありません。</text>
<text x="240" y="440.40000000000003" font-size="18" fill="#66716f">欠落なしの保証ではありません）</text>
<text x="240" y="481.20000000000005" font-size="18" fill="#202124" font-weight="bold">抽出の処理状況（最新3投稿）: 処理中1・完了1・要確認1（完了区間4/7）</text>
<text x="240" y="510.00000000000006" font-size="16" fill="#66716f">完了は抽出処理のみ。記録や臨床情報の完全性は保証しません。</text>
<text x="240" y="554.6" font-size="19" fill="#202124">■ 薬（投稿から抽出。確定した処方ではありません）</text>
<text x="240" y="595.0" font-size="19" fill="#202124">・薬剤A（最終言及 2026-10-01）</text>
<text x="240" y="635.4" font-size="19" fill="#202124">■ 抽出されたバイタルなし</text>
<text x="240" y="675.8" font-size="19" fill="#202124">■ 次回予定（抽出表現）: 10月3日の訪問</text>
<text x="240" y="716.1999999999999" font-size="19" fill="#202124">■ 依頼候補の返信状況（記録上）: なし</text>
<text x="240" y="756.5999999999999" font-size="19" fill="#202124">■ 背景・療養情報（原記録の抜粋。現在の確定情報ではありません）</text>
<text x="240" y="796.9999999999999" font-size="19" fill="#202124">・服薬管理（投稿#701）: ご家族が服薬を管理しています。</text>
<text x="240" y="837.3999999999999" font-size="19" fill="#202124">・療養方針（投稿#701）: 本人は通所を希望されています。</text>
<text x="240" y="877.7999999999998" font-size="19" fill="#202124">※ 背景情報は抜粋です。詳しい内容や以前の記載は原記録をご確認ください。</text>
<text x="240" y="918.1999999999998" font-size="19" fill="#202124">■ MCS登録情報（チャットとは別の記録・抜粋。現在の状態を断定しません）</text>
<text x="240" y="958.5999999999998" font-size="19" fill="#202124">・薬剤登録: 取得済み（1処方期間）</text>
<text x="240" y="998.9999999999998" font-size="19" fill="#202124">・観測項目: 取得済み（1項目）</text>
<text x="240" y="1039.3999999999999" font-size="19" fill="#202124">・観測値: 取得済み 1項目</text>
<text x="240" y="1079.8" font-size="19" fill="#202124">  体重: 45.2 kg（記録日 2026-10-06）</text>
<text x="240" y="1120.2" font-size="19" fill="#202124">連携サマリー（MCS）: 未取得</text>
<text x="240" y="1160.6000000000001" font-size="19" fill="#202124">■ 未完了タスク</text>
<text x="240" y="1201.0000000000002" font-size="19" fill="#202124">・#101 次回訪問で残薬を確認 — 担当 田中さん — 期限 2026-10-03</text>
</svg>
