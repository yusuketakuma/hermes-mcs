<text x="240" y="609.4" font-size="19" fill="#202124">■ 次回予定（抽出表現）: 10月3日の訪問</text>
<text x="240" y="649.8" font-size="19" fill="#202124">連携サマリー（MCS）: 未取得</text>
<text x="240" y="690.1999999999999" font-size="19" fill="#202124">■ 未完了タスク</text>
<text x="240" y="730.5999999999999" font-size="19" fill="#202124">・#101 次回訪問で残薬を確認 — 担当 田中さん</text>
