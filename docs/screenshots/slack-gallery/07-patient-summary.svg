<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1450" viewBox="0 0 1100 1450" font-family="Noto Sans CJK JP,Hiragino Sans,Yu Gothic,Droid Sans Fallback,sans-serif">
<title>患者情報から、別スレッドの原資料へ。 — 架空のSlack表示例</title>
<desc>架空の名前・投稿・数値を使った説明図。実データ・実投稿の匿名化例は使用していません。実画面のキャプチャではありません。</desc>
<rect x="0" y="0" width="1100" height="1450" rx="0" fill="#f6f4ef"/>
<text x="28" y="34" font-size="14" fill="#087f5b" font-weight="bold">HERMES-MCS  /  SLACK  /  07</text>
<text x="28" y="76" font-size="32" fill="#202124" font-weight="bold">患者情報から、別スレッドの原資料へ。</text>
<text x="28" y="107" font-size="18" fill="#66716f">本人向けの情報確認と、同じ患者に絞った検索。すべて架空の表示例です。</text>
<rect x="24" y="134" width="1052" height="1235" rx="12" fill="#fff" stroke="#dce2dd"/>
<rect x="24" y="134" width="142" height="1235" rx="12" fill="#351638"/>
<rect x="148" y="134" width="18" height="1235" rx="0" fill="#351638"/>
<text x="44" y="176" font-size="22" fill="#fff" font-weight="bold">MCSデモ</text>
<text x="44" y="218" font-size="14" fill="#cbbfcf">チャンネル</text>
<rect x="34" y="232" width="122" height="36" rx="6" fill="#64406a"/>
<text x="44" y="256" font-size="15" fill="#fff"># mcs-demo</text>
<text x="44" y="300" font-size="14" fill="#cbbfcf">説明用データ</text>
<path d="M166 194 L1076 194" stroke="#e1e5e2" fill="none"/>
<text x="192" y="172" font-size="22" fill="#202124" font-weight="bold"># mcs-demo</text>
<text x="1050" y="172" font-size="15" fill="#66716f" text-anchor="end">架空の表示例</text>
<text x="28" y="1405" font-size="16" fill="#66716f">説明用の画面イメージ。実際の配置はSlackのバージョン・設定で異なります。</text>
<text x="28" y="1430" font-size="15" fill="#087f5b">実データ不使用 / 画像内の操作はできません</text>
<rect x="192" y="228" width="36" height="36" rx="8" fill="#087f5b"/>
<text x="201" y="254" font-size="22" fill="#fff" font-weight="bold">M</text>
<text x="240" y="244" font-size="19" fill="#202124" font-weight="bold">MCS</text>
<rect x="292" y="228" width="38" height="20" rx="4" fill="#edf0ee"/>
<text x="298" y="243" font-size="11" fill="#66716f">APP</text>
<text x="343" y="244" font-size="14" fill="#66716f">10:02</text>
<text x="240" y="270" font-size="15" fill="#66716f">操作した本人にだけ表示</text>
<text x="240" y="304" font-size="23" fill="#202124" font-weight="bold">山田 花子 — 患者の記録まとめ</text>
<text x="240" y="346" font-size="19" fill="#202124">履歴取得: 未完了（指定日より前は未取得）</text>
<text x="240" y="386.4" font-size="19" fill="#202124">■ 未完了タスク</text>
<text x="240" y="426.79999999999995" font-size="19" fill="#202124">・#101 次回訪問で残薬を確認 — 担当 田中さん</text>
<text x="240" y="467.19999999999993" font-size="19" fill="#202124">■ 背景・療養情報</text>
<text x="240" y="507.5999999999999" font-size="19" fill="#202124">・服薬管理（投稿#701）: ご家族が服薬を管理しています。</text>
<rect x="240" y="547.9999999999999" width="172" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="254" y="574.9999999999999" font-size="18" fill="#202124">患者さんの全体像</text>
<rect x="422" y="547.9999999999999" width="208" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="436" y="574.9999999999999" font-size="18" fill="#202124">前回から変わったこと</text>
<rect x="240" y="599.9999999999999" width="190" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="254" y="626.9999999999999" font-size="18" fill="#202124">訪問前の確認ノート</text>
<rect x="440" y="599.9999999999999" width="172" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="454" y="626.9999999999999" font-size="18" fill="#202124">連絡・返答の確認</text>
<rect x="622" y="599.9999999999999" width="154" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="636" y="626.9999999999999" font-size="18" fill="#202124">記録の食い違い</text>
<path d="M240 663.9999999999999 L1032 663.9999999999999" stroke="#e3e7e4" fill="none"/>
<text x="240" y="702.9999999999999" font-size="18" fill="#66716f">別画面の例：操作メニューの「この患者を検索」で「残薬」を入力</text>
<text x="240" y="749.7999999999998" font-size="23" fill="#202124" font-weight="bold">山田 花子 — 「残薬」の検索結果</text>
<text x="240" y="787.7999999999998" font-size="18" fill="#202124">表示2件（続きあり）（取得済み原資料・新しい投稿順）</text>
<text x="240" y="824.5999999999998" font-size="18" fill="#1264a3">MCSで患者ルームを開く</text>
<text x="240" y="870.5999999999998" font-size="19" fill="#202124">・10-01 09:40 投稿#701 看護師: 次回訪問時に残薬を確認してください。</text>
<rect x="240" y="908.9999999999998" width="205" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="254" y="935.9999999999998" font-size="18" fill="#202124">1 原資料を開く</text>
<text x="240" y="975.9999999999998" font-size="19" fill="#202124">・添付元 09-28 14:20 投稿#697の添付OCR 1ページ 薬剤師: 残薬の確認結果を共</text>
<text x="240" y="1006.3999999999997" font-size="19" fill="#202124">有します。</text>
<rect x="240" y="1044.7999999999997" width="205" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="254" y="1071.7999999999997" font-size="18" fill="#202124">2 原資料を開く</text>
<text x="240" y="1111.7999999999997" font-size="18" fill="#66716f">まだ調べていない範囲があります。「続きを検索」で進めます。</text>
<text x="240" y="1150.5999999999997" font-size="18" fill="#66716f">この範囲にOCR未完了・確認不能の添付が1件あります。</text>
<rect x="240" y="1197.3999999999996" width="162" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="254" y="1224.3999999999996" font-size="18" fill="#202124">続きを検索</text>
<rect x="416" y="1197.3999999999996" width="177" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="430" y="1224.3999999999996" font-size="18" fill="#202124">条件を変える</text>
<rect x="607" y="1197.3999999999996" width="140" height="40" rx="6" fill="#fff" stroke="#a9b5ae"/>
<text x="621" y="1224.3999999999996" font-size="18" fill="#202124">患者情報</text>
<text x="240" y="1277.3999999999996" font-size="18" fill="#087f5b">解析完了前でも検索できます。原資料は開くたびに再確認します。</text>
</svg>
