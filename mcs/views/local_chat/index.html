<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>患者ワークスペース | Hermes MCS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mcs.css">
  <link rel="stylesheet" href="homecare.css">
  <script src="app.js" defer></script>
  <script src="homecare.js" defer></script>
  <script src="pharmacy.js" defer></script>
</head>
<body data-mode="mcs">
  <aside id="sidebar" class="sidebar" aria-label="患者一覧">
    <div class="side-head">
      <a class="brand" href="./"><span class="brand-mark">H</span>Hermes <b>MCS</b></a>
      <span class="local-badge" title="このMac内で表示しています。閲覧による既読化・原本の変更はありません。"><span class="status-dot"></span>ローカル</span>
      <button id="close-list" class="sheet-close" type="button">閉じる</button>
    </div>
    <div id="hc-tools" class="hc-tools" hidden>
      <div id="hc-modes" class="hc-modes" role="group" aria-label="表示の切替">
        <button type="button" data-mode="mcs" class="selected">MCS</button>
        <button type="button" data-mode="pharmacy">患者台帳</button>
        <button type="button" data-mode="day">訪問予定</button>
        <button type="button" data-mode="staff">職員</button>
      </div>
      <label class="hc-actor"><span>操作者</span><select id="hc-actor"></select></label>
    </div>
    <form id="patient-form" role="search"><label class="sr-only" for="patient-search">患者名・IDで検索</label><input id="patient-search" type="search" placeholder="患者名・IDで検索" maxlength="200" autocomplete="off"><button class="sr-only">患者を検索</button></form>
    <div class="sidebar-heading">患者 <span id="patient-count"></span></div>
    <nav id="patients" aria-label="患者"></nav>
    <button id="more-patients" class="sidebar-more" hidden>患者をさらに表示</button>
  </aside>
  <div class="workspace">
    <header class="page-head">
      <button id="patients-toggle" class="patients-toggle" type="button" aria-controls="sidebar" aria-expanded="false">患者</button>
      <div class="page-title">
        <h1 id="patient-name">患者ワークスペース</h1>
        <div class="page-sub"><span id="patient-meta" class="page-meta">患者を読込中…</span><span id="read-only" class="chip chip-muted mcs-only">閲覧専用</span><span id="patient-chips" class="chips"></span></div>
      </div>
      <div id="heading-actions" class="heading-actions"></div>
      <span id="snapshot-time" class="snapshot-time mcs-only">スナップショットを読込中…</span>
      <button id="refresh" class="button" type="button">更新</button>
    </header>
    <div id="error" class="error" role="alert" hidden></div>
    <section id="patient-context" class="patient-context mcs-only" aria-label="患者コンテキスト"></section>
    <div class="view-bar mcs-only">
      <div id="view-tabs" class="view-tabs"></div>
      <form id="message-form" role="search"><label class="sr-only" for="message-search">この患者の本文・投稿者を検索</label><input id="message-search" type="search" placeholder="本文・投稿者を検索" maxlength="500" autocomplete="off"><button class="button">検索</button><button id="clear-search" class="text-button" type="button" hidden>解除</button></form>
    </div>
    <div class="content">
      <main id="timeline-panel" aria-label="本文"><section id="panel-view" class="panel-view" aria-live="polite" hidden></section><div id="coverage" class="coverage" hidden></div><button id="older" class="load-more" hidden>以前の投稿を表示</button><div id="timeline"></div><div id="timeline-status" class="empty" role="status">患者を読込中…</div></main>
      <aside id="side-status" class="side-status mcs-only" aria-label="いまの状況"></aside>
      <aside id="detail" class="detail mcs-only" aria-label="投稿の詳細"><div class="detail-heading"><h2>投稿の詳細</h2><button id="close-detail" class="text-button" type="button" hidden>閉じる</button></div><div id="detail-content"></div></aside>
    </div>
  </div>
</body>
</html>
