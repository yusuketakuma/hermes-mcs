[tool.ruff]
# The runtime is Python 3.14. The updater path still runs on the
# pre-migration interpreter (>= 3.10); tests/meta/test_updater_py310_grammar.py
# keeps that path parseable under 3.10 grammar.
target-version = "py314"

[tool.ruff.lint]
# CI (.github/workflows/ci.yml) runs a bare `ruff check` — keep the
# selection here so local runs and CI use the same rule set.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests", "integration"]
addopts = "-q"
