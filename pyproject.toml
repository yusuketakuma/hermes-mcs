[tool.ruff]
# The runtime is Python 3.14. The updater path still runs on the
# pre-migration interpreter (>= 3.10); tests/meta/test_updater_py310_grammar.py
# keeps that path parseable under 3.10 grammar.
target-version = "py314"

[tool.ruff.lint]
# CI (.github/workflows/ci.yml) runs `make lint` (ruff over the Makefile's
# LINT_PATHS) — keep the selection here so local runs and CI use the same
# rule set.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# adapters/sdc/contracts/ は CSDC 契約の byte 一致固定コピー（contracts/README.md）。
# byte 一致が要件で手修正できない interfaces.pyi の class 一行定義スタイル
# （E701）のみを対象外とする。契約 tree 全体・他 rule は対象外のまま。
"adapters/sdc/contracts/mcs-auto/v3/interfaces.pyi" = ["E701"]

[tool.pytest.ini_options]
testpaths = ["tests", "integration"]
addopts = "-q"
tmp_path_retention_policy = "failed"
